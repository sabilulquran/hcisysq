openapi: 3.1.0
info:
  title: HCIS Payroll API
  version: 0.0.1
  description: >-
    PAY-003 v1 payroll period lifecycle. Periods and their transitions only; the
    calculation, the period inputs and the reports arrive in their own steps.
    Every response is Cache-Control no-store (specification section 8).
tags:
  - name: Payroll

paths:
  /payroll/periods:
    get:
      tags: [Payroll]
      operationId: listPayrollPeriods
      summary: List payroll periods, newest month first
      description: >-
        Open to everyone who has a decision to make about a period, not only to
        whoever runs it: payroll.periods.manage, payroll.approve,
        payroll.reopen.approve, payroll.payments.confirm or
        payroll.reports.read.organization.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Periods the actor may run, each with the actions available to them
          content:
            application/json:
              schema:
                type: object
                required: [page, pageSize, total, periods]
                properties:
                  page: { type: integer }
                  pageSize: { type: integer }
                  total:
                    type: integer
                    description: Every period on record, so a list can say what it is not showing.
                  periods:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollPeriod' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
    post:
      tags: [Payroll]
      operationId: createPayrollPeriod
      summary: Create the payroll period for one month
      description: >-
        Requires payroll.periods.manage. The cutoff window defaults to the 23rd of
        the previous month through the 22nd of the pay month, and the pay date to
        the 25th; both may be given explicitly. One period per month per kind per
        legal entity is enforced by the database. PAY-003-THR
        (docs/domain/payroll-thr.md): kind THR needs payDate, holidayDate and
        holidayName, with payDate before holidayDate; the THR policy's deadline in
        days before the holiday is checked when calculating
        (409 PAYROLL_THR_PAY_DATE_LATE). A THR period accepts only the ADJUSTMENT
        and THR_AVERAGE_WAGE inputs (409 PAYROLL_INPUT_NOT_FOR_THR), offers no
        attendance resolve (409 PAYROLL_OPERATION_NOT_FOR_THR), and its slips are
        kind THR. Honorarium and daily workers (KONTRAK_HONORER, LEPAS) are paid
        THR on the average of what the approved salary periods before the THR
        month paid them (payroll-thr.md T5, section 2.1); a row the system does
        not fully cover and nobody typed THR_AVERAGE_WAGE for carries the blocker
        THR_AVERAGE_WAGE_INCOMPLETE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodMonth]
              properties:
                periodMonth:
                  type: string
                  format: date
                  description: First day of the payroll month, Asia/Jakarta.
                payDate: { type: string, format: date }
                cutoffStart: { type: string, format: date }
                cutoffEnd: { type: string, format: date }
                legalEntityKey:
                  type: [string, 'null']
                  format: uuid
                  description: Reserved for ORG-007; null is the implicit YSQ default.
                kind: { type: string, enum: [REGULAR, THR], default: REGULAR }
                holidayDate: { type: string, format: date, description: 'THR only: the holiday service is counted to.' }
                holidayName: { type: string, maxLength: 120, description: 'THR only, e.g. Idul Fitri 1448 H.' }
      responses:
        '201':
          description: Period created
          content:
            application/json:
              schema:
                type: object
                required: [period]
                properties:
                  period: { $ref: '#/components/schemas/PayrollPeriod' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '409':
          description: A period for that month already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/periods/{periodId}:
    get:
      tags: [Payroll]
      operationId: getPayrollPeriod
      summary: Read one payroll period and its decision history
      description: >-
        Same read permissions as the list. The transition log carries the reasons
        given when a period was returned, reopened or had a reopen rejected.
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The period, the actions available to this actor, and its transitions
          content:
            application/json:
              schema:
                type: object
                required: [period, transitions]
                properties:
                  period: { $ref: '#/components/schemas/PayrollPeriod' }
                  transitions:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollPeriodTransition' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }

  /payroll/periods/{periodId}/inputs:
    get:
      tags: [Payroll]
      operationId: listPayrollPeriodInputs
      summary: Read the period's inputs
      description: >-
        One input row is one person's rapel, penyesuaian or other income, so it is
        a per-person figure (specification section 7.3). Requires
        payroll.results.read.organization, payroll.calculate or payroll.inputs.manage; payroll.periods.manage alone is refused.
        Before approval only payroll.calculate or payroll.inputs.manage holders
        read it. Every read is recorded (scope period_inputs).
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Every input recorded for the period
          content:
            application/json:
              schema:
                type: object
                required: [inputs]
                properties:
                  inputs:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollPeriodInput' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
    put:
      tags: [Payroll]
      operationId: savePayrollPeriodInputs
      summary: Record or replace period inputs
      description: >-
        Requires payroll.inputs.manage, and only while the period is COLLECTING or
        CALCULATED. Each row replaces the value for its employment and key, so
        sending the same batch twice leaves the same state. ADJUSTMENT, ARREARS,
        PRORATION_FACTOR, FULL_PAY_DESPITE_LEAVING and THR_AVERAGE_WAGE need a
        reason, and ADJUSTMENT and THR_AVERAGE_WAGE also need the decision they
        rest on. Nobody may record inputs for their own employment.
        THR_AVERAGE_WAGE (PAY-003-THR T5) is the average monthly wage of one
        honorarium or daily worker for a THR period, a positive whole rupiah; it
        is accepted on a THR period only (409 PAYROLL_INPUT_ONLY_FOR_THR on a
        monthly period), and a THR period accepts nothing but it and ADJUSTMENT
        (409 PAYROLL_INPUT_NOT_FOR_THR).
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [employmentId, inputKey, value]
                    properties:
                      employmentId: { type: string, format: uuid }
                      inputKey: { $ref: '#/components/schemas/PayrollInputKey' }
                      value: { type: number }
                      origin:
                        type: string
                        enum: [ATTENDANCE, MANUAL, IMPORT]
                        default: MANUAL
                      reason: { type: string, maxLength: 500 }
                      decisionReference: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The period's inputs after the write
          content:
            application/json:
              schema:
                type: object
                required: [inputs]
                properties:
                  inputs:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollPeriodInput' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403':
          description: No payroll.inputs.manage, or the row is the actor's own employment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: The period has left COLLECTING and CALCULATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/periods/{periodId}/inputs/from-attendance:
    post:
      tags: [Payroll]
      operationId: resolvePayrollAttendanceInputs
      summary: Fill the period's attendance-derived inputs
      description: >-
        Requires payroll.inputs.manage, and only while the period is COLLECTING or
        CALCULATED. Reads approved overtime (ATT-010) for permanent and probation
        employments, and, for contract workers, the working days with a recorded
        check-in, or with an approved field assignment (ATT-015) and no check-in,
        inside the period's cutoff window; remote-work days without a check-in do
        not count. Both are stored as ordinary
        period inputs with origin ATTENDANCE. It replaces the whole set: a row an
        earlier resolve wrote and attendance no longer supports is removed, so a
        cancelled overtime request stops being paid. A correction typed by hand is
        overwritten too, which is why this is an explicit action rather than part
        of the calculation. The actor's own employment is left alone.
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: How many employments each key produced, and the period's inputs afterwards
          content:
            application/json:
              schema:
                type: object
                required: [overtimeCount, attendanceCount, clearedCount, skippedOwnCount, inputs]
                properties:
                  overtimeCount: { type: integer }
                  attendanceCount: { type: integer }
                  clearedCount:
                    type: integer
                    description: Rows an earlier resolve wrote that attendance no longer supports.
                  skippedOwnCount:
                    type: integer
                    description: Rows left alone because they belong to the actor's own employment.
                  inputs:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollPeriodInput' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: The period has left COLLECTING and CALCULATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/periods/{periodId}/inputs/{employmentId}/{inputKey}:
    delete:
      tags: [Payroll]
      operationId: deletePayrollPeriodInput
      summary: Remove one period input
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: employmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: inputKey
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PayrollInputKey' }
      responses:
        '204': { description: The input is gone }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: The period has left COLLECTING and CALCULATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/periods/{periodId}/results:
    get:
      tags: [Payroll]
      operationId: listPayrollPeriodResults
      summary: Read the latest calculation of every employee in the period
      description: >-
        Per-person pay, so every read is recorded as a sensitive access
        (payroll.report.read). Requires payroll.results.read.organization, payroll.calculate or payroll.inputs.manage
        (specification section 7.3); payroll.periods.manage,
        payroll.reports.read.organization, payroll.approve and
        payroll.payments.confirm alone are refused. payroll.results.read.organization
        holders see the figures only once the period is approved, while
        payroll.calculate and payroll.inputs.manage holders see them throughout
        (specification section 6).
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The latest revision of each employee, with its component lines
          content:
            application/json:
              schema:
                type: object
                required: [results, lines, employees]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollResult' }
                  lines:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollResultLine' }
                  employees:
                    description: Who each employment in the period belongs to, so a reviewer reads names.
                    type: array
                    items: { $ref: '#/components/schemas/PayrollEmployeeIdentity' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }

  /payroll/periods/{periodId}/report:
    get:
      tags: [Payroll]
      operationId: getPayrollPeriodReport
      summary: Read the period's totals per unit and per component
      description: >-
        The payroll report. It carries no bank account anywhere: the accounts live
        in the transfer list, which has its own permission (specification section
        7). Requires payroll.reports.read.organization or one of the per-person
        read permissions (payroll.results.read.organization, payroll.calculate or payroll.inputs.manage); payroll.periods.manage
        alone is refused (section 7.3). Report readers see it once the period is
        approved; payroll.calculate and payroll.inputs.manage holders see it
        throughout. Every read is recorded.
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Totals, per unit and per component
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report: { $ref: '#/components/schemas/PayrollPeriodReport' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: The period is not approved yet, and the reader does not run it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/periods/{periodId}/transfers:
    get:
      tags: [Payroll]
      operationId: getPayrollTransferList
      summary: Read the transfer list for the period
      description: >-
        One row per recipient with the account to pay into. Requires
        payroll.transfers.read.organization, which only finance holds: neither the
        director nor human capital sees account numbers here. Available once the
        period is approved. Every read and every export is recorded as a sensitive
        access. With format=csv it returns a UTF-8 CSV attachment, still no-store.
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: The recipients to pay, as JSON or as a CSV attachment
          content:
            application/json:
              schema:
                type: object
                required: [transfers]
                properties:
                  transfers:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollTransferRow' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: The period is not approved yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/periods/{periodId}/pph21:
    get:
      tags: [Payroll]
      operationId: getPayrollPph21Report
      summary: Read the PPh21 TER report for the period's masa pajak
      description: >-
        PAY-003 sections 5.3 and 7.2. One row per person (two employments of one
        person in the period are added up before the bracket lookup) from the
        latest calculation run: gross actually paid (every EARNING line except
        BPJS_KES_ALLOW and REIMBURSE, through the pay factor and rounded up like
        the payable), plus the BPJS Kesehatan premium the yayasan pays
        (BPJS_KES_ALLOW, whole, outside the pay factor) when
        PPH21_SETTINGS.employerHealthPremiumTaxable is in force on the masa
        pajak's pay date (owner decision 2026-11-17, section 7.6; `settings`
        says whether it is, and `employerHealthPremium` how much of the gross it
        is), the TER category mapped
        from the PTKP status, the rate of the first bracket whose upper bound
        reaches the gross, and PPh21 = floor(gross x rate). Results with a blocker
        are not reported. Flags: PTKP_MISSING (no or unmapped status, tax null),
        PTKP_CONFLICT (two employments with different statuses, tax null),
        EXCLUDED (profile exclusion with its reason, out of the totals, listed
        last), ANNUAL_CALCULATION_REQUIRED (December, or service ending inside the
        period with no employment continuing past it; the TER figure is shown but
        is not final), NON_PERMANENT_TERMS (KONTRAK_HONORER or LEPAS on the pay
        date; monthly TER under 21-100-01 by the owner decision of 2026-11-17),
        INCLUDES_THR (the month's gross includes an approved THR
        period of the same month, PAY-003-THR T10). The masa pajak is the period
        month, and the report reads every approved period of that month and legal
        entity, salary and THR together; `periods` names them and
        `pendingPeriodCount` the ones not yet approved. Requires
        payroll.results.read.organization, payroll.calculate or payroll.inputs.manage (section 7.3);
        payroll.periods.manage or payroll.reports.read.organization alone is refused. Available
        only once the period is approved (DRAFT), because it is built from final
        results. No NIK or NPWP. Every read and every export is
        recorded as sensitive access (scope pph21_report / pph21_report_csv). With
        format=csv it returns a UTF-8 CSV with a byte order mark and CRLF line
        endings named pph21-ter-YYYY-MM.csv, still no-store.
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: The report, as JSON or as a CSV attachment
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report: { $ref: '#/components/schemas/PayrollPph21Report' }
            text/csv:
              schema:
                type: string
                description: >-
                  Columns NIP, Nama, Status PTKP, Kategori TER, Penghasilan bruto,
                  Tarif, PPh21, Kode objek, Dilaporkan (Y/N), Catatan. Excluded
                  people last.
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: >-
            PAYROLL_NOT_APPROVED_YET before approval; PPH21_TER_POLICY_MISSING when
            no PPH21_TER version is effective on the pay date;
            PPH21_SETTINGS_POLICY_INVALID when the effective PPH21_SETTINGS row (§7.5) does not parse;
            PPH21_TER_POLICY_INVALID when the effective version does not have the
            required shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/pph21/annual:
    get:
      tags: [Payroll]
      operationId: getPayrollPph21Annual
      summary: Read the annual PPh21 (Pasal 17) recap of one tax year
      description: >-
        PAY-003 section 7.4. One row per span of service in the year (a person who
        leaves and returns has two). A span closes on its final masa pajak
        (December, or the month service ends with no employment continuing). For a
        closed span: gross = the monthly reportable gross of every final period of
        the span; biaya jabatan = min(rate x gross, monthlyCap x months, annualCap);
        net = gross - biaya jabatan - employee pension/JHT contribution; PKP = net -
        PTKP (status at the start of the span), rounded down to pkpRoundingUnit;
        annual tax = Pasal 17 layers on PKP; final masa tax = annual tax - TER of
        the earlier months (negative = lebih potong). Open spans carry no annual
        figures. Flags OPEN, PTKP_MISSING, PRIOR_TAX_INCOMPLETE. All values from the
        PPH21_ANNUAL policy effective on 31 December. Requires
        payroll.results.read.organization, payroll.calculate or payroll.inputs.manage.
        JSON says only whether NIK/NPWP are on file; format=csv (the e-Bupot 1721-A1
        recap, pph21-tahunan-YYYY.csv, UTF-8 BOM, CRLF) prints them. Every read is
        recorded (scope pph21_annual / pph21_annual_csv) without figures or numbers.
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, minimum: 2024, maximum: 2100 }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: The recap, as JSON or as a CSV attachment
          content:
            application/json:
              schema:
                type: object
                required: [annual]
                properties:
                  annual: { $ref: '#/components/schemas/PayrollPph21Annual' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '409':
          description: PPH21_ANNUAL_POLICY_MISSING or PPH21_ANNUAL_POLICY_INVALID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/pph21/annual/{year}/employees/{employeeId}/a1/{index}:
    get:
      tags: [Payroll]
      operationId: getPayrollPph21A1
      summary: Read one person's bukti potong 1721-A1
      description: >-
        PAY-003 section 7.4. The closed span with that index, the pemotong from the
        policy, the employee's NIK and NPWP opened for this document only, and the
        signer resolved like PAYSLIP-005. Same readers as the annual recap; every
        read is recorded as payroll.a1.read without figures or numbers. 409
        PPH21_A1_NOT_FINAL while the span is open; 404 PPH21_A1_NOT_FOUND.
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer } }
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema:
                type: object
                required: [a1]
                properties:
                  a1: { $ref: '#/components/schemas/PayrollPph21A1' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: PPH21_A1_NOT_FINAL, PPH21_A1_PERIOD_PENDING (a period of the year up to the end of the span is not final), or the PPH21_ANNUAL policy is missing or invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/me/a1:
    get:
      tags: [Payroll]
      operationId: listOwnPayrollPph21A1
      summary: List the signed-in employee's own bukti potong 1721-A1
      description: >-
        Self-service, active employee with an active account. Closed spans whose
        final masa pajak period is PUBLISHED (DRAFT). No figures.
      responses:
        '200':
          description: Own bukti potong
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [year, index, startPeriod, endPeriod]
                      properties:
                        year: { type: integer }
                        index: { type: integer }
                        startPeriod: { type: string, example: '2026-01' }
                        endPeriod: { type: string, example: '2026-12' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }

  /payroll/me/a1/{year}/{index}:
    get:
      tags: [Payroll]
      operationId: getOwnPayrollPph21A1
      summary: Open the signed-in employee's own bukti potong 1721-A1 for printing
      description: >-
        Same document as the HC route, only for the own published span; anything
        else is 404. Recorded as payroll.a1.read (scope pph21_a1_self).
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer } }
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema:
                type: object
                required: [a1]
                properties:
                  a1: { $ref: '#/components/schemas/PayrollPph21A1' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }

  /payroll/employees/{employeeId}/tax-identity:
    get:
      tags: [Payroll]
      operationId: getPayrollTaxIdentity
      summary: Whether NIK and NPWP are on file, masked to the last four digits
      description: Requires payroll.profiles.manage. Never returns the numbers.
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Masked identity
          content:
            application/json:
              schema:
                type: object
                required: [taxIdentity]
                properties:
                  taxIdentity: { $ref: '#/components/schemas/PayrollTaxIdentity' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
    put:
      tags: [Payroll]
      operationId: putPayrollTaxIdentity
      summary: Record or clear NIK and NPWP
      description: >-
        Requires payroll.profiles.manage, never on the holder's own record
        (PAYROLL_SELF_EDIT_FORBIDDEN). A field not sent is kept; null or empty
        clears it. NIK 16 digits, NPWP 15 or 16 digits; dots, dashes and spaces are
        ignored. Stored sealed (AES-256-GCM); the audit event
        payroll.tax_identity.updated names the fields, never the values.
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nik: { type: string, nullable: true }
                npwp: { type: string, nullable: true }
      responses:
        '200':
          description: Masked identity after the change
          content:
            application/json:
              schema:
                type: object
                required: [taxIdentity]
                properties:
                  taxIdentity: { $ref: '#/components/schemas/PayrollTaxIdentity' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }

  /payroll/periods/{periodId}/variance:
    get:
      tags: [Payroll]
      operationId: getPayrollPeriodVariance
      summary: Compare the period against the one before it
      description: >-
        What moved per employee and component since the previous period of the
        same legal entity. A component is reported only when it clears both the
        absolute and the relative threshold, so small components stay quiet; the
        threshold comes from policy and falls back to the specification's default.
        An employee who appears or leaves is reported once, not once per component.
        The first period answers with an empty comparison rather than an error.
        Names people and their amounts, so it requires payroll.results.read.organization, payroll.calculate or payroll.inputs.manage
        (section 7.3); before approval only payroll.calculate or
        payroll.inputs.manage holders read it.
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The differences worth a reviewer's attention
          content:
            application/json:
              schema:
                type: object
                required: [previousPeriodId, threshold, variances, employees]
                properties:
                  previousPeriodId: { type: [string, 'null'], format: uuid }
                  threshold:
                    type: [object, 'null']
                    properties:
                      relative: { type: number }
                      absolute: { type: number }
                      manualInput: { type: number }
                  variances:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollVarianceRow' }
                  employees:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollEmployeeIdentity' }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: The period is not approved yet, and the reader does not run it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/periods/{periodId}/payslips:
    post:
      tags: [Payroll]
      operationId: draftPayrollPayslips
      summary: Write the period's results as payslip drafts
      description: >-
        Requires payroll.periods.manage, and only once the payment is confirmed:
        drafting earlier would put a figure in front of an employee that nobody
        has paid. It drafts, it does not publish: publishing is a separate call
        that asks for payslips.publish, so the decision to show a slip to an
        employee stays where PAY-002 put it. A slip that was never published is
        updated in place; a published
        one is never edited, and a correction after an approved reopen becomes a
        revision beside it with the earlier slip still readable. Running it again
        when nothing moved changes nothing. A standing blocker refuses the whole
        run. The lines follow the PAYSLIP_LAYOUT policy in force on the period's
        pay date (section 7.6): with `employerBlock` the BPJS Kesehatan
        contribution the yayasan bears is listed neither as income nor as a
        deduction, "Total pendapatan" and "Total potongan" leave it out, and it
        is written with PPH21_EMPLOYER as lines of section `employer`; net pay
        and the payable are unchanged. Without a version the earlier layout is
        written.
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: How many slips were drafted, revised, or already current
          content:
            application/json:
              schema:
                type: object
                required: [drafted, revised, alreadyCurrent, importConflicts]
                properties:
                  drafted: { type: integer }
                  revised: { type: integer }
                  alreadyCurrent: { type: integer }
                  importConflicts:
                    type: array
                    description: >-
                      Employee numbers whose current slip belongs to a PAY-001
                      import batch. Payroll leaves those slips alone so the batch
                      can still publish them.
                    items: { type: string }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: >-
            The payment is not confirmed yet, a blocker stands, the period has
            no result to draft from, or PAYSLIP_LAYOUT_POLICY_INVALID: the
            PAYSLIP_LAYOUT version in force on the pay date does not parse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/periods/{periodId}/payslips/publish:
    post:
      tags: [Payroll]
      operationId: publishPayrollPayslips
      summary: Publish the period's payslip drafts
      description: >-
        Requires payslips.publish, the same permission the PAY-002 batch publish
        asks for: calculating payroll does not move that decision. The batch path
        publishes by import batch and cannot see a slip that came from a period,
        which is why payroll has its own door. Only drafts of this period that are
        current and unpublished are affected, and each employee is notified once.
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: How many slips were published
          content:
            application/json:
              schema:
                type: object
                required: [published]
                properties:
                  published: { type: integer }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '409':
          description: The period is not in a paid state, or has no draft to publish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

  /payroll/periods/{periodId}/transitions:
    post:
      tags: [Payroll]
      operationId: transitionPayrollPeriod
      summary: Move a payroll period through its lifecycle
      description: >-
        Each action carries its own permission: start_collecting and publish need
        payroll.periods.manage, calculate needs payroll.calculate, submit needs
        payroll.submit, return and approve need payroll.approve, confirm_payment
        needs payroll.payments.confirm, and the reopen decisions need
        payroll.reopen.approve. The account that submitted a period cannot approve
        it. The calculate action runs the engine over the period and stores a new
        revision of every employee's result before the state moves; it is refused
        with PAYROLL_POLICY_MISSING when no policy version covers the pay date.
        Submission requires a calculation newer than every input and no
        blocker; approval requires no blocker, and does not ask for a fresh
        calculation the director could not run. Repeating an action that already
        happened is refused with PAYROLL_STATE_CONFLICT, since the period has
        left the state that action starts from, and a transition written against
        a stale version is refused the same way rather than applied twice.
        LOAN-001 Package 2: approve records each deduction on a LOAN-001 loan as a
        PAYROLL_DEDUCTION payment in the same transaction and is refused with
        PAYROLL_LOAN_BALANCE_CHANGED when a loan no longer has room for it, and with
        PAYROLL_REIMBURSEMENT_CHANGED when the slips' REIMBURSE lines and the
        handed-off reimbursements disagree (the
        director returns the period); approve_reopen reverses the loan payments and
        the reimbursement handoff rows (the reimbursement payment itself is immutable).
        PAY-003-THR T5: approving a THR period is refused with
        PAYROLL_THR_AVERAGE_WAGE_STALE when a salary period one of its
        system-averaged honorarium rows read has been reopened since the
        calculation (the director returns the period and it is recalculated).
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum:
                    - start_collecting
                    - calculate
                    - submit
                    - return
                    - approve
                    - confirm_payment
                    - publish
                    - request_reopen
                    - approve_reopen
                    - reject_reopen
                reason:
                  type: string
                  maxLength: 500
                  description: Required for return, request_reopen and reject_reopen.
      responses:
        '200':
          description: The period after the transition
          content:
            application/json:
              schema:
                type: object
                required: [period, applied]
                properties:
                  period: { $ref: '#/components/schemas/PayrollPeriod' }
                  applied: { type: boolean }
        '400': { $ref: '#/components/responses/PayrollBadRequest' }
        '401': { $ref: '#/components/responses/PayrollUnauthenticated' }
        '403': { $ref: '#/components/responses/PayrollForbidden' }
        '404': { $ref: '#/components/responses/PayrollNotFound' }
        '409':
          description: >-
            The transition is refused: wrong state, a missing reason, the submitter
            approving, standing blockers, a stale calculation, or another actor
            moved the period first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollError' }

components:
  schemas:
    PayrollError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - PAYROLL_FORBIDDEN
            - PAYROLL_STATE_CONFLICT
            - PAYROLL_REASON_REQUIRED
            - PAYROLL_SELF_APPROVAL
            - PAYROLL_BLOCKERS_PRESENT
            - PAYROLL_CALCULATION_STALE
            - PAYROLL_REOPEN_STATE_MISSING
            - PAYROLL_LOAN_BALANCE_CHANGED
            - PAYROLL_REIMBURSEMENT_CHANGED
            - PAYROLL_THR_AVERAGE_WAGE_STALE
            - PAYROLL_INPUT_NOT_FOR_THR
            - PAYROLL_INPUT_ONLY_FOR_THR
            - PAYROLL_PERIOD_EXISTS
            - PAYROLL_PERIOD_NOT_FOUND
            - PAYROLL_INVALID_PERIOD
            - PAYROLL_INVALID_QUERY
            - PAYROLL_INVALID_TRANSITION
            - PAYROLL_INVALID_INPUT
            - PAYROLL_DECISION_REQUIRED
            - PAYROLL_OWN_RECORD
            - PAYROLL_INPUT_NOT_FOUND
            - PAYROLL_POLICY_MISSING
            - PAYROLL_NOT_APPROVED_YET
            - PAYROLL_NOTHING_TO_PUBLISH
            - PPH21_TER_POLICY_MISSING
            - PPH21_TER_POLICY_INVALID
            - PPH21_SETTINGS_POLICY_INVALID
            - PAYSLIP_LAYOUT_POLICY_INVALID
            - UNAUTHENTICATED
        message: { type: string }
        problems:
          type: array
          description: Present on PAYROLL_POLICY_MISSING; one entry per policy that is missing, duplicated or malformed.
          items:
            type: object
            properties:
              policyKey: { type: string }
              code: { type: string, enum: [MISSING, DUPLICATE, INVALID] }
              message: { type: string }

    PayrollInputKey:
      type: string
      enum:
        - OVERTIME_HOURS
        - CONTRACT_ATTENDANCE_DAYS
        - CONTRACT_TEACHING_HOURS
        - CHILD_EDUCATION
        - PJ_MEDIA
        - ARREARS
        - ADJUSTMENT
        - PRORATION_FACTOR
        - FULL_PAY_DESPITE_LEAVING
        - OTHER_INCOME
        - TEACHING_HOURS_PER_WEEK_OVERRIDE
        - ANNUAL_PERFORMANCE_OVERRIDE
        - MONTHLY_PERFORMANCE_OVERRIDE
        - THR_AVERAGE_WAGE

    PayrollPeriodInput:
      type: object
      required: [employmentId, inputKey, value, origin, recordedAt]
      properties:
        employmentId: { type: string, format: uuid }
        inputKey: { $ref: '#/components/schemas/PayrollInputKey' }
        value: { type: string, description: Rupiah, hours, days or a factor, depending on inputKey. }
        origin: { type: string, enum: [ATTENDANCE, MANUAL, IMPORT] }
        reason: { type: [string, 'null'] }
        decisionReference: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }

    PayrollEmployeeIdentity:
      type: object
      required: [employmentId, employeeNumber, fullName]
      properties:
        employmentId: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }

    PayrollResult:
      type: object
      required: [employmentId, revision, gross, deductions, net, payable]
      properties:
        employmentId: { type: string, format: uuid }
        revision: { type: integer }
        gross: { type: string }
        deductions: { type: string }
        net: { type: string }
        payable: { type: string }
        employerCost: { type: string }
        payFactor: { type: string }
        payFactorReason: { type: string, enum: [none, proration, early_service] }
        bpjsBase: { type: string }
        blockers: { type: array, items: { type: object } }
        calculatedAt: { type: string, format: date-time }
        thrAverageWage:
          description: >-
            PAY-003-THR T5 (payroll-thr.md section 2.1): on a THR period, how the
            month of wages of an honorarium or daily worker was arrived at. Null
            for a salaried employee and on a monthly period. A per-person figure,
            read under the same permissions as the result itself.
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/PayrollThrAverageWage' }

    PayrollThrAverageWage:
      type: object
      required: [source, requiredMonths, coveredMonths, monthsWithPay, systemTotal, monthlyWage]
      properties:
        source:
          type: string
          enum: [SYSTEM, HC_INPUT, NONE]
          description: >-
            SYSTEM: the average of the approved salary periods, every required
            month covered. HC_INPUT: the THR_AVERAGE_WAGE typed for this
            employment. NONE: neither; the row carries THR_AVERAGE_WAGE_INCOMPLETE.
        windowStart: { type: [string, 'null'], description: First required month, YYYY-MM. }
        windowEnd: { type: [string, 'null'], description: Last required month, YYYY-MM. }
        requiredMonths:
          type: integer
          description: The months before the THR month the rule asks for, from the month of TMT on, at most the policy's fullServiceMonths.
        coveredMonths: { type: integer, description: Required months that have an approved salary period. }
        monthsWithPay: { type: integer, description: Covered months in which the employment was paid a counted wage. }
        systemTotal: { type: integer, description: Counted wages over the covered months, whole rupiah. }
        systemAverage:
          type: [integer, 'null']
          description: systemTotal over the required months, rounded up; null unless every required month is covered.
        partialAverage:
          type: [integer, 'null']
          description: systemTotal over the covered months only. A reference for the reviewer, never the basis.
        monthlyWage: { type: integer, description: The month of wages the THR was taken from; 0 when blocked. }
        hcInput: { type: [integer, 'null'], description: The THR_AVERAGE_WAGE typed for this employment, if any. }
        periods:
          type: array
          description: The approved salary periods the system figure read, with the reopen count they were read at.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              month: { type: string }
              reopenCount: { type: integer }

    PayrollResultLine:
      type: object
      required: [employmentId, componentCode, category, amount, displayOrder]
      properties:
        employmentId: { type: string, format: uuid }
        componentCode: { type: string }
        category: { type: string, enum: [EARNING, DEDUCTION, EMPLOYER_COST] }
        amount: { type: string }
        basis: { type: [string, 'null'] }
        displayOrder: { type: integer }

    PayrollPeriodReport:
      type: object
      required: [totals, byUnit, byComponent]
      properties:
        totals:
          type: object
          properties:
            employeeCount: { type: integer }
            gross: { type: string }
            deductions: { type: string }
            net: { type: string }
            payable: { type: string }
            employerCost: { type: string }
            blockerCount: { type: integer }
        byUnit:
          type: array
          items:
            type: object
            properties:
              unitRef: { type: [string, 'null'], format: uuid }
              employeeCount: { type: integer }
              payable: { type: string }
        byComponent:
          type: array
          items:
            type: object
            properties:
              componentCode: { type: string }
              category: { type: string, enum: [EARNING, DEDUCTION, EMPLOYER_COST] }
              employeeCount: { type: integer }
              amount: { type: string }
        employerCostSummary:
          type: object
          description: "BPJS Kesehatan (BPJS_KES_ALLOW) and PPh21 (PPH21_EMPLOYER, only when PPH21_SETTINGS.employerBorne) the yayasan bears; period aggregates (§7.5)."
          properties:
            bpjsKesehatan: { type: string }
            pph21: { type: string }
            total: { type: string }
        payslipTotals:
          type: object
          required: [employerBlock, gross, deductions]
          description: >-
            "Total pendapatan" and "Total potongan" as the payslips of this period
            state them (section 7.6); period aggregates. `totals.gross` and
            `totals.deductions` are the calculation's own and still carry the
            BPJS Kesehatan allowance and its equal deduction. With
            PAYSLIP_LAYOUT.employerBlock in force on the pay date the slips leave
            that pair out, so both figures here are lower by it; otherwise they
            equal the totals. Net and payable are the same either way.
          properties:
            employerBlock: { type: boolean, description: Whether the slips of this period use the block layout. }
            gross: { type: string }
            deductions: { type: string }

    PayrollTransferRow:
      type: object
      required: [employeeNumber, fullName, payable]
      properties:
        employeeNumber: { type: string }
        fullName: { type: string }
        unitRef: { type: [string, 'null'], format: uuid }
        payable: { type: string }
        bankName: { type: [string, 'null'] }
        bankAccountNumber: { type: [string, 'null'] }
        bankAccountName: { type: [string, 'null'] }
        paymentConfirmedAt: { type: [string, 'null'], format: date-time }

    PayrollPph21AnnualSegment:
      type: object
      description: One span of service in a tax year. Rupiah as decimal strings; null where not determinable.
      required: [employeeId, employeeNumber, fullName, index, startPeriod, endPeriod, monthCount, closed, lines, gross, positionCost, pensionContribution, deductions, net, flags, note]
      properties:
        employeeId: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }
        index: { type: integer }
        startPeriod: { type: string, example: '2026-01' }
        endPeriod: { type: string, example: '2026-12' }
        monthCount: { type: integer }
        closed: { type: boolean }
        ptkpStatus: { type: string, nullable: true }
        lines:
          type: object
          description: 1721-A1 lines salary, taxAllowance, otherAllowances, honorarium, insurancePremium, inKind, bonusThr.
          additionalProperties: { type: string }
        gross: { type: string }
        positionCost: { type: string }
        pensionContribution: { type: string }
        deductions: { type: string }
        net: { type: string }
        ptkp: { type: string, nullable: true }
        pkp: { type: string, nullable: true }
        annualTax: { type: string, nullable: true }
        terWithheld: { type: string, nullable: true }
        finalMasaTax: { type: string, nullable: true }
        flags:
          type: array
          items: { type: string, enum: [OPEN, PTKP_MISSING, PRIOR_TAX_INCOMPLETE, PERIOD_PENDING] }
        note: { type: string }
    PayrollPph21Annual:
      type: object
      required: [year, objectCode, policy, pendingPeriods, periodsWithoutTer, totals, rows]
      properties:
        year: { type: integer }
        objectCode: { type: string, example: '21-100-01' }
        policy:
          type: object
          properties:
            versionId: { type: string }
            effectiveFrom: { type: string, format: date }
            source: { type: string }
        pendingPeriods:
          type: array
          items:
            type: object
            properties:
              periodMonth: { type: string }
              state: { type: string }
        periodsWithoutTer: { type: array, items: { type: string } }
        totals:
          type: object
          properties:
            segmentCount: { type: integer }
            closedCount: { type: integer }
            annualTax: { type: string }
            finalMasaTax: { type: string }
        rows:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PayrollPph21AnnualSegment'
              - type: object
                properties:
                  taxIdentity:
                    type: object
                    properties:
                      nik: { type: boolean }
                      npwp: { type: boolean }
    PayrollPph21A1:
      type: object
      required: [year, objectCode, reference, issuedOn, withholder, employee, policy, segment, signer]
      properties:
        year: { type: integer }
        objectCode: { type: string }
        reference: { type: string, description: HCIS reference, not the e-Bupot number. }
        issuedOn: { type: string, format: date }
        withholder:
          type: object
          properties:
            name: { type: string }
            taxNumber: { type: string, nullable: true }
        employee:
          type: object
          properties:
            employeeNumber: { type: string }
            fullName: { type: string }
            position: { type: string, nullable: true }
            nik: { type: string, nullable: true }
            npwp: { type: string, nullable: true }
        policy:
          type: object
          properties:
            versionId: { type: string }
            effectiveFrom: { type: string, format: date }
            source: { type: string }
        segment: { $ref: '#/components/schemas/PayrollPph21AnnualSegment' }
        signer:
          type: object
          properties:
            title: { type: string }
            name: { type: string, nullable: true }
    PayrollTaxIdentity:
      type: object
      properties:
        nikMasked: { type: string, nullable: true, example: '************0001' }
        npwpMasked: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
    PayrollPph21Report:
      type: object
      required: [taxPeriod, objectCode, policy, totals, rows]
      properties:
        taxPeriod: { type: string, description: 'Masa pajak, YYYY-MM.' }
        periods:
          type: array
          description: The approved periods of the month the report combines (PAY-003-THR T10).
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [REGULAR, THR] }
              state: { type: string }
        pendingPeriodCount: { type: integer, description: Periods of the month not yet approved and therefore not included. }
        objectCode: { type: string, example: '21-100-01' }
        policy:
          type: object
          required: [versionId, effectiveFrom, source]
          properties:
            versionId: { type: string, format: uuid }
            effectiveFrom: { type: string, format: date }
            source: { type: string, description: Legal reference stored in the PPH21_TER payload. }
        settings:
          type: object
          required: [versionId, employerHealthPremiumTaxable]
          description: The PPH21_SETTINGS in force on the masa pajak's pay date, as far as it shapes the gross (section 7.6).
          properties:
            versionId: { type: [string, 'null'], format: uuid, description: Null when no PPH21_SETTINGS version is in force. }
            employerHealthPremiumTaxable: { type: boolean, description: Whether the employer-paid BPJS Kesehatan premium (BPJS_KES_ALLOW) is part of the gross. }
        totals:
          type: object
          required: [employeeCount, gross, tax, excludedCount, ptkpMissingCount, annualCalculationCount, nonPermanentCount, skippedBlockedCount]
          properties:
            employeeCount: { type: integer, description: 'Rows reported, that is every row not excluded.' }
            gross: { type: string }
            employerHealthPremium: { type: string, description: "Employer-paid BPJS Kesehatan premium inside `gross`; \"0\" while the setting is off." }
            tax: { type: string, description: Sum of the rows whose tax could be determined. }
            excludedCount: { type: integer }
            ptkpMissingCount: { type: integer }
            annualCalculationCount: { type: integer }
            nonPermanentCount: { type: integer }
            dailyCount: { type: integer, description: "Rows taxed with daily TER under 21-100-03 (§7.5)." }
            skippedBlockedCount: { type: integer, description: 'Employment results with a blocker, not paid and not reported.' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PayrollPph21Row' }

    PayrollPph21Row:
      type: object
      required: [employeeId, employmentIds, employeeNumber, fullName, ptkpStatus, terCategory, gross, rate, tax, flags, exclusionReason, note]
      properties:
        employeeId: { type: string, format: uuid }
        employmentIds:
          type: array
          description: The paid employments whose gross is combined on this row.
          items: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }
        ptkpStatus: { type: [string, 'null'], description: 'Joined with " / " when the employments disagree.' }
        terCategory: { type: [string, 'null'], enum: [A, B, C, null] }
        gross: { type: string }
        rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
        tax: { type: [string, 'null'] }
        flags:
          type: array
          items: { type: string, enum: [PTKP_MISSING, PTKP_CONFLICT, EXCLUDED, ANNUAL_CALCULATION_REQUIRED, NON_PERMANENT_TERMS, DAILY_DAYS_MISSING, DAILY_ABOVE_CEILING, MIXED_TERMS, INCLUDES_THR] }
        objectCode: { type: string, description: "21-100-01, or 21-100-03 when taxed with daily TER (PAY-003 §7.5, PPH21_SETTINGS.nonPermanentDailyTer)." }
        attendanceDays: { type: [number, 'null'], description: "Attendance days daily TER averaged over; null on monthly TER." }
        employerHealthPremium: { type: string, description: "Employer-paid BPJS Kesehatan premium inside `gross` (section 7.6); \"0\" while PPH21_SETTINGS.employerHealthPremiumTaxable is off." }
        exclusionReason: { type: [string, 'null'] }
        note: { type: string, description: 'The flags in words, identical to the CSV note column.' }

    PayrollVarianceRow:
      type: object
      required: [employmentId, previousAmount, currentAmount, delta, kind]
      properties:
        employmentId: { type: string, format: uuid }
        componentCode:
          type: [string, 'null']
          description: Null when the whole employee is new or leaving.
        previousAmount: { type: string }
        currentAmount: { type: string }
        delta: { type: string }
        kind: { type: string, enum: [COMPONENT, NEW_EMPLOYEE, LEAVING_EMPLOYEE, LARGE_MANUAL_INPUT] }

    PayrollPeriodTransition:
      type: object
      required: [action, fromState, toState, occurredAt]
      properties:
        action: { type: string }
        fromState: { type: string }
        toState: { type: string }
        reason:
          type: [string, 'null']
          description: Required for return, request_reopen and reject_reopen.
        actorAccountId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }

    PayrollPeriod:
      type: object
      required: [id, periodMonth, payDate, periodStart, periodEnd, cutoffStart, cutoffEnd, state, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityKey: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [REGULAR, THR] }
        holidayDate: { type: [string, 'null'], format: date }
        holidayName: { type: [string, 'null'] }
        periodMonth: { type: string, format: date }
        payDate: { type: string, format: date }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        cutoffStart: { type: string, format: date }
        cutoffEnd: { type: string, format: date }
        state:
          type: string
          enum:
            - DRAFT
            - COLLECTING
            - CALCULATED
            - SUBMITTED
            - APPROVED
            - PAYMENT_CONFIRMED
            - PUBLISHED
            - REOPEN_REQUESTED
        stateBeforeReopenRequest:
          type: [string, 'null']
          description: Where a rejected reopen request returns the period to.
        submittedByAccountId: { type: [string, 'null'], format: uuid }
        submittedAt: { type: [string, 'null'], format: date-time }
        approvedByAccountId: { type: [string, 'null'], format: uuid }
        approvedAt: { type: [string, 'null'], format: date-time }
        paymentConfirmedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        reopenCount: { type: integer }
        version: { type: integer }
        resultCount:
          type: integer
          description: Employees in the latest revision of the calculation.
        blockerCount:
          type: integer
          description: Blockers standing in the latest revision.
        inputCount: { type: integer }
        hasCurrentCalculation:
          type: boolean
          description: A calculation exists and no input was recorded after it.
        availableActions:
          type: array
          description: Lifecycle transitions this actor may take now.
          items: { type: string }
        availableOperations:
          type: array
          description: >-
            The work on a period that is not a lifecycle transition and that this
            actor may do now: resolve_attendance, draft_payslips, publish_payslips.
          items:
            type: string
            enum: [resolve_attendance, draft_payslips, publish_payslips]
        reasonRequiredActions:
          type: array
          description: The actions that carry a reason, so a caller need not know the table.
          items: { type: string }
        inputRules:
          type: object
          description: >-
            Which period inputs are typed by hand, and which of those are refused
            without a reason or a decision reference. A screen keeps no copy of
            these: the same lists decide the refusal on PUT .../inputs.
          required: [editable, manual, reasonRequired, decisionRequired]
          properties:
            editable:
              description: Whether this period still accepts a change to its inputs.
              type: boolean
            manual:
              type: array
              items: { type: string }
            reasonRequired:
              type: array
              items: { type: string }
            decisionRequired:
              type: array
              items: { type: string }
        readAccess:
          type: object
          description: >-
            Which figure panels this actor may open at all (specification section
            7.3), so a screen hides a panel that would always answer 403. The state
            gate still applies per request.
          required: [report, perPerson, transfers]
          properties:
            report:
              description: The aggregate report (GET .../report).
              type: boolean
            perPerson:
              description: Results, inputs, variance and the PPh21 report.
              type: boolean
            transfers:
              description: The transfer list with bank accounts.
              type: boolean

  responses:
    PayrollUnauthenticated:
      description: No session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PayrollError' }
    PayrollForbidden:
      description: The actor holds no payroll permission for this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PayrollError' }
    PayrollBadRequest:
      description: The request body or query is not valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PayrollError' }
    PayrollNotFound:
      description: No such period
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PayrollError' }
