openapi: 3.1.0
info:
  title: HCIS Payslip API
  version: 0.0.1
  description: PAYSLIP-001 / PAYSLIP-002 import, publish, and employee self-read contracts.
tags:
  - name: Payslips

paths:
  /admin/payslip-imports:
    get:
      tags: [Payslips]
      operationId: listPayslipImports
      summary: List payslip import batches
      responses:
        '200':
          description: Authorized import batch history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PayslipImportBatch' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payslip-imports/preview:
    post:
      tags: [Payslips]
      operationId: previewPayslipImport
      summary: Preview canonical or legacy-compatible payslip CSV
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema: { type: string }
        - name: X-Payslip-Period
          in: header
          required: false
          description: Optional fallback YYYY-MM for legacy-compatible rows without TANGGAL.
          schema:
            type: string
            pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Persisted preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayslipImportPreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payslip-imports/{batchId}:
    get:
      tags: [Payslips]
      operationId: getPayslipImport
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch and row review detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayslipImportDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payslip-imports/{batchId}/commit:
    post:
      tags: [Payslips]
      operationId: commitPayslipImport
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch committed as employee-invisible draft
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Batch state, validation, or existing employee-period conflict

  /admin/payslip-imports/{batchId}/publish:
    post:
      tags: [Payslips]
      operationId: publishPayslipImport
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch published and employee notifications created
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Batch is not committed

  /payslips:
    get:
      tags: [Payslips]
      operationId: listMyPayslips
      responses:
        '200':
          description: Published payslips owned by current active employee
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PayslipSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payslips/{id}:
    get:
      tags: [Payslips]
      operationId: getMyPayslip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Published payslip owned by current employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayslipDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: Authentication required
    Forbidden:
      description: Actor lacks the required effective organization permission
    NotFound:
      description: Resource not found or intentionally concealed
    ValidationError:
      description: Import shape or fallback period is invalid

  schemas:
    PayslipSourceFormat:
      type: string
      enum: [generic, tetap, honorer]

    PayslipLine:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value:
          type: string
          description: Opaque imported display value. HCIS does not parse or calculate it.
        section:
          type: string
          enum: [identity, income, deduction, summary, other]

    PayslipImportBatch:
      type: object
      required: [id, sourceFilename, sourceFormat, status, rowCount, validCount, errorCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        sourceFilename: { type: string }
        sourceFormat: { $ref: '#/components/schemas/PayslipSourceFormat' }
        status: { type: string, enum: [previewed, committed, published] }
        rowCount: { type: integer, minimum: 0 }
        validCount: { type: integer, minimum: 0 }
        errorCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        committedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }

    PayslipImportRow:
      type: object
      required: [rowNumber, employeeNumber, errors]
      properties:
        rowNumber: { type: integer, minimum: 1 }
        employeeNumber: { type: string }
        period:
          type: [string, 'null']
          pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
        lines:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/PayslipLine' }
            - type: 'null'
        errors:
          type: array
          items: { type: string }

    PayslipImportPreview:
      allOf:
        - $ref: '#/components/schemas/PayslipImportBatch'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/PayslipImportRow' }

    PayslipImportDetail:
      allOf:
        - $ref: '#/components/schemas/PayslipImportBatch'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/PayslipImportRow' }

    PayslipSummary:
      type: object
      required: [id, period, sourceFormat, publishedAt]
      properties:
        id: { type: string, format: uuid }
        period:
          type: string
          pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
        sourceFormat: { $ref: '#/components/schemas/PayslipSourceFormat' }
        publishedAt: { type: string, format: date-time }

    PayslipDetail:
      allOf:
        - $ref: '#/components/schemas/PayslipSummary'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/PayslipLine' }
