services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hcis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-320m}
    shm_size: 128mb

  api:
    image: ${HCIS_API_IMAGE:-hcis-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_MODE: ${AUTH_MODE:?set AUTH_MODE}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-8}
      ADMS_INGRESS_HOST: ${ADMS_INGRESS_HOST:?set ADMS_INGRESS_HOST}
      BIOMETRIC_COLLECTION_ENABLED: ${BIOMETRIC_COLLECTION_ENABLED:-0}
      BIOMETRIC_ACTIVE_KEY_ID: ${BIOMETRIC_ACTIVE_KEY_ID:-}
      BIOMETRIC_ENCRYPTION_KEYS: ${BIOMETRIC_ENCRYPTION_KEYS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?set OIDC_REDIRECT_URI}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:?set OIDC_POST_LOGOUT_REDIRECT_URI}
      SQ_HUB_APPLICATION_ACCESS_URL: ${SQ_HUB_APPLICATION_ACCESS_URL:?set SQ_HUB_APPLICATION_ACCESS_URL}
      SQ_HUB_MACHINE_CLIENT_ID: ${SQ_HUB_MACHINE_CLIENT_ID:?set SQ_HUB_MACHINE_CLIENT_ID}
      SQ_HUB_MACHINE_CLIENT_SECRET: ${SQ_HUB_MACHINE_CLIENT_SECRET:?set SQ_HUB_MACHINE_CLIENT_SECRET}
    command:
      - sh
      - -c
      - node apps/api/dist/db/migrate.js && exec node apps/api/dist/server.js
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      backend:
        aliases:
          - hcis-api-internal
      edge_proxy:
        aliases:
          - hcis-api
      sq_platform_production:
        aliases:
          - hcis-api-production
    mem_limit: ${API_MEMORY_LIMIT:-192m}

  web:
    image: ${HCIS_WEB_IMAGE:-hcis-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HCIS_BIND_ADDRESS:-127.0.0.1}:${HCIS_HTTP_PORT:-18080}:80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      backend:
      edge_proxy:
        aliases:
          - hcis-web
    mem_limit: ${WEB_MEMORY_LIMIT:-96m}

networks:
  backend:
    internal: true
  edge_proxy:
    external: true
    name: ${EDGE_NETWORK:-edge_proxy}
  sq_platform_production:
    external: true
    name: ${SQ_PLATFORM_PRODUCTION_NETWORK:?set SQ_PLATFORM_PRODUCTION_NETWORK}

volumes:
  hcis_pgdata:
