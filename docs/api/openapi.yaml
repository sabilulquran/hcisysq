        name: { type: string }
        effectiveOn: { type: string, format: date }
        status: { type: string, enum: [DRAFT, VALIDATED, PUBLISHED] }
        validationReport: { oneOf: [{ $ref: '#/components/schemas/OrganizationValidationReport' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        validatedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }

    OrganizationNodeInput:
      type: object
      required: [name, nodeType]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        nodeType: { type: string, minLength: 1, maxLength: 80 }
        parentNodeKey: { type: [string, 'null'], format: uuid }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10, default: 0 }
        integrationCode: { type: [string, 'null'] }

    OrganizationNodePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        nodeType: { type: string, minLength: 1, maxLength: 80 }
        parentNodeKey: { type: [string, 'null'], format: uuid }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10 }
        integrationCode: { type: [string, 'null'] }
        active: { type: boolean }

