openapi: 3.1.0
info:
  title: HCIS Employment Administration (EMP-005 / EMP-006 / EMP-010)
  version: 0.6.0
  description: |
    Package 1 steps S2, S4, S5, S5A and S6 (docs/domain/employment-administration-package1.md).
    Read API, SHADOW consistency report, rollout mode, the EMP-010 register of
    Perjanjian Kerja and Surat Keputusan, the four contract actions (HIRE,
    CONTRACT_EXTENSION, CATEGORY_CHANGE, TERMINATION) and the career actions
    (PLACEMENT, PLACEMENT_END, TRANSFER, PROMOTION, DEMOTION). Reversal arrives in S7.
    Reads and the register need a mode other than OFF; recording or previewing an
    action needs AUTHORITATIVE (spec §8.1), which S5A made available — switching
    production to it still follows the S8 runbook.
    S5A also adds the time-boxed reactivation of a former employee's account
    (spec §8.5.2) under /admin/access/accounts/{accountId}/temporary-reactivations.
    employment.* is HC-only and never granted through legacy Super Admin compatibility.
    Read endpoints return 409 EMPLOYMENT_HISTORY_DISABLED while the rollout mode is OFF.
    All responses carry Cache-Control: no-store.
paths:
  /admin/employment/rollout:
    get:
      tags: [Employment]
      operationId: getEmploymentRollout
      summary: Current employment-history rollout mode (governance)
      description: Requires access.governance.manage. Absence of a setting means OFF.
      responses:
        '200':
          description: Current mode
          content:
            application/json:
              schema:
                type: object
                required: [mode, changedAt, availableModes]
                properties:
                  mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
                  changedAt: { type: [string, 'null'], format: date-time }
                  availableModes:
                    type: array
                    items: { $ref: '#/components/schemas/EmploymentRolloutMode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Employment]
      operationId: setEmploymentRollout
      summary: Change the rollout mode with an audited reason (governance)
      description: |
        Requires access.governance.manage. AUTHORITATIVE is refused with
        EMPLOYMENT_MODE_NOT_AVAILABLE until actions, projection, and automatic
        account deactivation (S5/S5A) are released. Audited as employment.mode.changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, reason]
              properties:
                mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: Mode changed
          content:
            application/json:
              schema:
                type: object
                required: [from, to]
                properties:
                  from: { $ref: '#/components/schemas/EmploymentRolloutMode' }
                  to: { $ref: '#/components/schemas/EmploymentRolloutMode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/employment:
    get:
      tags: [Employment]
      operationId: getEmployeeEmployment
      summary: Derived current employment plus full employment history of one employee
      description: Requires employment.read. Current state is derived from effective-dated records for `date`.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
        - name: date
          in: query
          required: false
          description: Asia/Jakarta business date; defaults to today.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Employment summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/employment/timeline:
    get:
      tags: [Employment]
      operationId: getEmployeeEmploymentTimeline
      summary: Employment actions of one employee, newest first, without reason notes
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                type: object
                required: [mode, items]
                properties:
                  mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EmploymentAction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employment/consistency:
    get:
      tags: [Employment]
      operationId: getEmploymentConsistencyReport
      summary: SHADOW review of baseline issues and master-vs-history differences
      description: Requires employment.read. Computed on read; nothing is written.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: code
          in: query
          required: false
          description: Only rows with this issue code.
          schema: { type: string, maxLength: 64 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Grouped issue counts and paginated rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentConsistencyReport' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/decision-documents:
    get:
      tags: [Employment]
      operationId: listDecisionDocuments
      summary: Register of Perjanjian Kerja or Surat Keputusan (EMP-010)
      description: Requires employment.read. One kind per request; PK and SK are separate series.
      parameters:
        - { name: kind, in: query, required: true, schema: { $ref: '#/components/schemas/DecisionDocumentKind' } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 }, description: Number, subject, employee name, or employee number. }
        - { name: year, in: query, schema: { type: integer }, description: Signing year. }
        - { name: pkType, in: query, schema: { $ref: '#/components/schemas/PkType' } }
        - { name: skType, in: query, schema: { $ref: '#/components/schemas/SkType' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/PkCategory' } }
        - { name: employeeId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: One page of the register
          content:
            application/json:
              schema:
                type: object
                required: [kind, page, pageSize, total, rows]
                properties:
                  kind: { $ref: '#/components/schemas/DecisionDocumentKind' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  rows: { type: array, items: { $ref: '#/components/schemas/DecisionDocument' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [Employment]
      operationId: createDecisionDocument
      summary: Record a Perjanjian Kerja or a Surat Keputusan (EMP-010)
      description: |
        Requires employment.manage. Package 1 stores metadata only; no file upload.
        Audited as employment.document.recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionDocumentWrite' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionDocument' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/decision-documents/{documentId}:
    get:
      tags: [Employment]
      operationId: getDecisionDocument
      summary: One document with the actions that use it and its corrections
      description: Requires employment.read.
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionDocumentDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Employment]
      operationId: updateDecisionDocument
      summary: Edit a document no action uses yet (EMP-010-B)
      description: |
        Requires employment.manage. The body replaces the document in full, so an
        omitted optional field is cleared. Rejected with DECISION_DOCUMENT_LOCKED
        once the document is linked to a recorded action; use the correction path
        instead. The kind, and the employee of a Perjanjian Kerja, cannot change.
        The lock and the kind are checked on the row read under FOR UPDATE, so an
        action linking the document meanwhile is never missed.
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionDocumentEdit' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionDocument' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/decision-documents/{documentId}/corrections:
    post:
      tags: [Employment]
      operationId: correctDecisionDocument
      summary: Audited correction that keeps the prior values (EMP-010-B, D-09)
      description: |
        Requires employment.correct. Works on a locked document; the previous values
        are stored as a correction record. Audited as employment.document.corrected.
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/DecisionDocumentEdit' }
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: Corrected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionDocument' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/employment-actions/preview:
    post:
      tags: [Employment]
      operationId: previewEmploymentAction
      summary: Validate an action and show "dari -> menjadi" without writing (EMP-005)
      description: |
        Requires employment.manage and mode AUTHORITATIVE. Returns the planned result
        and its warnings; the basis-document and warning-acknowledgement checks belong
        to recording, so a preview succeeds without a document.
      parameters: [{ $ref: '#/components/parameters/EmployeeId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmploymentActionRequest' }
      responses:
        '200':
          description: Planned result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentActionPreview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/employees/{employeeId}/employment-actions:
    post:
      tags: [Employment]
      operationId: recordEmploymentAction
      summary: Record one contract action (EMP-005)
      description: |
        Requires employment.manage, mode AUTHORITATIVE, and an Idempotency-Key header;
        a replayed key returns the original action with replayed=true and 200 instead
        of writing again, and the same key used for another employee is refused with
        IDEMPOTENCY_KEY_CONFLICT rather than silently dropping that action. The replay
        lookup runs after authentication. Rows, action, document links, the nine projected employees
        columns and the audit events are written in one transaction. An employee whose
        own account records the action is refused (EMPLOYMENT_SELF_ACTION_FORBIDDEN).
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmploymentActionRequest' }
      responses:
        '200':
          description: Replay of an already recorded action
          content:
            application/json:
              schema:
                type: object
                required: [actionId, replayed]
                properties:
                  actionId: { type: string, format: uuid }
                  replayed: { type: boolean, enum: [true] }
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [actionId, replayed]
                properties:
                  actionId: { type: string, format: uuid }
                  replayed: { type: boolean, enum: [false] }
                  projection:
                    oneOf:
                      - { $ref: '#/components/schemas/EmployeeProjection' }
                      - type: 'null'
                    description: Absent values mean the history cannot speak for the employee yet.
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /admin/access/accounts/{accountId}/temporary-reactivations:
    get:
      tags: [Employment]
      operationId: listAccountTemporaryReactivations
      summary: Grants of temporary access for a former employee (EMP-005 D-15)
      description: Requires access.accounts.temporary_reactivate (human_capital_admin only).
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '200':
          description: Every grant of this account, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccountTemporaryReactivation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Employment]
      operationId: grantAccountTemporaryReactivation
      summary: Grant time-boxed access to a former employee's account (EMP-005 D-15)
      description: |
        Requires access.accounts.temporary_reactivate. Reason and expiry are
        mandatory, the expiry is at most 30 days away, and granting to one's own
        account is refused. The grant opens only own payslips, own attendance
        history and own leave history, read-only; every other request answers
        EMPLOYMENT_ENDED_READ_ONLY. An existing live grant is revoked first, so
        extending always leaves its own audited record.
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expiresAt]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
                expiresAt: { type: string, format: date-time }
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema:
                type: object
                required: [id, accountId, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  accountId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/access/accounts/{accountId}/temporary-reactivations/{grantId}/revoke:
    post:
      tags: [Employment]
      operationId: revokeAccountTemporaryReactivation
      summary: End a temporary reactivation early (EMP-005 D-15)
      description: |
        Requires access.accounts.temporary_reactivate. The account returns to
        inactive and its sessions are revoked immediately.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [id, revoked]
                properties:
                  id: { type: string, format: uuid }
                  revoked: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  parameters:
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: |
        Error with code and Indonesian message. Codes: UNAUTHENTICATED, FORBIDDEN,
        EMPLOYMENT_FORBIDDEN, INVALID_EMPLOYMENT_REQUEST, INVALID_EMPLOYMENT_ROLLOUT,
        EMPLOYEE_NOT_FOUND, EMPLOYMENT_HISTORY_DISABLED, EMPLOYMENT_MODE_NOT_AVAILABLE,
        DECISION_DOCUMENT_INVALID (with a field name), DECISION_DOCUMENT_NOT_FOUND,
        DECISION_DOCUMENT_NUMBER_TAKEN, DECISION_DOCUMENT_LOCKED,
        DECISION_DOCUMENT_KIND_INVALID, DECISION_DOCUMENT_EMPLOYEE_MISMATCH,
        EMPLOYMENT_VERSION_CONFLICT, IDEMPOTENCY_KEY_REQUIRED, and the action codes
        of spec §12: EMPLOYMENT_SELF_ACTION_FORBIDDEN, EMPLOYMENT_NOT_ACTIVE,
        EMPLOYMENT_ALREADY_ACTIVE, EMPLOYMENT_OVERLAP, EMPLOYMENT_ACTION_OUT_OF_ORDER,
        EMPLOYMENT_BACKDATE_NOT_ALLOWED, EMPLOYMENT_BACKDATE_REASON_REQUIRED,
        EMPLOYMENT_REFERENCE_INVALID, EMPLOYMENT_CROSS_ENTITY_UNSUPPORTED,
        EMPLOYMENT_TERM_END_REQUIRED, EMPLOYMENT_TERM_INVALID, EMPLOYMENT_REASON_REQUIRED,
        EMPLOYMENT_WARNINGS_NOT_ACKNOWLEDGED, EMPLOYMENT_BASELINE_MISSING,
        DECISION_DOCUMENT_REQUIRED, PK_TERM_MISMATCH, IDEMPOTENCY_KEY_CONFLICT
        (409, the key already recorded an action for another employee),
        EMPLOYEE_NOT_FOUND, INVALID_EMPLOYMENT_REQUEST, UNAUTHENTICATED, and the
        S5A codes EMPLOYMENT_ENDED (401, the employment ended and no grant is
        valid), EMPLOYMENT_ENDED_READ_ONLY (403, outside the reactivation
        allowlist), REACTIVATION_EXPIRY_REQUIRED, REACTIVATION_SELF_FORBIDDEN,
        REACTIVATION_NOT_APPLICABLE, REACTIVATION_NOT_FOUND, ACCOUNT_NOT_FOUND.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: string, description: Set by DECISION_DOCUMENT_INVALID. }
  schemas:
    AccountTemporaryReactivation:
      type: object
      required: [id, accountId, reason, startsAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        reason: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: At most 30 days after startsAt. }
        grantedByAccountId: { type: [string, 'null'], format: uuid }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedByAccountId: { type: [string, 'null'], format: uuid }
    EmploymentWarning:
      type: string
      enum: [BACKDATED, TERM_GAP, CONTRACT_DURATION_LONG, PROBATION_DURATION_LONG]
    EmploymentPlacementInput:
      type: object
      additionalProperties: false
      required: [unitId, jobTitleLabel]
      description: |
        Package 1 records placements against the legacy unit/position tables,
        the ones the nine projected employees columns point at. ORG-004 stable
        keys arrive with S6 together with their mapping, so sending one is
        rejected rather than silently clearing an employee's unit.
      properties:
        unitId: { type: string, format: uuid }
        positionId: { type: [string, 'null'], format: uuid }
        jobTitleLabel: { type: string, minLength: 1, maxLength: 200 }
    EmploymentActionRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, category, placement]
          properties:
            actionType: { type: string, enum: [HIRE] }
            effectiveOn: { type: string, format: date }
            category: { $ref: '#/components/schemas/PkCategoryOrPermanent' }
            termEndOn: { type: [string, 'null'], format: date, description: Required for every fixed-term category (D-03). }
            staffType: { type: [string, 'null'], enum: [PENDIDIK, KEPENDIDIKAN, null] }
            contractReference: { type: [string, 'null'], maxLength: 200 }
            placement: { $ref: '#/components/schemas/EmploymentPlacementInput' }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, termEndOn]
          properties:
            actionType: { type: string, enum: [CONTRACT_EXTENSION] }
            effectiveOn: { type: string, format: date }
            termEndOn: { type: string, format: date }
            contractReference: { type: [string, 'null'], maxLength: 200 }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, category]
          properties:
            actionType: { type: string, enum: [CATEGORY_CHANGE] }
            effectiveOn: { type: string, format: date }
            category: { $ref: '#/components/schemas/PkCategoryOrPermanent' }
            termEndOn: { type: [string, 'null'], format: date }
            contractReference: { type: [string, 'null'], maxLength: 200 }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, placement]
          description: |
            EMP-006 PLACEMENT: opens the primary placement when none is effective,
            or adds an additional duty. It is not a career move and needs no basis
            document, though an SK may be linked.
          properties:
            actionType: { type: string, enum: [PLACEMENT] }
            effectiveOn: { type: string, format: date }
            placement:
              allOf:
                - { $ref: '#/components/schemas/EmploymentPlacementInput' }
                - type: object
                  properties:
                    kind: { type: string, enum: [PRIMARY, ADDITIONAL], default: PRIMARY }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, placementId]
          description: EMP-006 — ends an additional duty from effectiveOn; the primary placement is untouched.
          properties:
            actionType: { type: string, enum: [PLACEMENT_END] }
            effectiveOn: { type: string, format: date }
            placementId: { type: string, format: uuid }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, placement]
          description: |
            EMP-006 career move: closes the current primary placement the day
            before effectiveOn and opens the new one. Each kind needs its own SK
            (Mutasi, Promosi, Demosi); a demotion also needs a reason code.
            Whether a move is a promotion is declared by Human Capital with the
            SK, not computed: Package 1 has no grade model.
          properties:
            actionType: { type: string, enum: [TRANSFER, PROMOTION, DEMOTION] }
            effectiveOn: { type: string, format: date }
            placement: { $ref: '#/components/schemas/EmploymentPlacementInput' }
            reasonCode: { oneOf: [{ $ref: '#/components/schemas/CareerReasonCode' }, { type: 'null' }] }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, lastDayOn, reasonCode]
          properties:
            actionType: { type: string, enum: [TERMINATION] }
            lastDayOn: { type: string, format: date, description: The last working day; the employment ends on it. }
            reasonCode:
              type: string
              enum: [RESIGN, KONTRAK_BERAKHIR, PENSIUN, PEMBERHENTIAN, MENINGGAL_DUNIA, LAINNYA]
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
    CareerReasonCode:
      type: string
      enum: [RESTRUKTURISASI, KINERJA, DISIPLIN, PERMINTAAN_PEGAWAI, KEBUTUHAN_ORGANISASI, LAINNYA]
    PkCategoryOrPermanent:
      type: string
      enum: [TETAP, KONTRAK, KONTRAK_HONORER, MAGANG, PERCOBAAN, LEPAS]
    EmploymentActionPreview:
      type: object
      required: [actionType, effectiveOn, warnings, previous, next, documentIds, state]
      properties:
        actionType: { type: string }
        effectiveOn: { type: [string, 'null'], format: date }
        reasonCode: { type: [string, 'null'] }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/EmploymentWarning' }
          description: Warnings must be echoed in acknowledgedWarnings when recording (D-04).
        previous: { type: object, description: Display-only "dari" summary. }
        next: { type: object, description: Display-only "menjadi" summary. }
        documentIds: { type: array, items: { type: string, format: uuid } }
        expectedVersion: { type: [integer, 'null'], description: Optimistic token of the affected employment. }
        state:
          type: string
          enum: [AKTIF, AKAN_MULAI, BERAKHIR, TANPA_DATA]
          description: The derived state the action produces, not the current one.
        structureNote:
          type: [string, 'null']
          description: |
            EMP-006 D-18 — set on every placement or career move: the action
            records where the employee works and never writes ORG-004 or moves
            approval authority.
        accountDeactivation:
          type: object
          description: EMP-005 D-15 — when the employee's login account closes.
          properties:
            willDeactivate: { type: boolean }
            onDate: { type: [string, 'null'], format: date }
    EmployeeProjection:
      type: object
      description: The nine legacy employees columns as the action left them (spec §8.4).
      properties:
        status: { type: string, enum: [active, inactive, resigned] }
        employmentStatus: { type: [string, 'null'] }
        employmentType: { type: [string, 'null'] }
        organizationalUnitId: { type: [string, 'null'], format: uuid }
        positionId: { type: [string, 'null'], format: uuid }
        functionalPosition: { type: [string, 'null'] }
        structuralPosition: { type: [string, 'null'] }
        startedOn: { type: [string, 'null'], format: date }
        endedOn: { type: [string, 'null'], format: date }
    DecisionDocumentKind:
      type: string
      enum: [PERJANJIAN_KERJA, SURAT_KEPUTUSAN]
    PkType:
      type: string
      enum: [PK_BARU, PK_PERPANJANGAN]
    SkType:
      type: string
      enum: [SK_PENGANGKATAN, SK_MUTASI, SK_PROMOSI, SK_DEMOSI, SK_PEMBERHENTIAN, SK_PENEMPATAN, SK_LAINNYA]
    PkCategory:
      type: string
      enum: [KONTRAK, KONTRAK_HONORER, MAGANG, PERCOBAAN, LEPAS]
      description: A Perjanjian Kerja is always fixed-term (D-03); TETAP comes from an SK Pengangkatan.
    DecisionDocumentWrite:
      type: object
      additionalProperties: false
      required: [documentKind, documentNumber, signedOn]
      description: |
        Kind-specific fields: a PERJANJIAN_KERJA requires pkType, employeeId,
        contractFrom, contractTo, and category; a SURAT_KEPUTUSAN requires skType,
        subject, issuingAuthorityLabel, and effectiveOn. Fields of the other kind
        are ignored and stored as null.
      properties:
        documentKind: { $ref: '#/components/schemas/DecisionDocumentKind' }
        documentNumber: { type: string, minLength: 1, maxLength: 120 }
        signedOn: { type: string, format: date }
        externalReference: { type: [string, 'null'], maxLength: 500, description: Where the signed original is kept; no upload in Package 1. }
        notes: { type: [string, 'null'], maxLength: 2000 }
        pkType: { oneOf: [{ $ref: '#/components/schemas/PkType' }, { type: 'null' }] }
        employeeId: { type: [string, 'null'], format: uuid }
        contractFrom: { type: [string, 'null'], format: date }
        contractTo: { type: [string, 'null'], format: date }
        category: { oneOf: [{ $ref: '#/components/schemas/PkCategory' }, { type: 'null' }] }
        signatoryEmployerLabel: { type: [string, 'null'], maxLength: 500, description: Text only; grants no authority. }
        previousPkId: { type: [string, 'null'], format: uuid, description: PK_PERPANJANGAN only; same employee. }
        skType: { oneOf: [{ $ref: '#/components/schemas/SkType' }, { type: 'null' }] }
        subject: { type: [string, 'null'], maxLength: 500 }
        issuingAuthorityLabel: { type: [string, 'null'], maxLength: 500, description: Text only; proves no authority. }
        effectiveOn: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    DecisionDocumentEdit:
      allOf:
        - { $ref: '#/components/schemas/DecisionDocumentWrite' }
        - type: object
          properties:
            expectedUpdatedAt:
              type: string
              format: date-time
              description: |
                The updatedAt the operator had on screen. When it no longer matches
                the stored row the write is refused with EMPLOYMENT_VERSION_CONFLICT.
                Omitted means last write wins.
    DecisionDocument:
      allOf:
        - { $ref: '#/components/schemas/DecisionDocumentWrite' }
        - type: object
          required: [id, signedYear, linkedActionCount, locked, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            signedYear: { type: integer, description: Derived from signedOn; numbering is unique per kind, number, and year. }
            employeeNumber: { type: [string, 'null'] }
            employeeName: { type: [string, 'null'] }
            previousPkNumber: { type: [string, 'null'] }
            linkedActionCount: { type: integer }
            locked: { type: boolean, description: True once an action uses the document; only a correction may change it. }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    DecisionDocumentDetail:
      allOf:
        - { $ref: '#/components/schemas/DecisionDocument' }
        - type: object
          required: [links, corrections]
          properties:
            links:
              type: array
              items:
                type: object
                properties:
                  actionId: { type: string, format: uuid }
                  actionType: { type: string }
                  effectiveOn: { type: [string, 'null'], format: date }
                  employeeId: { type: string, format: uuid }
                  employeeNumber: { type: [string, 'null'] }
                  employeeName: { type: [string, 'null'] }
                  state: { type: string, enum: [RECORDED, REVERSED] }
            corrections:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  previousValues: { type: object, description: The document values before this correction (D-09). }
                  reason: { type: string }
                  correctedAt: { type: string, format: date-time }
    EmploymentRolloutMode:
      type: string
      enum: [OFF, SHADOW, AUTHORITATIVE]
    EmploymentCategory:
      type: string
      enum: [TETAP, KONTRAK, KONTRAK_HONORER, MAGANG, PERCOBAAN, LEPAS, BELUM_DIKLASIFIKASIKAN]
    Employment:
      type: object
      required: [id, employeeId, startedOn, startBasis, endedOn, endBasis, endReason, version]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        legalEntityKey: { type: [string, 'null'], format: uuid }
        staffType: { type: [string, 'null'], enum: [PENDIDIK, KEPENDIDIKAN, null] }
        startedOn: { type: [string, 'null'], format: date }
        startBasis: { type: string, enum: [RECORDED, UNKNOWN] }
        serviceStartOn: { type: [string, 'null'], format: date }
        endedOn: { type: [string, 'null'], format: date }
        endBasis: { type: [string, 'null'], enum: [RECORDED, UNKNOWN, null] }
        endPrecision: { type: [string, 'null'], enum: [DAY, MONTH, null] }
        endReason: { type: [string, 'null'] }
        version: { type: integer, description: Optimistic-concurrency token. }
    EmploymentTerm:
      type: object
      required: [id, employmentId, sequence, category, effectiveFrom, effectiveTo]
      properties:
        id: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        category: { $ref: '#/components/schemas/EmploymentCategory' }
        effectiveFrom: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        contractReference: { type: [string, 'null'] }
    Placement:
      type: object
      required: [id, employmentId, kind, unitRef, jobTitleLabel, effectiveFrom, effectiveTo, effectiveFromBasis]
      properties:
        id: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
        kind: { type: string, enum: [PRIMARY, ADDITIONAL] }
        unitRef:
          type: object
          description: ORG-004 node stable key or legacy organizational unit.
          properties:
            kind: { type: string, enum: [ORG_NODE, LEGACY_UNIT] }
            key: { type: string, format: uuid }
            id: { type: string, format: uuid }
        positionRef:
          type: [object, 'null']
          properties:
            kind: { type: string, enum: [ORG_POSITION, LEGACY_POSITION] }
            key: { type: string, format: uuid }
            id: { type: string, format: uuid }
        unitName: { type: [string, 'null'] }
        positionName: { type: [string, 'null'] }
        jobTitleLabel: { type: string }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        effectiveFromBasis:
          type: string
          enum: [RECORDED, BASELINE_ASSUMED]
          description: BASELINE_ASSUMED = "sejak data awal"; the real start is unknown.
    EmploymentSummary:
      type: object
      required: [mode, date, state, flags, current, employments]
      properties:
        mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
        date: { type: string, format: date }
        state:
          type: string
          enum: [AKTIF, AKAN_MULAI, BERAKHIR, TANPA_DATA]
          description: The derived state the action produces, not the current one.
        structureNote:
          type: [string, 'null']
          description: |
            EMP-006 D-18 — set on every placement or career move: the action
            records where the employee works and never writes ORG-004 or moves
            approval authority.
        accountDeactivation:
          type: object
          description: EMP-005 D-15 — when the employee's login account closes.
          properties:
            willDeactivate: { type: boolean }
            onDate: { type: [string, 'null'], format: date }
        flags:
          type: array
          items:
            type: string
            enum: [KONTRAK_SEGERA_BERAKHIR, KONTRAK_LEWAT_TANPA_TINDAK_LANJUT, TANPA_PENEMPATAN, TANGGAL_MULAI_TIDAK_DIKETAHUI, TANGGAL_AKHIR_TIDAK_DIKETAHUI]
        current:
          type: object
          properties:
            employment: { oneOf: [{ $ref: '#/components/schemas/Employment' }, { type: 'null' }] }
            term: { oneOf: [{ $ref: '#/components/schemas/EmploymentTerm' }, { type: 'null' }] }
            primaryPlacement: { oneOf: [{ $ref: '#/components/schemas/Placement' }, { type: 'null' }] }
            additionalPlacements:
              type: array
              items: { $ref: '#/components/schemas/Placement' }
        employments:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/Employment' }
              - type: object
                properties:
                  terms: { type: array, items: { $ref: '#/components/schemas/EmploymentTerm' } }
                  placements: { type: array, items: { $ref: '#/components/schemas/Placement' } }
    EmploymentAction:
      type: object
      required: [id, actionType, effectiveOn, state, recordedAt, documents]
      properties:
        id: { type: string, format: uuid }
        actionType:
          type: string
          enum: [BASELINE, HIRE, CONTRACT_EXTENSION, CATEGORY_CHANGE, PLACEMENT, TRANSFER, PROMOTION, DEMOTION, TERMINATION, REVERSAL]
        effectiveOn: { type: [string, 'null'], format: date }
        state: { type: string, enum: [RECORDED, REVERSED] }
        reversesActionId: { type: [string, 'null'], format: uuid }
        reversedByActionId: { type: [string, 'null'], format: uuid }
        reasonCode: { type: [string, 'null'] }
        previousSnapshot: { type: object, description: Display-only "dari" summary. }
        newSnapshot: { type: object, description: Display-only "menjadi" summary. }
        recordedAt: { type: string, format: date-time }
        documents:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [PERJANJIAN_KERJA, SURAT_KEPUTUSAN] }
              number: { type: string }
              type: { type: [string, 'null'] }
    EmploymentConsistencyReport:
      type: object
      required: [mode, date, employeeCount, groups, total, page, pageSize, rows]
      properties:
        mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
        date: { type: string, format: date }
        employeeCount: { type: integer }
        groups:
          type: array
          items:
            type: object
            properties:
              code: { type: string, description: 'Baseline issue code (BASELINE_*), BASELINE_NOT_LOADED, HISTORY_DIFFERS_FROM_MASTER, ACTIVE_WITHOUT_PLACEMENT, CONTRACT_EXPIRED_WITHOUT_FOLLOW_UP' }
              count: { type: integer }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        pagination: { $ref: './openapi.yaml#/components/schemas/Pagination' }
        rows:
          type: array
          items:
            type: object
            properties:
              employeeId: { type: string, format: uuid }
              employeeNumber: { type: [string, 'null'] }
              fullName: { type: [string, 'null'] }
              codes: { type: array, items: { type: string } }
              differingFields:
                type: array
                items: { type: string, enum: [status, startedOn, organizationalUnitId, positionId, employmentStatus] }
