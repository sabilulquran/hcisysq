        least five characters and keeps who verified the record and when (spec 5.2).
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationInput' }
      responses:
        '200':
          description: The record after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/skill-records/{recordId}/verification:
    post:
      tags: [EmployeeProfile]
      operationId: setSkillVerification
      summary: Mark a skill record verified, or take that back
      description: Requires employees.manage. Same rule as the education record.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
