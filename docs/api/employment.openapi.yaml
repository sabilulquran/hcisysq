        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employees/certificates/expiring:
    get:
      tags: [EmployeeProfile]
      operationId: listExpiringCertificates
      summary: Certificates about to expire, and those already past
      description: |
        Requires employees.read.all. Server-side paging per ENG-LIST-001; a
        certificate already past stays on the list until HC records a new one
        (spec 7.5).
      parameters:
        - name: withinDays
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 60 }
        - name: unitId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Expiring certificates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpiringCertificateList' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/family:
    get:
      tags: [EmployeeProfile]
      operationId: listEmployeeFamily
      summary: Family members, dependants and emergency contacts of one employee
      description: |
        Requires employees.read.all. The counts are derived on read. A relation
        that has ended keeps its row with an end date rather than disappearing.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      responses:
        '200':
          description: Family records
          content:
            application/json:
              schema:
                type: object
                required: [rows, dependents, emergencyContacts]
                properties:
                  rows: { type: array, items: { $ref: '#/components/schemas/FamilyMemberRecord' } }
                  dependents: { type: integer }
                  emergencyContacts: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [EmployeeProfile]
      operationId: recordEmployeeFamilyMember
      summary: Record one family member
      description: |
        Requires employees.manage. At most one spouse and one emergency-contact
        order may be in force on a date; an overlap answers 409 with the code
        for the rule that was broken, FAMILY_SPOUSE_OVERLAP or
        EMERGENCY_PRIORITY_TAKEN, never 500.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyMemberInput' }
      responses:
        '201':
          description: The recorded member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMemberRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/family-records/{recordId}:
    patch:
      tags: [EmployeeProfile]
      operationId: amendEmployeeFamilyMember
      summary: Amend one family member
      description: Requires employees.manage. A voided record, or one of a removed employee, is refused.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyMemberInput' }
      responses:
        '200':
          description: The amended member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMemberRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/family-records/{recordId}/void:
    post:
      tags: [EmployeeProfile]
      operationId: voidFamilyRecord
      summary: Void a family record, with a reason
      description: Requires employees.manage. Nothing is deleted.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidInput' }
      responses:
        '200':
          description: The voided record id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidedRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/addresses:
    get:
      tags: [EmployeeProfile]
      operationId: listEmployeeAddresses
      summary: Address history of one employee
      description: |
        Requires employees.read.all. `current` names the record of each kind in
        force on `date`, derived rather than flagged on the row: a record that
        has ended, or that starts later, is not current however open its end is.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      responses:
        '200':
          description: Address records
          content:
            application/json:
              schema:
                type: object
                required: [rows, date, current]
                properties:
                  rows: { type: array, items: { $ref: '#/components/schemas/AddressRecord' } }
                  date: { type: string, format: date, description: The Asia/Jakarta business date `current` is judged against. }
                  current:
                    type: object
                    properties:
                      DOMISILI: { type: [string, 'null'], format: uuid }
                      KTP: { type: [string, 'null'], format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [EmployeeProfile]
      operationId: recordEmployeeAddress
      summary: Record an address, closing the one it replaces
      description: |
        Requires employees.manage. If an address of this kind is still open it
        is closed the day before validFrom, inside the same transaction, and
        the response names it in closedAddressId. An address that starts on or
        after the new one cannot be closed first, which answers 409
        ADDRESS_PERIOD_OVERLAP. A record that already carries validTo is a past
        period being filled in, not a move: nothing is closed for it.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: The recorded address
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AddressRecord' }
                  - type: object
                    properties:
                      closedAddressId: { type: [string, 'null'], format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/address-records/{recordId}:
    patch:
      tags: [EmployeeProfile]
      operationId: amendEmployeeAddress
      summary: Amend one address
      description: |
        Requires employees.manage. This corrects a record; it does not move
        anyone. A period that overlaps another address of the same kind answers
        409 ADDRESS_PERIOD_OVERLAP.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: The amended address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/address-records/{recordId}/void:
    post:
      tags: [EmployeeProfile]
      operationId: voidAddressRecord
      summary: Void an address record, with a reason
      description: Requires employees.manage. Nothing is deleted.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidInput' }
      responses:
        '200':
          description: The voided record id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidedRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /employees/me/data-changes:
    get:
      tags: [EmployeeProfile]
      operationId: listMyDataChanges
      summary: The signed-in employee's own data-change proposals
      description: |
        An employee session, no permission. The employee is taken from the
        session, never from the request.
      responses:
        '200':
          description: Proposals, newest first
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows: { type: array, items: { $ref: '#/components/schemas/DataChangeRequest' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [EmployeeProfile]
      operationId: submitMyDataChange
      summary: Propose a change to your own data
      description: |
        An employee session. The payload is validated by the same rules as the
        record it would become (§4.1 to §4.4); an invalid one is refused with a
        field name rather than stored for HC to discover.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataChangeInput' }
      responses:
        '201':
          description: The proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataChangeRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /employees/me/data-changes/{requestId}/cancel:
    post:
      tags: [EmployeeProfile]
      operationId: cancelMyDataChange
      summary: Withdraw your own proposal
      description: |
        An employee session. A proposal belonging to someone else answers 404,
        exactly as a missing one does, so the endpoint never confirms that an
        id exists. A proposal already decided answers 409 DATA_CHANGE_NOT_PENDING.
        A withdrawal names no decider.
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '200':
          description: The withdrawn proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataChangeRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employees/data-changes:
    get:
      tags: [EmployeeProfile]
      operationId: listDataChangeRequests
      summary: Proposals waiting for a decision, longest waiting first
      description: |
        Requires employees.read.all. Server-side paging per ENG-LIST-001; the
        total is the real one even on a page past the end.
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DataChangeState' }
        - name: unitId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: The worklist
          content:
            application/json:
              schema:
                type: object
                required: [state, page, pageSize, total, rows]
                properties:
                  state: { $ref: '#/components/schemas/DataChangeState' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  rows: { type: array, items: { $ref: '#/components/schemas/DataChangeRequest' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/data-change-requests/{requestId}/accept:
    post:
      tags: [EmployeeProfile]
      operationId: acceptDataChangeRequest
      summary: Accept a proposal and write the change
      description: |
        Requires employees.manage. The change is written in the same
        transaction as the decision, so a refusal from the database undoes
        both and never leaves an accepted proposal with nothing behind it.
        The payload is validated again here: a proposal that no longer fits
        the rules answers 409 DATA_CHANGE_NO_LONGER_VALID with the field, and
        one that collides with existing data answers 409 DATA_CHANGE_CONFLICT.
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: The accepted proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataChangeRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/data-change-requests/{requestId}/reject:
    post:
      tags: [EmployeeProfile]
      operationId: rejectDataChangeRequest
      summary: Refuse a proposal, with a reason
      description: |
        Requires employees.manage. A refusal without a reason answers 400
        DATA_CHANGE_REASON_REQUIRED; nothing is written to the employee's data.
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: The refused proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataChangeRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/management-scope:
    put:
      tags: [Employment]
      operationId: setEmployeeManagementScope
      summary: Mark a record outside HCIS management, or bring it back
      description: |
        Requires employees.manage. Marking needs a reason (BUMY or
        PENGURUS_YAYASAN) and a note of at least five characters; unmarking
        needs the note alone and clears the marker whole. A request that would
        not change the scope answers 409 MANAGEMENT_SCOPE_UNCHANGED. Nothing is
        deleted either way, and the import never marks a record itself.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [managementScope, note]
              properties:
                managementScope: { type: string, enum: [MANAGED, OUTSIDE_HCIS] }
                reason:
                  type: [string, 'null']
                  enum: [BUMY, PENGURUS_YAYASAN, null]
                  description: Required when managementScope is OUTSIDE_HCIS, refused otherwise.
                note: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: The record's scope after the change
          content:
            application/json:
              schema:
                type: object
                required: [id, managementScope]
                properties:
                  id: { type: string, format: uuid }
                  employeeNumber: { type: string }
                  fullName: { type: string }
                  managementScope: { type: string, enum: [MANAGED, OUTSIDE_HCIS] }
                  managementScopeReason: { type: [string, 'null'] }
                  managementScopeNote: { type: [string, 'null'] }
                  managementScopeMarkedAt: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

components:
  parameters:
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecordId:
      name: recordId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: |
        Error with code and Indonesian message. Codes: UNAUTHENTICATED, FORBIDDEN,
        EMPLOYMENT_FORBIDDEN, INVALID_EMPLOYMENT_REQUEST, INVALID_EMPLOYMENT_ROLLOUT,
        EMPLOYEE_NOT_FOUND, EMPLOYMENT_HISTORY_DISABLED, EMPLOYMENT_MODE_NOT_AVAILABLE,
        DECISION_DOCUMENT_INVALID (with a field name), DECISION_DOCUMENT_NOT_FOUND,
        DECISION_DOCUMENT_NUMBER_TAKEN, DECISION_DOCUMENT_LOCKED,
        EMPLOYEE_RECORD_INVALID (with a field name), EMPLOYEE_RECORD_NOT_FOUND,
        EMPLOYEE_RECORD_VOIDED,
        FAMILY_SPOUSE_OVERLAP, EMERGENCY_PRIORITY_TAKEN, ADDRESS_PERIOD_OVERLAP,
        EMPLOYEE_OUTSIDE_HCIS_READ_ONLY, MANAGEMENT_SCOPE_UNCHANGED, INVALID_MANAGEMENT_SCOPE,
        DATA_CHANGE_NOT_FOUND, DATA_CHANGE_NOT_PENDING, DATA_CHANGE_REASON_REQUIRED,
        DATA_CHANGE_NO_LONGER_VALID, DATA_CHANGE_CONFLICT, EMPLOYEE_ACCOUNT_REQUIRED,
        DECISION_DOCUMENT_KIND_INVALID, DECISION_DOCUMENT_EMPLOYEE_MISMATCH,
        EMPLOYMENT_VERSION_CONFLICT, IDEMPOTENCY_KEY_REQUIRED, and the action codes
        of spec §12: EMPLOYMENT_SELF_ACTION_FORBIDDEN, EMPLOYMENT_NOT_ACTIVE,
        EMPLOYMENT_ALREADY_ACTIVE, EMPLOYMENT_OVERLAP, EMPLOYMENT_ACTION_OUT_OF_ORDER,
        EMPLOYMENT_BACKDATE_NOT_ALLOWED, EMPLOYMENT_BACKDATE_REASON_REQUIRED,
        EMPLOYMENT_REFERENCE_INVALID, EMPLOYMENT_CROSS_ENTITY_UNSUPPORTED,
        EMPLOYMENT_TERM_END_REQUIRED, EMPLOYMENT_TERM_INVALID, EMPLOYMENT_REASON_REQUIRED,
        EMPLOYMENT_WARNINGS_NOT_ACKNOWLEDGED, EMPLOYMENT_BASELINE_MISSING,
        DECISION_DOCUMENT_REQUIRED, PK_TERM_MISMATCH, IDEMPOTENCY_KEY_CONFLICT
        (409, the key already recorded an action for another employee),
        EMPLOYEE_NOT_FOUND, INVALID_EMPLOYMENT_REQUEST, UNAUTHENTICATED, and the
        S5A codes EMPLOYMENT_ENDED (401, the employment ended and no grant is
        valid), EMPLOYMENT_ENDED_READ_ONLY (403, outside the reactivation
        allowlist), REACTIVATION_EXPIRY_REQUIRED, REACTIVATION_SELF_FORBIDDEN,
        REACTIVATION_NOT_APPLICABLE, REACTIVATION_NOT_FOUND, ACCOUNT_NOT_FOUND.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: string, description: Set by DECISION_DOCUMENT_INVALID. }
  schemas:
    DataChangeTarget:
      type: string
      enum: [ALAMAT, KONTAK, KELUARGA, PENDIDIKAN, KEAHLIAN]
    DataChangeState:
      type: string
      enum: [DIAJUKAN, DITERIMA, DITOLAK, DIBATALKAN]
    DataChangeInput:
      type: object
      additionalProperties: false
      required: [target, payload]
      properties:
        target: { $ref: '#/components/schemas/DataChangeTarget' }
        payload:
          type: object
          description: |
            The proposed values, shaped like the record the target names:
            AddressInput, FamilyMemberInput, EducationInput, SkillInput, or
            {email, phone} for KONTAK. Validated on submission and again on
            acceptance.
    DataChangeRequest:
      type: object
      required: [id, employeeId, target, payload, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }
        unitName: { type: [string, 'null'] }
        submittedByAccountId: { type: string, format: uuid }
        target: { $ref: '#/components/schemas/DataChangeTarget' }
        payload: { type: object }
        state: { $ref: '#/components/schemas/DataChangeState' }
        decidedByAccountId:
          type: [string, 'null']
          format: uuid
          description: Null on a proposal still waiting, and on one the proposer withdrew.
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FamilyRelation:
      type: string
      enum: [PASANGAN, ANAK, ORANG_TUA, SAUDARA, LAINNYA]
    Gender:
      type: string
      enum: [L, P]
    AddressKind:
      type: string
      enum: [DOMISILI, KTP]
    AddressSource:
      type: string
      enum: [IMPOR, HC, USULAN_PEGAWAI]
    DatedRecordMeta:
      type: object
      required: [id, employeeId, validFrom]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        voidedAt: { type: [string, 'null'], format: date-time }
        voidedReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FamilyMemberInput:
      type: object
      additionalProperties: false
      required: [relation, fullName, validFrom]
      description: |
        identityNumber is deliberately absent. The schema is strict, so sending
        one is an invalid request rather than a field quietly dropped
        (Package 2 spec 8).
      properties:
        relation: { $ref: '#/components/schemas/FamilyRelation' }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        birthDate:
          type: [string, 'null']
          format: date
          description: Required when isDependent is true.
        gender:
          oneOf:
            - { $ref: '#/components/schemas/Gender' }
            - { type: 'null' }
        isDependent: { type: boolean, default: false }
        dependentOrder:
          type: [integer, 'null']
          minimum: 1
          maximum: 20
          description: Only for a dependant.
        isEmergencyContact: { type: boolean, default: false }
        emergencyPhone:
          type: [string, 'null']
          maxLength: 40
          description: Required when isEmergencyContact is true.
        emergencyPriority:
          type: [integer, 'null']
          minimum: 1
          maximum: 9
          description: Unique among the employee's emergency contacts in force on a date.
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
    FamilyMemberRecord:
      allOf:
        - { $ref: '#/components/schemas/DatedRecordMeta' }
        - { $ref: '#/components/schemas/FamilyMemberInput' }
    AddressInput:
      type: object
      additionalProperties: false
      required: [kind, addressLine, city, validFrom]
      properties:
        kind: { $ref: '#/components/schemas/AddressKind' }
        addressLine: { type: string, minLength: 1, maxLength: 500 }
        village: { type: [string, 'null'], maxLength: 120 }
        district: { type: [string, 'null'], maxLength: 120 }
        city: { type: string, minLength: 1, maxLength: 120 }
        province: { type: [string, 'null'], maxLength: 120 }
        postalCode: { type: [string, 'null'], pattern: '^[0-9]{5}$' }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        source: { $ref: '#/components/schemas/AddressSource' }
        notes: { type: [string, 'null'], maxLength: 2000 }
    AddressRecord:
      allOf:
        - { $ref: '#/components/schemas/DatedRecordMeta' }
        - { $ref: '#/components/schemas/AddressInput' }
    EducationLevel:
      type: string
      enum: [SD, SMP, SMA_SEDERAJAT, D1, D2, D3, D4_S1, S2, S3, PONDOK, LAINNYA]
    CompletionStatus:
      type: string
      enum: [SELESAI, BELUM_SELESAI, TIDAK_SELESAI]
    VerificationStatus:
      type: string
      enum: [DILAPORKAN, DIVERIFIKASI]
    SkillKind:
      type: string
      enum: [KEAHLIAN, SERTIFIKAT]
    SkillCategory:
      type: string
      enum: [PENGAJARAN, KEAGAMAAN, ADMINISTRASI, TEKNOLOGI, BAHASA, KESEHATAN_KESELAMATAN, LAINNYA]
    ProficiencyLevel:
      type: string
      enum: [DASAR, MENENGAH, MAHIR]
    ProfileRecordMeta:
      type: object
      required: [id, employeeId, verificationStatus]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        verifiedAt: { type: [string, 'null'], format: date-time }
        unverifiedAt: { type: [string, 'null'], format: date-time }
        unverifiedReason:
          type: [string, 'null']
          description: Why a verification was taken back; who verified it stays on the record.
        voidedAt: { type: [string, 'null'], format: date-time }
        voidedReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EducationInput:
      type: object
      additionalProperties: false
      required: [level, institutionName, completionStatus]
      properties:
        level: { $ref: '#/components/schemas/EducationLevel' }
        institutionName: { type: string, minLength: 1, maxLength: 200 }
        major: { type: [string, 'null'], maxLength: 200 }
        startedYear: { type: [integer, 'null'] }
        completedYear:
          type: [integer, 'null']
          description: Required when completionStatus is SELESAI, and never before startedYear.
        completionStatus: { $ref: '#/components/schemas/CompletionStatus' }
        degreeTitle: { type: [string, 'null'], maxLength: 100 }
        certificateNumber: { type: [string, 'null'], maxLength: 120 }
        archiveReference: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    EducationRecord:
      allOf:
        - { $ref: '#/components/schemas/ProfileRecordMeta' }
        - { $ref: '#/components/schemas/EducationInput' }
    SkillInput:
      type: object
      additionalProperties: false
      required: [kind, name, category]
      properties:
        kind: { $ref: '#/components/schemas/SkillKind' }
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { $ref: '#/components/schemas/SkillCategory' }
        proficiency:
          oneOf:
            - { $ref: '#/components/schemas/ProficiencyLevel' }
            - { type: 'null' }
        issuer: { type: [string, 'null'], maxLength: 200 }
        certificateNumber: { type: [string, 'null'], maxLength: 120 }
        issuedOn: { type: [string, 'null'], format: date }
        expiresOn:
          type: [string, 'null']
          format: date
          description: Never before issuedOn. A date in the past marks the certificate expired; it is not rewritten.
        archiveReference: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    SkillRecord:
      allOf:
        - { $ref: '#/components/schemas/ProfileRecordMeta' }
        - { $ref: '#/components/schemas/SkillInput' }
        - type: object
          properties:
            expired: { type: boolean, description: Derived on read against the Asia/Jakarta business date. }
    VerificationInput:
      type: object
      required: [verified]
      properties:
        verified: { type: boolean }
        reason:
          type: [string, 'null']
          maxLength: 500
          description: At least five characters when verified is false; refused otherwise.
    VoidInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    VoidedRecord:
      type: object
      required: [id, voided]
      properties:
        id: { type: string, format: uuid }
        voided: { type: boolean, const: true }
    ExpiringCertificateList:
      type: object
      required: [date, withinDays, page, pageSize, total, rows]
      properties:
        date: { type: string, format: date }
        withinDays: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, description: The real total, also on a page past the end. }
        rows:
          type: array
          items:
            type: object
            required: [recordId, employeeId, employeeNumber, fullName, name, expiresOn, daysLeft, verificationStatus, expired]
            properties:
              recordId: { type: string, format: uuid }
              employeeId: { type: string, format: uuid }
              employeeNumber: { type: string }
              fullName: { type: string }
              unitName: { type: [string, 'null'] }
              name: { type: string }
              issuer: { type: [string, 'null'] }
              expiresOn: { type: string, format: date }
              daysLeft: { type: integer, description: Negative when the certificate has already lapsed. }
              verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
              expired: { type: boolean }
    AccountTemporaryReactivation:
      type: object
      required: [id, accountId, reason, startsAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        reason: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: At most 30 days after startsAt. }
        grantedByAccountId: { type: [string, 'null'], format: uuid }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedByAccountId: { type: [string, 'null'], format: uuid }
    EmploymentWarning:
      type: string
      enum: [BACKDATED, TERM_GAP, CONTRACT_DURATION_LONG, PROBATION_DURATION_LONG]
    EmploymentPlacementInput:
      type: object
      additionalProperties: false
      required: [unitId, jobTitleLabel]
      description: |
        Package 1 records placements against the legacy unit/position tables,
        the ones the nine projected employees columns point at. An ORG-004 node
        key is not accepted: until a mapping to the legacy unit is agreed,
        projecting one would clear an employee's unit for every legacy consumer.
        positionId is what keeps employees.position_id filled, so a career move
        that leaves it out clears that column.
      properties:
        unitId: { type: string, format: uuid }
        positionId: { type: [string, 'null'], format: uuid }
        jobTitleLabel: { type: string, minLength: 1, maxLength: 200 }
    EmploymentActionRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, category, placement]
          properties:
            actionType: { type: string, enum: [HIRE] }
            effectiveOn: { type: string, format: date }
            category: { $ref: '#/components/schemas/PkCategoryOrPermanent' }
            termEndOn: { type: [string, 'null'], format: date, description: Required for every fixed-term category (D-03). }
            staffType: { type: [string, 'null'], enum: [PENDIDIK, KEPENDIDIKAN, null] }
            contractReference: { type: [string, 'null'], maxLength: 200 }
            placement: { $ref: '#/components/schemas/EmploymentPlacementInput' }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, termEndOn]
          properties:
            actionType: { type: string, enum: [CONTRACT_EXTENSION] }
            effectiveOn: { type: string, format: date }
            termEndOn: { type: string, format: date }
            contractReference: { type: [string, 'null'], maxLength: 200 }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, category]
          properties:
            actionType: { type: string, enum: [CATEGORY_CHANGE] }
            effectiveOn: { type: string, format: date }
            category: { $ref: '#/components/schemas/PkCategoryOrPermanent' }
            termEndOn: { type: [string, 'null'], format: date }
            contractReference: { type: [string, 'null'], maxLength: 200 }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, placement]
          description: |
            EMP-006 PLACEMENT: opens the primary placement when none is effective,
            or adds an additional duty. It is not a career move and needs no basis
            document, though an SK may be linked.
          properties:
            actionType: { type: string, enum: [PLACEMENT] }
            effectiveOn: { type: string, format: date }
            placement: { $ref: '#/components/schemas/EmploymentPlacementWithKind' }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, placementId]
          description: EMP-006 — ends an additional duty from effectiveOn; the primary placement is untouched.
          properties:
            actionType: { type: string, enum: [PLACEMENT_END] }
            effectiveOn: { type: string, format: date }
            placementId: { type: string, format: uuid }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, effectiveOn, placement]
          description: |
            EMP-006 career move: closes the current primary placement the day
            before effectiveOn and opens the new one. Each kind needs its own SK
            (Mutasi, Promosi, Demosi); a demotion also needs a reason code.
            Whether a move is a promotion is declared by Human Capital with the
            SK, not computed: Package 1 has no grade model.
          properties:
            actionType: { type: string, enum: [TRANSFER, PROMOTION, DEMOTION] }
            effectiveOn: { type: string, format: date }
            placement: { $ref: '#/components/schemas/EmploymentPlacementInput' }
            reasonCode: { oneOf: [{ $ref: '#/components/schemas/CareerReasonCode' }, { type: 'null' }] }
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
        - type: object
          additionalProperties: false
          required: [actionType, lastDayOn, reasonCode]
          properties:
            actionType: { type: string, enum: [TERMINATION] }
            lastDayOn: { type: string, format: date, description: The last working day; the employment ends on it. }
            reasonCode:
              type: string
              enum: [RESIGN, KONTRAK_BERAKHIR, PENSIUN, PEMBERHENTIAN, MENINGGAL_DUNIA, LAINNYA]
            reasonNote: { type: [string, 'null'], maxLength: 1000 }
            documentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
            acknowledgedWarnings: { type: array, items: { $ref: '#/components/schemas/EmploymentWarning' } }
    EmploymentPlacementWithKind:
      type: object
      additionalProperties: false
      required: [unitId, jobTitleLabel]
      description: A placement that may be the primary one or an additional duty beside it.
      properties:
        unitId: { type: string, format: uuid }
        positionId: { type: [string, 'null'], format: uuid }
        jobTitleLabel: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, enum: [PRIMARY, ADDITIONAL], default: PRIMARY }
    CareerReasonCode:
      type: string
      enum: [RESTRUKTURISASI, KINERJA, DISIPLIN, PERMINTAAN_PEGAWAI, KEBUTUHAN_ORGANISASI, LAINNYA]
    PkCategoryOrPermanent:
      type: string
      enum: [TETAP, KONTRAK, KONTRAK_HONORER, MAGANG, PERCOBAAN, LEPAS]
    EmploymentActionPreview:
      type: object
      required: [actionType, effectiveOn, warnings, previous, next, documentIds, state]
      properties:
        actionType: { type: string }
        effectiveOn: { type: [string, 'null'], format: date }
        reasonCode: { type: [string, 'null'] }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/EmploymentWarning' }
          description: Warnings must be echoed in acknowledgedWarnings when recording (D-04).
        previous: { type: object, description: Display-only "dari" summary. }
        next: { type: object, description: Display-only "menjadi" summary. }
        documentIds: { type: array, items: { type: string, format: uuid } }
        expectedVersion: { type: [integer, 'null'], description: Optimistic token of the affected employment. }
        state:
          type: string
          enum: [AKTIF, AKAN_MULAI, BERAKHIR, TANPA_DATA]
          description: The derived state the action produces, not the current one.
        structureNote:
          type: [string, 'null']
          description: |
            EMP-006 D-18 — set on every placement or career move: the action
            records where the employee works and never writes ORG-004 or moves
            approval authority.
        accountDeactivation:
          type: object
          description: EMP-005 D-15 — when the employee's login account closes.
          properties:
            willDeactivate: { type: boolean }
            onDate: { type: [string, 'null'], format: date }
    EmployeeProjection:
      type: object
      description: The nine legacy employees columns as the action left them (spec §8.4).
      properties:
        status: { type: string, enum: [active, inactive, resigned] }
        employmentStatus: { type: [string, 'null'] }
        employmentType: { type: [string, 'null'] }
        organizationalUnitId: { type: [string, 'null'], format: uuid }
        positionId: { type: [string, 'null'], format: uuid }
        functionalPosition: { type: [string, 'null'] }
        structuralPosition: { type: [string, 'null'] }
        startedOn: { type: [string, 'null'], format: date }
        endedOn: { type: [string, 'null'], format: date }
    DecisionDocumentKind:
      type: string
      enum: [PERJANJIAN_KERJA, SURAT_KEPUTUSAN]
    PkType:
      type: string
      enum: [PK_BARU, PK_PERPANJANGAN]
    SkType:
      type: string
      enum: [SK_PENGANGKATAN, SK_MUTASI, SK_PROMOSI, SK_DEMOSI, SK_PEMBERHENTIAN, SK_PENEMPATAN, SK_LAINNYA]
    PkCategory:
      type: string
      enum: [KONTRAK, KONTRAK_HONORER, MAGANG, PERCOBAAN, LEPAS]
      description: A Perjanjian Kerja is always fixed-term (D-03); TETAP comes from an SK Pengangkatan.
    DecisionDocumentWrite:
      type: object
      additionalProperties: false
      required: [documentKind, documentNumber, signedOn]
      description: |
        Kind-specific fields: a PERJANJIAN_KERJA requires pkType, employeeId,
        contractFrom, contractTo, and category; a SURAT_KEPUTUSAN requires skType,
        subject, issuingAuthorityLabel, and effectiveOn. Fields of the other kind
        are ignored and stored as null.
      properties:
        documentKind: { $ref: '#/components/schemas/DecisionDocumentKind' }
        documentNumber: { type: string, minLength: 1, maxLength: 120 }
        signedOn: { type: string, format: date }
        externalReference: { type: [string, 'null'], maxLength: 500, description: Where the signed original is kept; no upload in Package 1. }
        notes: { type: [string, 'null'], maxLength: 2000 }
        pkType: { oneOf: [{ $ref: '#/components/schemas/PkType' }, { type: 'null' }] }
        employeeId: { type: [string, 'null'], format: uuid }
        contractFrom: { type: [string, 'null'], format: date }
        contractTo: { type: [string, 'null'], format: date }
        category: { oneOf: [{ $ref: '#/components/schemas/PkCategory' }, { type: 'null' }] }
        signatoryEmployerLabel: { type: [string, 'null'], maxLength: 500, description: Text only; grants no authority. }
        previousPkId: { type: [string, 'null'], format: uuid, description: PK_PERPANJANGAN only; same employee. }
        skType: { oneOf: [{ $ref: '#/components/schemas/SkType' }, { type: 'null' }] }
        subject: { type: [string, 'null'], maxLength: 500 }
        issuingAuthorityLabel: { type: [string, 'null'], maxLength: 500, description: Text only; proves no authority. }
        effectiveOn: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    DecisionDocumentEdit:
      allOf:
        - { $ref: '#/components/schemas/DecisionDocumentWrite' }
        - type: object
          properties:
            expectedUpdatedAt:
              type: string
              format: date-time
              description: |
                The updatedAt the operator had on screen. When it no longer matches
                the stored row the write is refused with EMPLOYMENT_VERSION_CONFLICT.
                Omitted means last write wins.
    DecisionDocument:
      allOf:
        - { $ref: '#/components/schemas/DecisionDocumentWrite' }
        - type: object
          required: [id, signedYear, linkedActionCount, locked, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            signedYear: { type: integer, description: Derived from signedOn; numbering is unique per kind, number, and year. }
            employeeNumber: { type: [string, 'null'] }
            employeeName: { type: [string, 'null'] }
            previousPkNumber: { type: [string, 'null'] }
            linkedActionCount: { type: integer }
            locked: { type: boolean, description: True once an action uses the document; only a correction may change it. }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    DecisionDocumentDetail:
      allOf:
        - { $ref: '#/components/schemas/DecisionDocument' }
        - type: object
          required: [links, corrections]
          properties:
            links:
              type: array
              items:
                type: object
                properties:
                  actionId: { type: string, format: uuid }
                  actionType: { type: string }
                  effectiveOn: { type: [string, 'null'], format: date }
                  employeeId: { type: string, format: uuid }
                  employeeNumber: { type: [string, 'null'] }
                  employeeName: { type: [string, 'null'] }
                  state: { type: string, enum: [RECORDED, REVERSED] }
            corrections:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  previousValues: { type: object, description: The document values before this correction (D-09). }
                  reason: { type: string }
                  correctedAt: { type: string, format: date-time }
    EmploymentRolloutMode:
      type: string
      enum: [OFF, SHADOW, AUTHORITATIVE]
    EmploymentCategory:
      type: string
      enum: [TETAP, KONTRAK, KONTRAK_HONORER, MAGANG, PERCOBAAN, LEPAS, BELUM_DIKLASIFIKASIKAN]
    Employment:
      type: object
      required: [id, employeeId, startedOn, startBasis, endedOn, endBasis, endReason, version]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        legalEntityKey: { type: [string, 'null'], format: uuid }
        staffType: { type: [string, 'null'], enum: [PENDIDIK, KEPENDIDIKAN, null] }
        startedOn: { type: [string, 'null'], format: date }
        startBasis: { type: string, enum: [RECORDED, UNKNOWN] }
        serviceStartOn: { type: [string, 'null'], format: date }
        endedOn: { type: [string, 'null'], format: date }
        endBasis: { type: [string, 'null'], enum: [RECORDED, UNKNOWN, null] }
        endPrecision: { type: [string, 'null'], enum: [DAY, MONTH, null] }
        endReason: { type: [string, 'null'] }
        version: { type: integer, description: Optimistic-concurrency token. }
    EmploymentTerm:
      type: object
      required: [id, employmentId, sequence, category, effectiveFrom, effectiveTo]
      properties:
        id: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        category: { $ref: '#/components/schemas/EmploymentCategory' }
        effectiveFrom: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        contractReference: { type: [string, 'null'] }
    Placement:
      type: object
      required: [id, employmentId, kind, unitRef, jobTitleLabel, effectiveFrom, effectiveTo, effectiveFromBasis]
      properties:
        id: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
        kind: { type: string, enum: [PRIMARY, ADDITIONAL] }
        unitRef:
          type: object
          description: ORG-004 node stable key or legacy organizational unit.
          properties:
            kind: { type: string, enum: [ORG_NODE, LEGACY_UNIT] }
            key: { type: string, format: uuid }
            id: { type: string, format: uuid }
        positionRef:
          type: [object, 'null']
          properties:
            kind: { type: string, enum: [ORG_POSITION, LEGACY_POSITION] }
            key: { type: string, format: uuid }
            id: { type: string, format: uuid }
        unitName: { type: [string, 'null'] }
        positionName: { type: [string, 'null'] }
        jobTitleLabel: { type: string }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        effectiveFromBasis:
          type: string
          enum: [RECORDED, BASELINE_ASSUMED]
          description: BASELINE_ASSUMED = "sejak data awal"; the real start is unknown.
    EmploymentSummary:
      type: object
      required: [mode, date, state, flags, current, employments]
      properties:
        mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
        date: { type: string, format: date }
        state:
          type: string
          enum: [AKTIF, AKAN_MULAI, BERAKHIR, TANPA_DATA]
          description: The derived state the action produces, not the current one.
        structureNote:
          type: [string, 'null']
          description: |
            EMP-006 D-18 — set on every placement or career move: the action
            records where the employee works and never writes ORG-004 or moves
            approval authority.
        accountDeactivation:
          type: object
          description: EMP-005 D-15 — when the employee's login account closes.
          properties:
            willDeactivate: { type: boolean }
            onDate: { type: [string, 'null'], format: date }
        flags:
          type: array
          items:
            type: string
            enum: [KONTRAK_SEGERA_BERAKHIR, KONTRAK_LEWAT_TANPA_TINDAK_LANJUT, TANPA_PENEMPATAN, TANGGAL_MULAI_TIDAK_DIKETAHUI, TANGGAL_AKHIR_TIDAK_DIKETAHUI]
        current:
          type: object
          properties:
            employment: { oneOf: [{ $ref: '#/components/schemas/Employment' }, { type: 'null' }] }
            term: { oneOf: [{ $ref: '#/components/schemas/EmploymentTerm' }, { type: 'null' }] }
            primaryPlacement: { oneOf: [{ $ref: '#/components/schemas/Placement' }, { type: 'null' }] }
            additionalPlacements:
              type: array
              items: { $ref: '#/components/schemas/Placement' }
        employments:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/Employment' }
              - type: object
                properties:
                  terms: { type: array, items: { $ref: '#/components/schemas/EmploymentTerm' } }
                  placements: { type: array, items: { $ref: '#/components/schemas/Placement' } }
    EmploymentAction:
      type: object
      required: [id, actionType, effectiveOn, state, recordedAt, documents]
      properties:
        id: { type: string, format: uuid }
        actionType:
          type: string
          enum: [BASELINE, HIRE, CONTRACT_EXTENSION, CATEGORY_CHANGE, PLACEMENT, TRANSFER, PROMOTION, DEMOTION, TERMINATION, REVERSAL]
        effectiveOn: { type: [string, 'null'], format: date }
        state: { type: string, enum: [RECORDED, REVERSED] }
        reversesActionId: { type: [string, 'null'], format: uuid }
        reversedByActionId: { type: [string, 'null'], format: uuid }
        reasonCode: { type: [string, 'null'] }
        previousSnapshot: { type: object, description: Display-only "dari" summary. }
        newSnapshot: { type: object, description: Display-only "menjadi" summary. }
        recordedAt: { type: string, format: date-time }
        documents:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [PERJANJIAN_KERJA, SURAT_KEPUTUSAN] }
              number: { type: string }
              type: { type: [string, 'null'] }
    EmploymentConsistencyReport:
      type: object
      required: [mode, date, employeeCount, groups, total, page, pageSize, rows]
      properties:
        mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
        date: { type: string, format: date }
        employeeCount: { type: integer }
        groups:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: >-
                  Baseline issue code (BASELINE_*), BASELINE_NOT_LOADED,
                  HISTORY_DIFFERS_FROM_MASTER, ACTIVE_WITHOUT_PLACEMENT,
                  CONTRACT_EXPIRED_WITHOUT_FOLLOW_UP, and in AUTHORITATIVE the
                  two EMP-006 structure comparisons STRUCTURE_SEAT_WITHOUT_PLACEMENT
                  and PLACEMENT_WITHOUT_STRUCTURE_SEAT.
              count: { type: integer }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        pagination: { $ref: './openapi.yaml#/components/schemas/Pagination' }
        rows:
          type: array
          items:
            type: object
            properties:
              employeeId: { type: string, format: uuid }
              employeeNumber: { type: [string, 'null'] }
              fullName: { type: [string, 'null'] }
              codes: { type: array, items: { type: string } }
              differingFields:
                type: array
                items: { type: string, enum: [status, startedOn, organizationalUnitId, positionId, employmentStatus] }
