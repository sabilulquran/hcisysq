version: 1
status: VERIFIED
source_system: legacy-hcis
updated_at: 2026-09-21
verification_checkpoint: docs/product/mvp-release-checkpoint.md

status_values:
  - discovery
  - specified
  - planned
  - implementing
  - implemented
  - verified
  - deferred
  - removed

rules:
  - Legacy behavior is evidence, not automatic product truth.
  - Every feature requires acceptance criteria before implementation.
  - Financial and authorization features require additional review.
  - MVP scope is defined in docs/product/mvp.md.
  - MVP verification evidence is frozen in docs/product/mvp-release-checkpoint.md.
  - A verified MVP feature does not imply full legacy parity or production cutover readiness.
  - ORG-004 implementation/deployment does not imply activation; rollout remains LEGACY until explicitly configured and must pass SHADOW and pilot validation before STRUCTURE.
  - Planned, discovery, or deferred capabilities may appear in UI only as clearly non-operational Coming Soon surfaces; visibility is not implementation or release evidence.

