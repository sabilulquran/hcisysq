  /admin/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: Page through the employee master (EMP-001, ENG-LIST-001 reference list)
      description: >
        Server-side offset pagination per ENG-LIST-001 §3.1. Filters run in SQL before LIMIT;
        ordering is full name then employee number. A pageSize above 100 is refused with 400.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: Employee number, name or email }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive, resigned] } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: positionId, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: One page of employees with the filtered total, the global status summary and filter options
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination, summary, filters]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, employeeNumber, fullName, status]
                      properties:
                        id: { type: string, format: uuid }
                        employeeNumber: { type: string }
                        fullName: { type: string }
                        status: { type: string, enum: [active, inactive, resigned] }
                        unitId: { type: [string, 'null'], format: uuid }
                        unitName: { type: [string, 'null'] }
                        positionId: { type: [string, 'null'], format: uuid }
                        positionName: { type: [string, 'null'] }
                        updatedAt: { type: string, format: date-time }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  summary:
                    type: object
                    required: [total, active, inactive, resigned]
                    properties:
                      total: { type: integer }
                      active: { type: integer }
                      inactive: { type: integer }
                      resigned: { type: integer }
                  filters:
                    type: object
                    properties:
                      units: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } } }
                      positions: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } } }
        '400': { description: 'INVALID_QUERY: a filter or page parameter is out of range' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
