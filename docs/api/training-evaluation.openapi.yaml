openapi: 3.1.0
info:
  title: HCIS Training Evaluation (TRAIN-001 R3)
  version: 1.0.0
  description: |
    Training evaluation in four levels: instruments (FORM, TEST, RUBRIC), the evaluation plan of a
    program, answers from participants, supervisors and HC, server-side scoring and the per-program
    and per-employee recap, as implemented in apps/api/src/modules/training/evaluation-routes.ts.
    Spec: docs/domain/training-evaluation.md. Session cookie; Cache-Control: no-store; errors are
    { code, message }. /training/me/* is EMPLOYEE enrolment or assessor assignment (anything else is
    404); /admin/training/* needs training.read (reads) or training.manage (writes). Answer keys
    (`correct`, `accepted`) appear only in the HC instrument and component reads, never in a form.
paths:
  /training/me/evaluation/tasks:
    get:
      tags: [Training]
      operationId: listMyEvaluationTasks
      summary: Open evaluation tasks of the signed-in employee, as participant and as supervisor assessor (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of tasks
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Task' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /training/me/evaluation/components/{id}/form:
    get:
      tags: [Training]
      operationId: getMyEvaluationForm
      summary: The form to answer, without answer keys (TRAIN-R3-A)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Subject'
      responses:
        '200': { $ref: '#/components/responses/Form' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /training/me/evaluation/components/{id}/responses:
    post:
      tags: [Training]
      operationId: submitMyEvaluationResponse
      summary: Submit one answer set; tests are scored on the server (E-04, E-05, E-13)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseInput' }
      responses:
        '201': { $ref: '#/components/responses/Submitted' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /training/me/evaluation/results:
    get:
      tags: [Training]
      operationId: listMyEvaluationResults
      summary: The signed-in employee's evaluation outcome per program (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Outcomes' }
  /admin/training/instruments:
    get:
      tags: [Training]
      operationId: listTrainingInstruments
      summary: Instruments, the system questionnaire first (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/InstrumentKind' } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, ARCHIVED] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: One page of instruments
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InstrumentSummary' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Training]
      operationId: createTrainingInstrument
      summary: Create an instrument; items are renumbered q1..qN (E-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/training/instruments/{id}:
    get:
      tags: [Training]
      operationId: getTrainingInstrument
      summary: One instrument with its items and answer keys
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Instrument
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Training]
      operationId: updateTrainingInstrument
      summary: Change title, description or items; existing components keep their copy (E-03)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 3, maxLength: 200 }
                description: { type: [string, 'null'], maxLength: 1000 }
                items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/Item' } }
      responses:
        '200': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/training/instruments/{id}/archive:
    post:
      tags: [Training]
      operationId: archiveTrainingInstrument
      summary: Archive an instrument (not the system questionnaire)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/training/programs/{id}/evaluation:
    patch:
      tags: [Training]
      operationId: updateTrainingEvaluationPlan
      summary: Set the passing score of the program (E-07, default 75)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passingScore]
              properties:
                passingScore: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/training/programs/{id}/evaluation/components:
    get:
      tags: [Training]
      operationId: listTrainingEvaluationComponents
      summary: The evaluation plan of a program (bounded, E-18)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema:
                type: object
                required: [passingScore, items]
                properties:
                  passingScore: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/Component' } }
    post:
      tags: [Training]
      operationId: createTrainingEvaluationComponent
      summary: Add a component; the instrument items are copied (E-03, E-06)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/training/evaluation/components/{id}:
    patch:
      tags: [Training]
      operationId: updateTrainingEvaluationComponent
      summary: Change title, window, required; weight only before the first answer
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 3, maxLength: 200 }
                weight: { type: integer, minimum: 0, maximum: 100 }
                required: { type: boolean }
                opensAt: { type: [string, 'null'], format: date-time }
                closesAt: { type: [string, 'null'], format: date-time }
      responses:
        '200': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/training/evaluation/components/{id}/archive:
    post:
      tags: [Training]
      operationId: archiveTrainingEvaluationComponent
      summary: Archive a component with a reason; answers stay stored
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/training/evaluation/components/{id}/assessors:
    get:
      tags: [Training]
      operationId: listTrainingEvaluationAssessors
      summary: Participants with their assessor for a component (paged)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of participants
          content:
            application/json:
              schema:
                type: object
                required: [respondent, items, pagination]
                properties:
                  respondent: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        subjectEmployeeId: { type: string, format: uuid }
                        subjectName: { type: string }
                        subjectNumber: { type: string }
                        assessorEmployeeId: { type: [string, 'null'], format: uuid }
                        assessorName: { type: [string, 'null'] }
                        source: { type: string, enum: [DIRECT_MANAGER, GOVERNANCE_APPROVER, UNRESOLVED, HC_ASSIGNED] }
                        answered: { type: boolean }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    put:
      tags: [Training]
      operationId: assignTrainingEvaluationAssessors
      summary: Assign or replace supervisor assessors (E-14, E-15)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [subjectEmployeeId, assessorEmployeeId]
                    properties:
                      subjectEmployeeId: { type: string, format: uuid }
                      assessorEmployeeId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/training/evaluation/components/{id}/form:
    get:
      tags: [Training]
      operationId: getHcEvaluationForm
      summary: The form of an HC-answered component (rubric about a participant, result indicators)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Subject'
      responses:
        '200': { $ref: '#/components/responses/Form' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/training/evaluation/components/{id}/responses:
    post:
      tags: [Training]
      operationId: submitHcEvaluationResponse
      summary: Submit an HC answer set; never about oneself (E-15)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseInput' }
      responses:
        '201': { $ref: '#/components/responses/Submitted' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/training/evaluation/components/{id}/comments:
    get:
      tags: [Training]
      operationId: listTrainingEvaluationComments
      summary: Text answers of a component (paged); anonymous ones hidden under three responses (E-11)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of comments
          content:
            application/json:
              schema:
                type: object
                required: [hidden, items, pagination]
                properties:
                  hidden: { type: boolean }
                  threshold: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        itemId: { type: string }
                        text: { type: string }
                        subjectName: { type: [string, 'null'] }
                        submittedOn: { type: string, format: date }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /admin/training/programs/{id}/evaluation/summary:
    get:
      tags: [Training]
      operationId: getTrainingEvaluationSummary
      summary: Aggregates per component (reaction per item, pre/post averages and gain, scores)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [passingScore, participantCount, components]
                properties:
                  passingScore: { type: integer }
                  participantCount: { type: integer }
                  components: { type: array, items: { type: object, additionalProperties: true } }
  /admin/training/programs/{id}/evaluation/results:
    get:
      tags: [Training]
      operationId: listTrainingEvaluationResults
      summary: Outcome per participant (paged, E-07)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Outcomes' }
  /admin/training/employees/{employeeId}/evaluation:
    get:
      tags: [Training]
      operationId: listEmployeeTrainingEvaluation
      summary: Outcome per program of one employee (paged)
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Outcomes' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Stage:
      name: stage
      in: query
      schema: { type: string, enum: [SINGLE, PRE, POST], default: SINGLE }
    Subject:
      name: subjectEmployeeId
      in: query
      description: The participant assessed (supervisor and HC rubric components).
      schema: { type: string, format: uuid }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Pagination:
      type: object
      required: [page, pageSize, total, pageCount]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        pageCount: { type: integer }
    InstrumentKind:
      type: string
      enum: [FORM, TEST, RUBRIC]
    Item:
      type: object
      description: |
        SCALE, CHOICE, TEXT (FORM); SINGLE, MULTI, TRUE_FALSE, SHORT (TEST, with `correct` or
        `accepted` and `points` 1–10); CRITERION (RUBRIC, `levels` of exactly four descriptors).
      required: [type, prompt]
      properties:
        id: { type: string }
        type: { type: string, enum: [SCALE, CHOICE, TEXT, SINGLE, MULTI, TRUE_FALSE, SHORT, CRITERION] }
        prompt: { type: string, maxLength: 500 }
        required: { type: boolean }
        options: { type: array, items: { type: string }, minItems: 2, maxItems: 10 }
        correct: {}
        accepted: { type: array, items: { type: string } }
        points: { type: integer, minimum: 1, maximum: 10 }
        levels: { type: array, items: { type: string }, minItems: 4, maxItems: 4 }
    InstrumentInput:
      type: object
      required: [kind, title, items]
      properties:
        kind: { $ref: '#/components/schemas/InstrumentKind' }
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
        items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/Item' } }
    InstrumentSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/InstrumentKind' }
        title: { type: string }
        description: { type: [string, 'null'] }
        isSystem: { type: boolean }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        itemCount: { type: integer }
        usedBy: { type: integer }
    Instrument:
      allOf:
        - $ref: '#/components/schemas/InstrumentSummary'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Item' } }
    ComponentInput:
      type: object
      required: [kind, instrumentId]
      properties:
        kind: { type: string, enum: [REACTION, PRE_POST_TEST, TEST, RUBRIC, FORM, RESULT] }
        instrumentId: { type: string, format: uuid }
        title: { type: string, minLength: 3, maxLength: 200 }
        level: { type: [integer, 'null'], minimum: 1, maximum: 4 }
        respondent: { type: [string, 'null'], enum: [PARTICIPANT, SUPERVISOR, HC, null] }
        anonymous: { type: [boolean, 'null'] }
        weight: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        required: { type: boolean }
        opensAt: { type: [string, 'null'], format: date-time }
        closesAt: { type: [string, 'null'], format: date-time }
    Component:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        level: { type: integer }
        respondent: { type: string }
        title: { type: string }
        instrumentId: { type: string, format: uuid }
        instrumentKind: { $ref: '#/components/schemas/InstrumentKind' }
        items: { type: array, items: { $ref: '#/components/schemas/Item' } }
        anonymous: { type: boolean }
        weight: { type: integer }
        required: { type: boolean }
        opensAt: { type: [string, 'null'], format: date-time }
        closesAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        archiveReason: { type: [string, 'null'] }
        responseCount: { type: integer }
        unassignedCount: { type: integer }
    Task:
      type: object
      properties:
        componentId: { type: string, format: uuid }
        title: { type: string }
        kind: { type: string }
        level: { type: integer }
        anonymous: { type: boolean }
        stage: { type: string, enum: [SINGLE, PRE, POST] }
        programId: { type: string, format: uuid }
        programTitle: { type: string }
        subjectEmployeeId: { type: [string, 'null'], format: uuid }
        subjectName: { type: [string, 'null'] }
        as: { type: string, enum: [PARTICIPANT, SUPERVISOR] }
        closesAt: { type: [string, 'null'], format: date-time }
    ResponseInput:
      type: object
      required: [answers]
      properties:
        stage: { type: string, enum: [SINGLE, PRE, POST], default: SINGLE }
        subjectEmployeeId: { type: [string, 'null'], format: uuid }
        answers:
          type: object
          description: '{ [itemId]: number | boolean | string | number[] }'
          additionalProperties: true
    Outcome:
      type: object
      properties:
        programId: { type: string, format: uuid }
        title: { type: string }
        employeeId: { type: string, format: uuid }
        fullName: { type: string }
        pre: { type: [number, 'null'] }
        post: { type: [number, 'null'] }
        gain: { type: [number, 'null'] }
        scores: { type: object, additionalProperties: { type: [number, 'null'] } }
        finalScore: { type: [number, 'null'] }
        status: { type: string, enum: [PASSED, FAILED, INCOMPLETE, NOT_GRADED] }
        applicationScore: { type: [number, 'null'], description: Mean level-3 rubric score (0–100). }
        applicationRating: { type: [number, 'null'], description: Mean level-3 form rating (1–5). }
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Created:
      description: Saved
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Form:
      description: Form without answer keys
      content:
        application/json:
          schema:
            type: object
            required: [component, program, stage, items]
            properties:
              component: { type: object, additionalProperties: true }
              program: { type: object, properties: { id: { type: string }, title: { type: string } } }
              stage: { type: string }
              subject: { type: [object, 'null'] }
              items: { type: array, items: { $ref: '#/components/schemas/Item' } }
    Submitted:
      description: Answer stored; tests carry their score
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, format: uuid }
              anonymous: { type: boolean }
              score: { type: [number, 'null'] }
              pointsEarned: { type: [number, 'null'] }
              pointsMax: { type: [number, 'null'] }
    Outcomes:
      description: One page of outcomes
      content:
        application/json:
          schema:
            type: object
            required: [items, pagination]
            properties:
              employee: { type: object, additionalProperties: true }
              items: { type: array, items: { $ref: '#/components/schemas/Outcome' } }
              pagination: { $ref: '#/components/schemas/Pagination' }
