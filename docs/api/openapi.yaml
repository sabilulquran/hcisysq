openapi: 3.1.0
info:
  title: HCIS YSQ API
  version: 0.0.1
  description: |
    Kontrak HTTP HCIS. Path yang didefinisikan langsung di file ini dan path yang dirujuk ke file
    docs/api/*.openapi.yaml mengikuti route yang benar-benar terdaftar di apps/api; test
    apps/api/test/api-contract.test.ts menolak YAML tidak valid, $ref yang putus, dan path
    yang tidak punya route. Route yang belum dijelaskan di kontrak tetap tercantum di manifest AUTH-011.
    AUTH-011 route permissions: docs/domain/AUTH-011-admin-route-permissions.json lists every non-public route
    (administrative, HC operational and self-service principal guards); tests enforce it against registered routes.
    Every administrative operation requires the declared effective organization permission;
    deprecated legacy HCIS SUPER_ADMIN compatibility grants no platform or workflow approval authority.
servers:
  - url: https://api.example.invalid
    description: Placeholder only

tags:
  - name: System
  - name: Session
  - name: Employees
  - name: Leave
  - name: Approvals
  - name: Organization
  - name: Organization Directory
  - name: Staff Identity Verification
  - name: Governance Summary
  - name: Board
  - name: Attendance
  - name: Payslips
  - name: Employment

paths:
  /internal/v1/staff-identity/verify-employee:
    post:
      tags: [Staff Identity Verification]
      operationId: verifyEmployeeForAkunSq
      summary: Verify one exact HCIS employee before Akun SQ provisioning
      description: Dedicated machine identity only; disabled by default; no employee mutation.
      security:
        - StaffIdentityBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employeeNumber]
              properties:
                employeeNumber:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: Exact current employee reference; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [employeeId, employeeNumber, displayName, email, status, verifiedAt]
                properties:
                  employeeId: { type: string, pattern: '^hcis:employee:[0-9a-f-]{36}$' }
                  employeeNumber: { type: string }
                  displayName: { type: string }
                  email: { type: [string, 'null'], format: email }
                  status: { type: string, enum: [active, inactive, resigned] }
                  verifiedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Employee does not exist or was removed
        '409':
          description: Ambiguous employee number
        '503':
          description: Verification contract disabled

  /governance/summary:
    get:
      tags: [Governance Summary]
      operationId: getGovernanceSummaryForSqHub
      summary: ORG-010 — HCIS governance summary for SQ Hub Ringkasan Yayasan
      description: |
        ORG-010 (ACCEPTED 2026-10-17). See docs/domain/foundation-board-governance-summary.md.
        Browser URL on the HCIS origin is /api/governance/summary (the web proxy strips /api).
        SQ Hub reaches the API through the internal proxy without that prefix, so the Hub registry path
        is /governance/summary (corrected 2026-10-18).
        Bearer-only; the exchanged token is accepted on this route and no other, and a cookie never
        authenticates it. Exactly one Authorization header with one bearer token. Disabled by default
        (GOVERNANCE_SUMMARY_ENABLED=false returns 404). Requires board access: active FOUNDATION_BOARD
        account, or active EMPLOYEE with effective organization-scope board.read; SQ Hub Application
        Access is re-checked per request (D3). Response follows SQ Hub HUB-IMPL-021 GovernanceSummaryV1;
        aggregate only, no actor or personal data. Monthly trend only in employment-history
        AUTHORITATIVE mode (last 12 completed months); ranking folds units under 3 into "Lainnya".
        No session or cookie is created. Every response sets Cache-Control no-store
        (200: private, no-store). Served and denied requests are audited without token or body.
      security:
        - GovernanceSummaryBearer: []
      responses:
        '200':
          description: HUB-IMPL-021 GovernanceSummaryV1 (contractVersion 1)
          content:
            application/json:
              schema:
                type: object
                required: [contractVersion, applicationKey, title, dataAsOf, metrics, detailUrl]
                properties:
                  contractVersion: { type: integer, const: 1 }
                  applicationKey: { type: string }
                  title: { type: string }
                  dataAsOf: { type: string, format: date-time }
                  metrics: { type: array, minItems: 1, maxItems: 6, items: { type: object } }
                  charts: { type: array, maxItems: 2, items: { type: object } }
                  attention: { type: array, maxItems: 3, items: { type: object } }
                  detailUrl: { type: string, format: uri }
        '401':
          description: UNAUTHENTICATED (no, malformed or several bearer tokens) or INVALID_TOKEN (signature, issuer, expiry, typ, sub)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: |
            FORBIDDEN_AUDIENCE, FORBIDDEN_CLIENT, OIDC_ACCOUNT_NOT_MAPPED, ACCOUNT_INACTIVE,
            BOARD_ACCESS_REQUIRED, or HCIS_ACCESS_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Endpoint disabled (GOVERNANCE_SUMMARY_ENABLED=false)
        '500':
          description: Unexpected error; the body carries no detail
        '503':
          description: APPLICATION_ACCESS_UNAVAILABLE or JWKS_UNAVAILABLE (owner decisions D3, D9)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /board/dashboard:
    get:
      tags: [Board]
      operationId: getBoardDashboard
      summary: ORG-003 / ORG-010 — Panel Organ Yayasan aggregates
      description: |
        Cookie session. Allowed for an active FOUNDATION_BOARD account, or an active EMPLOYEE with an
        active employee record and an effective organization-scope board.read assignment (ORG-010-A).
        Everyone else gets 403. Aggregate only; the response no longer carries actor.email (ORG-010 D7).
        Cache-Control private, no-store.
      responses:
        '200':
          description: ORG-003 aggregates
          content:
            application/json:
              schema:
                type: object
                required: [actor, generatedAt, employees, entitlementGroups, approvalReadiness, workflow, movements, unitDistribution, employmentStatus, unavailableModules]
                properties:
                  actor:
                    type: object
                    additionalProperties: false
                    required: [principalType]
                    properties:
                      principalType: { type: string, enum: [FOUNDATION_BOARD, EMPLOYEE] }
                  generatedAt: { type: string, format: date-time }
                  employees: { type: object }
                  entitlementGroups: { type: object }
                  approvalReadiness: { type: object }
                  workflow: { type: object }
                  movements: { type: object }
                  unitDistribution: { type: array, items: { type: object } }
                  employmentStatus: { type: array, items: { type: object } }
                  unavailableModules: { type: object }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /internal/v1/organization-directory/snapshot:
    get:
      tags: [Organization Directory]
      operationId: getOrganizationDirectorySnapshot
      summary: Pull the accepted HCIS organization-directory full snapshot
      security:
        - OrganizationDirectoryBearer: []
      parameters:
        - name: asOf
          in: query
          required: true
          description: Asia/Jakarta business date for effective snapshot selection.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Validated, privacy-minimized full snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDirectorySnapshot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Export is disabled or no effective accepted published snapshot is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /health:
    get:
      tags: [System]
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /auth/me:
    get:
      tags: [Session]
      operationId: getCurrentSession
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/launcher:
    get:
      tags: [Session]
      operationId: getAppLauncher
      summary: AUTH-013 SQ Hub applications for the header launcher
      description: >-
        Reads SQ Hub POST /internal/v1/application-access/launcher server-to-server with the
        signed-in account's stored OIDC issuer and subject, using the existing machine client.
        Cached per HCIS session for 5 minutes (a failure for 30 seconds). Any SQ Hub failure,
        local auth mode, or an account without a stored identity returns
        `{applications: null, unavailable: true}`. SQ Hub itself is not in the list.
      responses:
        '200':
          description: Application list, or the unavailable fallback
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppLauncher'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /leave/me/summary:
    $ref: './leave.openapi.yaml#/paths/~1leave~1me~1summary'
  /leave/me/annual/preview:
    $ref: './leave.openapi.yaml#/paths/~1leave~1me~1annual~1preview'
  /leave/me/annual/submit:
    $ref: './leave.openapi.yaml#/paths/~1leave~1me~1annual~1submit'
  /leave/me/requests:
    $ref: './leave.openapi.yaml#/paths/~1leave~1me~1requests'
  /leave/approvals:
    $ref: './leave.openapi.yaml#/paths/~1leave~1approvals'
  /leave/approvals/{stepId}/decision:
    $ref: './leave.openapi.yaml#/paths/~1leave~1approvals~1{stepId}~1decision'

  /admin/attendance/adms/management/summary:
    get:
      tags: [Attendance]
      operationId: getAdmsManagementSummary
      summary: Read fleet-level ADMS operational summary
      responses:
        '200': { description: Fleet, unmapped PIN, review, and command counters }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/management/user-sync:
    get:
      tags: [Attendance]
      operationId: listAdmsUserSynchronization
      summary: List desired-versus-observed ADMS user state across devices
      parameters:
        - { name: deviceId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [synced, unmapped, missing_on_device, name_drift, review_required] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        '200': { description: Safe fleet-level user synchronization rows; no biometric payload }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/management/jobs:
    get:
      tags: [Attendance]
      operationId: listAdmsManagementJobs
      summary: List human-readable ADMS command lifecycle across devices
      parameters:
        - { name: deviceId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, acknowledged, succeeded, failed, expired, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        '200': { description: Command/job summaries without wire commands }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/management/health:
    get:
      tags: [Attendance]
      operationId: listAdmsManagementHealth
      summary: List evidence-based ADMS device health and alerts
      responses:
        '200': { description: Connectivity, reconciliation, failed-job, unmapped-PIN, and source-IP evidence }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/management/audit:
    get:
      tags: [Attendance]
      operationId: listAdmsManagementAudit
      summary: List safe append-only ADMS administration audit summaries
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        '200': { description: Audit summaries without raw request or biometric payloads }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/devices:
    get:
      tags: [Attendance]
      operationId: listAdmsDevices
      summary: List registered ADMS fingerprint devices
      responses:
        '200':
          description: Device registry with current mapping and unmapped-PIN counts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdmsDevice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Attendance]
      operationId: registerAdmsDevice
      summary: Explicitly register an ADMS device serial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serialNumber]
              properties:
                serialNumber: { type: string, minLength: 1, maxLength: 128 }
                displayName: { type: [string, 'null'], maxLength: 160 }
                timezone: { type: string, default: Asia/Jakarta, maxLength: 100 }
      responses:
        '201':
          description: Registered active device
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/AdmsDevice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Serial already registered }

  /admin/attendance/adms/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Attendance]
      operationId: getAdmsDevice
      summary: Read ADMS device observability and mapping detail
      responses:
        '200':
          description: Device, mapping history, observed PINs, recent raw events, and quarantine outcomes; raw request body is excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmsDeviceDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Attendance]
      operationId: updateAdmsDevice
      summary: Update lifecycle or operational device metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: [string, 'null'], maxLength: 160 }
                lifecycle: { type: string, enum: [active, disabled, quarantined, retired] }
                timezone: { type: string, maxLength: 100 }
                model: { type: [string, 'null'], maxLength: 160 }
                firmwareVersion: { type: [string, 'null'], maxLength: 160 }
      responses:
        '200':
          description: Updated audited device
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/AdmsDevice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/retire:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Attendance]
      operationId: retireAdmsDevice
      summary: Retire an ADMS device while preserving historical evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 5, maxLength: 500 }
                replacementDeviceId: { type: [string, 'null'], format: uuid }
      responses:
        '200': { description: Retired device with optional replacement reference }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Device already retired or replacement invalid }

  /admin/attendance/adms/detected-devices:
    get:
      tags: [Attendance]
      operationId: listDetectedAdmsDevices
      summary: List detected ADMS serials that have not been automatically trusted
      responses:
        '200':
          description: Detection queue ordered with unclaimed devices first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, serialNumber, status, firstSeenAt, lastSeenAt, observedCount]
                      properties:
                        id: { type: string, format: uuid }
                        serialNumber: { type: string }
                        status: { type: string, enum: [detected, claimed, ignored] }
                        firstSeenAt: { type: string, format: date-time }
                        lastSeenAt: { type: string, format: date-time }
                        lastIp: { type: [string, 'null'] }
                        observedCount: { type: integer, minimum: 1 }
                        safeMetadata: { type: object, additionalProperties: true }
                        claimedDeviceId: { type: [string, 'null'], format: uuid }
                        claimedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/detected-devices/{detectedId}/claim:
    post:
      tags: [Attendance]
      operationId: claimDetectedAdmsDevice
      summary: Explicitly trust a detected serial by creating a disabled registry device
      parameters:
        - name: detectedId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: [string, 'null'], maxLength: 160 }
                timezone: { type: string, default: Asia/Jakarta, maxLength: 100 }
      responses:
        '201':
          description: Trusted registry row created in disabled lifecycle; activation remains separate
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Detection already processed or serial already registered }

  /admin/attendance/adms/devices/{deviceId}/health:
    get:
      tags: [Attendance]
      operationId: getAdmsDeviceHealth
      summary: Read server-derived connectivity independently from device lifecycle
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Connectivity and cadence evidence
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    type: object
                    required: [deviceId, lifecycle, connectivityStatus]
                    properties:
                      deviceId: { type: string, format: uuid }
                      lifecycle: { type: string, enum: [active, disabled, quarantined, retired] }
                      connectivityStatus: { type: string, enum: [online, offline, unknown] }
                      lastSeenAt: { type: [string, 'null'], format: date-time }
                      lastSuccessfulRequestAt: { type: [string, 'null'], format: date-time }
                      lastIp: { type: [string, 'null'] }
                      observedMedianRequestIntervalSeconds: { type: [number, 'null'] }
                      connectivityTimeoutOverrideSeconds: { type: [integer, 'null'], minimum: 30, maximum: 3600 }
                      effectiveConnectivityTimeoutSeconds: { type: [integer, 'null'] }
                      offlineAt: { type: [string, 'null'], format: date-time }
                      lastCommandActivityAt: { type: [string, 'null'], format: date-time }
                      lastTransactionActivityAt: { type: [string, 'null'], format: date-time }
                      lastSuccessfulSyncAt: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/connectivity-policy:
    patch:
      tags: [Attendance]
      operationId: updateAdmsConnectivityPolicy
      summary: Set a per-device connectivity timeout override or return to adaptive mode
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeoutSeconds]
              properties:
                timeoutSeconds: { type: [integer, 'null'], minimum: 30, maximum: 3600 }
      responses:
        '200': { description: Audited connectivity policy update }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/reconciliation-policy:
    patch:
      tags: [Attendance]
      operationId: updateAdmsReconciliationPolicy
      summary: Configure periodic bounded reconciliation; disabled by default
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, intervalMinutes, lookbackHours]
              properties:
                enabled: { type: boolean }
                intervalMinutes: { type: integer, minimum: 60, maximum: 10080 }
                lookbackHours: { type: integer, minimum: 1, maximum: 744 }
      responses:
        '200': { description: Audited reconciliation policy update }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/telemetry:
    get:
      tags: [Attendance]
      operationId: getAdmsDeviceTelemetry
      summary: Read safe registry, transport, and INFO telemetry without raw request bodies
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Safe device telemetry, INFO evidence, and reconciliation policy
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    type: object
                    required: [deviceId, reconciliationEnabled, reconciliationIntervalMinutes, reconciliationLookbackHours]
                    properties:
                      deviceId: { type: string, format: uuid }
                      model: { type: [string, 'null'] }
                      firmwareVersion: { type: [string, 'null'] }
                      transportObserved: { type: [object, 'null'], additionalProperties: true }
                      infoObserved: { type: [object, 'null'], additionalProperties: true, description: Allowlisted INFO result options only. }
                      firstSeenAt: { type: [string, 'null'], format: date-time }
                      lastSeenAt: { type: [string, 'null'], format: date-time }
                      lastSuccessfulRequestAt: { type: [string, 'null'], format: date-time }
                      lastIp: { type: [string, 'null'] }
                      reconciliationEnabled: { type: boolean }
                      reconciliationIntervalMinutes: { type: integer, minimum: 60, maximum: 10080 }
                      reconciliationLookbackHours: { type: integer, minimum: 1, maximum: 744 }
                      reconciliationLastRequestedAt: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/commands:
    get:
      tags: [Attendance]
      operationId: listAdmsDeviceCommands
      summary: List recent durable commands for a trusted device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Recent command state and result metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, commandNumber, commandType, wireCommand, reason, status, attemptCount, createdAt, updatedAt]
                      properties:
                        id: { type: string, format: uuid }
                        commandNumber: { type: string }
                        commandType: { type: string, enum: [sync_new, data_query, read_info] }
                        wireCommand: { type: string, description: Allowlisted LOG, INFO, or DATA QUERY ATTLOG range command only. }
                        reason: { type: string, enum: [registration_recovery, admin_sync_new, admin_range_recovery, admin_read_information, scheduled_reconciliation] }
                        status: { type: string, enum: [pending, delivered, acknowledged, succeeded, failed, expired, cancelled] }
                        attemptCount: { type: integer, minimum: 0 }
                        requestedRangeStart: { type: [string, 'null'], format: date-time }
                        requestedRangeEnd: { type: [string, 'null'], format: date-time }
                        expiresAt: { type: [string, 'null'], format: date-time }
                        deliveredAt: { type: [string, 'null'], format: date-time }
                        acknowledgedAt: { type: [string, 'null'], format: date-time }
                        completedAt: { type: [string, 'null'], format: date-time }
                        returnCode: { type: [integer, 'null'] }
                        resultCommand: { type: [string, 'null'] }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/devices/{deviceId}/commands/read-information:
    post:
      tags: [Attendance]
      operationId: requestAdmsReadInformation
      summary: Queue the documented read-only INFO command for an active device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Durable INFO command queued with TTL }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Device is not active or another command is active }

  /admin/attendance/adms/devices/{deviceId}/transfers/sync-new:
    post:
      tags: [Attendance]
      operationId: requestAdmsSyncNew
      summary: Queue the documented non-destructive LOG command for new transactions
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Durable transfer command queued with TTL }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Device is not active or another command is active }

  /admin/attendance/adms/devices/{deviceId}/transfers/attendance-range:
    post:
      tags: [Attendance]
      operationId: requestAdmsAttendanceRange
      summary: Queue a bounded DATA QUERY ATTLOG historical transaction request
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt, endAt]
              properties:
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time, description: Must be at or after startAt and no more than 31 days later. }
      responses:
        '201': { description: Durable historical transfer command queued with TTL }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Device is not active or another command is active }

  /admin/attendance/adms/commands/{commandId}/cancel:
    post:
      tags: [Attendance]
      operationId: cancelAdmsCommand
      summary: Cancel a command only while it is still pending delivery
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Pending command cancelled and audited }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Command has already been delivered or completed }

  /admin/attendance/adms/transactions:
    get:
      tags: [Attendance]
      operationId: listGlobalAdmsTransactions
      summary: Search attendance transactions across all registered fingerprint devices
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: deviceId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: pin, in: query, required: false, schema: { type: string } }
        - { name: employeeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: mapping, in: query, required: false, schema: { type: string, enum: [all, mapped, unmapped], default: all } }
      responses:
        '200': { description: Cross-device transaction feed with mapping state and employee context }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/devices/{deviceId}/transactions:
    get:
      tags: [Attendance]
      operationId: listAdmsDeviceTransactions
      summary: List recent immutable raw transaction facts with effective explicit PIN mapping when available
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Up to 200 recent raw transactions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, pin, occurredAtRaw, occurredAt, receivedAt, sourceRequestId]
                      properties:
                        id: { type: string, format: uuid }
                        pin: { type: string, description: Leading zeroes are significant. }
                        occurredAtRaw: { type: string }
                        occurredAt: { type: string, format: date-time }
                        receivedAt: { type: string, format: date-time }
                        sourceRequestId: { type: string, format: uuid }
                        employeeId: { type: [string, 'null'], format: uuid }
                        employeeNumber: { type: [string, 'null'] }
                        employeeName: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/devices/{deviceId}/reconciliation:
    get:
      tags: [Attendance]
      operationId: listAdmsRangeReconciliation
      summary: Read persisted coverage for recent bounded ATTLOG range transfers without inventing device counts
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Persisted range coverage; expected and rejected-duplicate counts remain null when the device did not report them
          content:
            application/json:
              schema:
                type: object
                required: [coverageBasis, expectedCount, duplicatesObserved, note, items]
                properties:
                  coverageBasis: { type: string, const: persisted_range }
                  expectedCount: { type: 'null' }
                  duplicatesObserved: { type: 'null' }
                  note: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [commandId, commandNumber, reason, status, requestedRangeStart, requestedRangeEnd, currentPersistedCount, persistedSinceDeliveryCount, attlogRequestCount, createdAt]
                      properties:
                        commandId: { type: string, format: uuid }
                        commandNumber: { type: string }
                        reason: { type: string, enum: [admin_range_recovery, scheduled_reconciliation] }
                        status: { type: string }
                        requestedRangeStart: { type: string, format: date-time }
                        requestedRangeEnd: { type: string, format: date-time }
                        deliveredAt: { type: [string, 'null'], format: date-time }
                        completedAt: { type: [string, 'null'], format: date-time }
                        createdAt: { type: string, format: date-time }
                        currentPersistedCount: { type: integer, minimum: 0 }
                        persistedSinceDeliveryCount: { type: integer, minimum: 0 }
                        firstOccurredAt: { type: [string, 'null'], format: date-time }
                        lastOccurredAt: { type: [string, 'null'], format: date-time }
                        attlogRequestCount: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/logs:
    get:
      tags: [Attendance]
      operationId: getAdmsDeviceLogs
      summary: Read safe operational request, command, quarantine, and Admin audit summaries
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Operational logs with raw ADMS request bodies explicitly excluded
          content:
            application/json:
              schema:
                type: object
                required: [rawRequestBodiesExposed, requests, commandEvents, quarantines, adminAudit]
                properties:
                  rawRequestBodiesExposed: { type: boolean, const: false }
                  requests:
                    type: array
                    items:
                      type: object
                      required: [id, method, path, classification, responseStatus, bodyByteLength, bodyCaptured, receivedAt]
                      properties:
                        id: { type: string, format: uuid }
                        method: { type: string }
                        path: { type: string }
                        classification: { type: string }
                        responseStatus: { type: integer }
                        bodyByteLength: { type: integer, minimum: 0 }
                        bodyCaptured: { type: boolean }
                        safeMetadata: { type: object, additionalProperties: true }
                        receivedAt: { type: string, format: date-time }
                  commandEvents:
                    type: array
                    items:
                      type: object
                      required: [id, commandId, commandNumber, commandType, eventType, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        commandId: { type: string, format: uuid }
                        commandNumber: { type: string }
                        commandType: { type: string, enum: [sync_new, data_query, read_info] }
                        eventType: { type: string, enum: [queued, delivered, acknowledged, succeeded, failed, expired, cancelled] }
                        actorAccountId: { type: [string, 'null'], format: uuid }
                        requestId: { type: [string, 'null'], format: uuid }
                        metadata: { type: object, additionalProperties: true }
                        createdAt: { type: string, format: date-time }
                  quarantines:
                    type: array
                    items:
                      type: object
                      required: [id, requestId, reason, details, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        requestId: { type: string, format: uuid }
                        reason: { type: string }
                        details: { type: object, additionalProperties: true }
                        createdAt: { type: string, format: date-time }
                  adminAudit:
                    type: array
                    items:
                      type: object
                      required: [id, actorAccountId, action, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        actorAccountId: { type: string, format: uuid }
                        action: { type: string }
                        beforeState: { type: [object, 'null'], additionalProperties: true }
                        afterState: { type: [object, 'null'], additionalProperties: true }
                        createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/roster:
    $ref: './attendance-adms-wave2.openapi.yaml#/paths/~1admin~1attendance~1adms~1devices~1%7BdeviceId%7D~1roster'

  /admin/attendance/adms/biometrics:
    $ref: './attendance-adms-wave2.openapi.yaml#/paths/~1admin~1attendance~1adms~1biometrics'

  /admin/attendance/adms/devices/{deviceId}/biometric-inventory:
    $ref: './attendance-adms-wave2.openapi.yaml#/paths/~1admin~1attendance~1adms~1devices~1%7BdeviceId%7D~1biometric-inventory'

  /admin/attendance/adms/devices/{deviceId}/mappings:
    post:
      tags: [Attendance]
      operationId: createAdmsEmployeeMapping
      summary: Map an observed device PIN to an active HCIS employee
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, employeeId]
              properties:
                pin: { type: string, minLength: 1, maxLength: 128, description: Leading zeroes are significant. }
                employeeId: { type: string, format: uuid }
      description: >-
        ADMS-R2c (ATT-014 §20.5): the mapping starts at the employee's TMT (`started_on`, 00:00 WIB), or at
        the end of an earlier mapping of the same PIN on the same device if that is later. The start is not
        a request field; an `effectiveFrom` in the body is ignored.
      responses:
        '201':
          description: Mapping created and eligible raw history re-projected on a bounded basis
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Active or effective-window mapping conflict (ADMS_PIN_ALREADY_MAPPED, ADMS_MAPPING_OVERLAP), inactive employee, or EMPLOYEE_START_DATE_MISSING" }

  /admin/attendance/adms/mappings/align-to-start-date:
    post:
      tags: [Attendance]
      operationId: alignAdmsMappingsToStartDate
      summary: Sesuaikan dengan TMT — dry run or apply moving mapping starts to the employee's TMT (ADMS-R2c)
      description: >-
        Requires attendance.devices.operate. Without `apply` nothing is written. With `apply` (reason
        required) the mappings are locked, the plan is recomputed, every `change` row is updated and audited
        as `mapping_aligned_to_start_date` with the previous start. The legacy daily projection is refreshed
        after the reply; attendance results change only after Kalkulasi runs again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappingIds]
              properties:
                mappingIds: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
                apply: { type: boolean, default: false }
                reason: { type: string, maxLength: 500, description: Required when apply is true. }
      responses:
        '200':
          description: Per-mapping plan (and result when applied)
          content:
            application/json:
              schema:
                type: object
                required: [applied, summary, items]
                properties:
                  applied: { type: boolean }
                  reprojectionQueued: { type: integer, description: Employee-days queued for legacy re-projection (apply only). }
                  summary:
                    type: object
                    properties:
                      mappings: { type: integer }
                      change: { type: integer }
                      unchanged: { type: integer }
                      missingStartDate: { type: integer }
                      invalidRange: { type: integer }
                      overlap: { type: integer }
                      scansAdded: { type: integer }
                      scansRemoved: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        mappingId: { type: string, format: uuid }
                        deviceId: { type: string, format: uuid }
                        deviceName: { type: string }
                        pin: { type: string }
                        employeeId: { type: string, format: uuid }
                        employeeNumber: { type: string }
                        employeeName: { type: string }
                        startedOn: { type: string, format: date, nullable: true }
                        currentFrom: { type: string, format: date-time }
                        targetFrom: { type: string, format: date-time, nullable: true }
                        effectiveTo: { type: string, format: date-time, nullable: true }
                        scansAdded: { type: integer }
                        scansRemoved: { type: integer }
                        status: { type: string, enum: [change, unchanged, missing_start_date, invalid_range, overlap, removes_scans], description: removes_scans (TMT later and scans would lose their owner) is never applied. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/mappings/{mappingId}/revert-alignment:
    post:
      tags: [Attendance]
      operationId: revertAdmsMappingAlignment
      summary: Restore the start a mapping had before its latest TMT alignment (ADMS-R2c recovery)
      parameters:
        - name: mappingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Start restored and audited as mapping_alignment_reverted (references the alignment audit it undoes) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "ADMS_MAPPING_NOT_ALIGNED: the current start is not the result of the latest alignment that is not reverted yet" }

  /admin/attendance/adms/mappings/{mappingId}:
    delete:
      tags: [Attendance]
      operationId: endAdmsEmployeeMapping
      summary: End an active mapping at server current time without deleting history
      parameters:
        - name: mappingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Mapping effective window closed and audited }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/access/role-seat-checks:
    get:
      tags: [Access]
      operationId: listRoleSeatChecks
      summary: Compare role holders with the holders of the seat the role follows (ORG-008-9)
      description: >
        For each role that follows a structural seat (today only human_capital_lead, Kepala HC), compares
        the accounts whose assignment is effective today with the primary and acting holders (Plt) of
        that seat in the structure effective today. Read-only: a position never grants administrative
        permission (AUTH-011), so nothing is granted, revoked or suggested.
      responses:
        '200':
          description: One check per seat-linked role
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoleSeatCheck' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/access/role-seat-links/{roleKey}:
    put:
      tags: [Access]
      operationId: setRoleSeatLink
      summary: Choose or clear the seat a role follows (ORG-008-9, Super Admin only)
      description: >
        Super Admin only, like granting the role; every other actor gets 403 ROLE_GRANT_SUPER_ADMIN_ONLY
        before input is read. The seat must be a position stable key that has appeared in a published
        change set. positionKey null clears it. Audited as role.seat_link.set or role.seat_link.cleared.
      parameters:
        - { name: roleKey, in: path, required: true, schema: { type: string, enum: [human_capital_lead] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionKey, reason]
              properties:
                positionKey: { type: [string, 'null'], format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The check after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleSeatCheck' }
        '400': { description: INVALID_ROLE_SEAT_LINK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: ROLE_GRANT_SUPER_ADMIN_ONLY }
        '404': { description: ORGANIZATION_POSITION_NOT_PUBLISHED }

  /admin/organization/capabilities:
    get:
      tags: [Organization]
      operationId: getOrganizationCapabilities
      summary: Actions this session may perform, so a screen offers no button that ends in 403 (ORG-008-2)
      responses:
        '200':
          description: Per-action eligibility; every endpoint still authorizes its own call
          content:
            application/json:
              schema:
                type: object
                required: [viewStructure, composeChange, discardChange, assignIncumbents, manageAuthority, publish, manageRollout]
                properties:
                  viewStructure: { type: boolean }
                  composeChange: { type: boolean }
                  discardChange: { type: boolean }
                  assignIncumbents: { type: boolean }
                  manageAuthority: { type: boolean }
                  publish: { type: boolean }
                  manageRollout: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/units/{nodeKey}/hc-staff:
    get:
      tags: [Organization]
      operationId: getOrganizationUnitHcStaff
      summary: HC staff whose scope covers this unit or a unit above it (ORG-008-6)
      description: >
        Decision O-9, ATT-011 D-11. Role scopes point at organizational_units, a flat list with no
        parent; the hierarchy lives in the ORG-004 structure. This walks up the structure from the
        unit, collecting each linked imported unit, and returns the HC staff assigned to any of them.
        Read-only: it reports who is already assigned, never who should be. Assignment stays in Akses.


        When nothing up the branch is linked, linkedUnitIds is empty and fallback is true: ATT-011
        keeps its organisation-wide recipients rather than a narrower guess.
      parameters:
        - { name: nodeKey, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: draftId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The linked imported units and the HC staff assigned to them
          content:
            application/json:
              schema:
                type: object
                required: [asOf, nodeKey, linkedUnitIds, fallback, items]
                properties:
                  asOf: { type: string, format: date }
                  nodeKey: { type: string, format: uuid }
                  linkedUnitIds:
                    description: The unit itself first, then upwards; only units that carry a link
                    type: array
                    items: { type: string, format: uuid }
                  fallback:
                    description: True when nothing up the branch is linked
                    type: boolean
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        employeeId: { type: string, format: uuid }
                        fullName: { type: string }
                        roleKey: { type: string }
                        unitId: { type: string, format: uuid }
                        unitName: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No structure for that date, or the unit is not in it }

  /admin/organization/positions/search:
    get:
      tags: [Organization]
      operationId: searchOrganizationPositions
      summary: Find a position by title or unit path, for rules that point at a seat (ORG-008-6)
      description: >
        Decision O-8, ATT-011 D-10. The overtime rule names a position by its stable key, which
        survives a rename and a restructure. The unit path comes back so two seats with the same
        title in different schools can be told apart (gap S-4).
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: draftId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Matching positions effective on that date
          content:
            application/json:
              schema:
                type: object
                required: [asOf, items]
                properties:
                  asOf: { type: string, format: date }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        stableKey: { type: string, format: uuid }
                        title: { type: string }
                        nodeKey: { type: string, format: uuid }
                        unitPath: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/people:
    get:
      tags: [Organization]
      operationId: listOrganizationPeople
      summary: Every active employee with unit, position, direct manager and why (ORG-008-2)
      description: >
        Read-only. Runs the ORG-004 resolver that approvals run, over one snapshot, and writes
        nothing. Employees who are in no unit are included, because they are the ones who would fail
        to submit once structure drives approvals. A resolver failure is reported as that employee's
        issue code; no manager is ever guessed.
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: draftId, in: query, schema: { type: string, format: uuid } }
        - { name: nodeKey, in: query, description: Unit and its sub-units, schema: { type: string, format: uuid } }
        - name: issue
          in: query
          description: ANY, NO_UNIT, UNRESOLVED_MANAGER, DIFFERENT_FROM_LEGACY, or a resolver code
          schema: { type: string }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - name: withLegacy
          in: query
          description: Include the ORG-002 manager and unit approver side by side for comparison
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: One page of employees
          content:
            application/json:
              schema:
                type: object
                required: [asOf, page, pageSize, total, items]
                properties:
                  asOf: { type: string, format: date }
                  changeSetId: { type: [string, 'null'], format: uuid }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationPerson' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Change set not found }

  /admin/organization/readiness:
    get:
      tags: [Organization]
      operationId: getOrganizationReadiness
      summary: What is not ready yet, counted from the same rows as /people (ORG-008-2)
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: draftId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Readiness counts, including employees in no unit and acting seats ending soon
          content:
            application/json:
              schema:
                type: object
                required: [asOf, activeEmployees, withoutUnit, unresolvedManager, vacantRequiringActing, actingEndingSoon]
                properties:
                  asOf: { type: string, format: date }
                  changeSetId: { type: [string, 'null'], format: uuid }
                  activeEmployees: { type: integer }
                  withoutUnit: { type: integer }
                  withoutWorkLocation:
                    description: ORG-005-1. Placed employees whose unit branch names no work location; informational only.
                    type: integer
                  unresolvedManager: { type: integer }
                  ineligibleManagers: { type: integer }
                  vacantRequiringActing: { type: integer }
                  actingEndingSoon:
                    type: array
                    items:
                      type: object
                      properties:
                        positionKey: { type: string, format: uuid }
                        positionTitle: { type: string }
                        employeeId: { type: [string, 'null'], format: uuid }
                        endsOn: { type: string, format: date }
                  comparison:
                    description: Counts against the ORG-002 manager data; read-only, and never a rollout change
                    oneOf:
                      - type: object
                        properties:
                          same: { type: integer }
                          different: { type: integer }
                          unresolved: { type: integer }
                          noLegacy: { type: integer }
                      - type: 'null'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Change set not found }

  /admin/organization/explanation:
    get:
      tags: [Organization]
      operationId: getOrganizationExplanation
      summary: The steps behind one employee's answer, as codes and parameters (ORG-008-2)
      description: >
        Returns structured steps, never finished prose: the operator sentences are composed in the
        web app, where the ORG-008 vocabulary lives.
      parameters:
        - { name: employeeId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: draftId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Explanation steps plus the employee row they were derived from
          content:
            application/json:
              schema:
                type: object
                required: [asOf, employeeId, person, steps]
                properties:
                  asOf: { type: string, format: date }
                  employeeId: { type: string, format: uuid }
                  person: { $ref: '#/components/schemas/OrganizationPerson' }
                  steps:
                    type: array
                    items:
                      type: object
                      required: [code, params]
                      properties:
                        code: { type: string }
                        params: { type: object, additionalProperties: { type: [string, 'null'] } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Change set or employee not found }

  /admin/organization/resolution-preview:
    post:
      tags: [Organization]
      operationId: previewOrganizationResolution
      summary: Who approves this employee's leave or overtime, without creating a change set (ORG-008-2)
      description: >
        Uses the same resolver as approvals; there is no second resolver. The overtime approver
        capability is set by ATT-011-6b and is not decided yet, so overtime is returned with
        preview = true and an OVERTIME_CAPABILITY_PENDING warning. Replaces the draft-scoped
        /drafts/{draftId}/resolution-preview, which stays as an alias for one release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId]
              properties:
                employeeId: { type: string, format: uuid }
                workflow: { type: string, enum: [LEAVE_ANNUAL, LEAVE_UNPAID, OVERTIME], default: LEAVE_ANNUAL }
                date: { type: string, format: date }
                draftId:
                  description: Resolve against a change set being composed instead of effective structure
                  type: string
                  format: uuid
      responses:
        '200':
          description: The approval steps, who is told afterwards, and any warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResolutionPreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No structure is effective for that date, or the change set is unknown }
        '409':
          description: >
            The resolver failed closed; the body carries its code so the screen can name the cause
            and offer the fix instead of showing an error.

  /admin/organization/designer:
    get:
      tags: [Organization]
      operationId: getOrganizationDesigner
      parameters:
        - name: effectiveDate
          in: query
          schema: { type: string, format: date }
        - name: draftId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Effective published chart or editable draft chart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDesignerView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/employees:
    get:
      tags: [Organization]
      operationId: listOrganizationDesignerEmployees
      description: >
        ORG-008-2 adds q, status and limit. The default stays every employee, so a seat already held
        by someone no longer active can still show that person's name; the new screens ask for
        status=active.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, all], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        '200': { description: Employee options for membership and incumbency }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts:
    post:
      tags: [Organization]
      operationId: createOrganizationDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, effectiveOn]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                effectiveOn: { type: string, format: date }
      responses:
        '201':
          description: Draft created from the latest effective published snapshot, or empty when none exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            ORGANIZATION_DRAFT_ALREADY_OPEN (ORG-008-3b, decision O-7). One change set is composed at
            a time for the whole foundation; details name the open one so it can be continued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraftConflict' }
    get:
      tags: [Organization]
      operationId: listOrganizationDrafts
      summary: List organization change sets, newest effective date first (ORG-008-3b)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, VALIDATED, PUBLISHED, DISCARDED] }
      responses:
        '200':
          description: Change sets, optionally filtered by status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationDraft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/reopen:
    post:
      tags: [Organization]
      operationId: reopenOrganizationDraft
      summary: Return a validated change set to composing, clearing its validation report (ORG-008-3b)
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Change set is being composed again and must be validated before publishing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraft' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Change set not found }
        '409': { description: ORGANIZATION_DRAFT_NOT_REOPENABLE when the change set is not validated }

  /admin/organization/designer/drafts/{draftId}/discard:
    post:
      tags: [Organization]
      operationId: discardOrganizationDraft
      summary: Discard a change set that was never published, keeping its rows and audit (ORG-008-3b)
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: >
            Change set is DISCARDED. Its rows and audit trail stay, and it can never become effective
            structure because only PUBLISHED change sets are loaded as effective.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Change set not found }
        '409': { description: ORGANIZATION_DRAFT_NOT_DISCARDABLE when the change set was published }

  /admin/organization/designer/drafts/{draftId}/nodes:
    post:
      tags: [Organization]
      operationId: createOrganizationNode
      parameters: [{ $ref: '#/components/parameters/DraftId' }, { $ref: '#/components/parameters/DraftRevisionIfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationNodeInput' }
      responses:
        '201': { description: Organizational group created in the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable, or ORGANIZATION_DRAFT_CHANGED when If-Match no longer matches }

  /admin/organization/designer/drafts/{draftId}/nodes/{itemId}:
    delete:
      tags: [Organization]
      operationId: deleteOrganizationNode
      summary: Remove a unit that exists only inside this change set (ORG-008-4b)
      description: >
        Only for a stable key that has never been published: published structure is history
        and is deactivated instead. Refused while anything still points at it.
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/DraftRevisionIfMatch' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed from the change set }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not part of this change set }
        '409':
          description: >
            ORGANIZATION_ITEM_PUBLISHED when the item has been published, so it can only be
            deactivated or ended; ORGANIZATION_ITEM_IN_USE when something still points at it, with
            the list in details.uses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationItemInUse' }
    patch:
      tags: [Organization]
      operationId: updateOrganizationNode
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/DraftRevisionIfMatch' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationNodePatch' }
      responses:
        '200': { description: Organizational group updated within the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable, or ORGANIZATION_DRAFT_CHANGED when If-Match no longer matches }

  /admin/organization/designer/drafts/{draftId}/positions:
    post:
      tags: [Organization]
      operationId: createOrganizationPosition
      parameters: [{ $ref: '#/components/parameters/DraftId' }, { $ref: '#/components/parameters/DraftRevisionIfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationPositionInput' }
      responses:
        '201': { description: Authority-bearing position created in the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable, or ORGANIZATION_DRAFT_CHANGED when If-Match no longer matches }

  /admin/organization/designer/drafts/{draftId}/positions/{itemId}:
    delete:
      tags: [Organization]
      operationId: deleteOrganizationPosition
      summary: Remove a position that exists only inside this change set (ORG-008-4b)
      description: >
        Only for a stable key that has never been published: published structure is history
        and is deactivated instead. Refused while anything still points at it.
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/DraftRevisionIfMatch' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed from the change set }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not part of this change set }
        '409':
          description: >
            ORGANIZATION_ITEM_PUBLISHED when the item has been published, so it can only be
            deactivated or ended; ORGANIZATION_ITEM_IN_USE when something still points at it, with
            the list in details.uses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationItemInUse' }
    patch:
      tags: [Organization]
      operationId: updateOrganizationPosition
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/DraftRevisionIfMatch' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationPositionPatch' }
      responses:
        '200': { description: Structural position updated within the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable, or ORGANIZATION_DRAFT_CHANGED when If-Match no longer matches }

  /admin/organization/designer/drafts/{draftId}/memberships:
    put:
      tags: [Organization]
      operationId: replaceOrganizationMemberships
      parameters: [{ $ref: '#/components/parameters/DraftId' }, { $ref: '#/components/parameters/DraftRevisionIfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeKey, employeeIds, effectiveFrom]
              properties:
                nodeKey: { type: string, format: uuid }
                employeeIds: { type: array, maxItems: 500, items: { type: string, format: uuid } }
                effectiveFrom: { type: string, format: date }
                effectiveTo: { type: [string, 'null'], format: date }
      responses:
        '204': { description: Effective memberships replaced for the selected group }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/incumbencies:
    put:
      tags: [Organization]
      operationId: replaceOrganizationIncumbencies
      description: >
        Needs organization.manage (ORG-008-8, decision O-1). This composes inside an unpublished change
        set; nothing takes effect until publish, which needs approvals.policy.manage.
      parameters: [{ $ref: '#/components/parameters/DraftId' }, { $ref: '#/components/parameters/DraftRevisionIfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionKey, effectiveFrom]
              properties:
                positionKey: { type: string, format: uuid }
                primaryEmployeeId: { type: [string, 'null'], format: uuid }
                actingEmployeeId: { type: [string, 'null'], format: uuid }
                actingFrom: { type: [string, 'null'], format: date }
                actingTo: { type: [string, 'null'], format: date }
                effectiveFrom: { type: string, format: date }
      responses:
        '204': { description: Primary, vacant, and explicit acting state replaced }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/authority-bindings:
    post:
      tags: [Organization]
      operationId: createOrganizationAuthorityBinding
      description: >
        Needs organization.manage (ORG-008-8, decision O-1). This composes inside an unpublished change
        set; nothing takes effect until publish, which needs approvals.policy.manage.
      parameters: [{ $ref: '#/components/parameters/DraftId' }, { $ref: '#/components/parameters/DraftRevisionIfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationAuthorityBindingInput' }
      responses:
        '201': { description: Semantic authority relationship created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/authority-bindings/{itemId}:
    delete:
      tags: [Organization]
      operationId: deleteOrganizationAuthorityBinding
      summary: Remove an authority created inside this change set (ORG-008-4b, gap W-1)
      description: >
        The authority dialog can only add today, so one wrong leader makes a change set permanently
        unvalidatable and the only way out is to discard it. A binding created inside this change set
        can go; one that came from published structure is ended instead, with PATCH.
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/DraftRevisionIfMatch' }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed from the change set }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not part of this change set }
        '409':
          description: ORGANIZATION_ITEM_PUBLISHED, with details.endInstead, when it came from published structure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationItemInUse' }
    patch:
      tags: [Organization]
      operationId: endOrganizationAuthorityBinding
      summary: End an authority from a given date, keeping the record (ORG-008-4b)
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/DraftRevisionIfMatch' }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveTo]
              properties:
                effectiveTo: { type: string, format: date }
      responses:
        '200':
          description: The authority now ends on that date
        '400': { description: ORGANIZATION_BINDING_PERIOD_INVALID when it would end before it began }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not part of this change set }

  /admin/organization/designer/drafts/{draftId}/reporting-overrides:
    post:
      tags: [Organization]
      operationId: createOrganizationReportingOverride
      description: >
        Needs organization.manage (ORG-008-8, decision O-1). This composes inside an unpublished change
        set; nothing takes effect until publish, which needs approvals.policy.manage.
      parameters: [{ $ref: '#/components/parameters/DraftId' }, { $ref: '#/components/parameters/DraftRevisionIfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, managerPositionKey, reason, effectiveFrom]
              properties:
                employeeId: { type: string, format: uuid }
                managerPositionKey: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
                effectiveFrom: { type: string, format: date }
                effectiveTo: { type: [string, 'null'], format: date }
      responses:
        '201': { description: Reasoned effective reporting exception created }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/commands:
    post:
      tags: [Organization]
      operationId: applyOrganizationCommand
      summary: Apply one operator action to a change set as one atomic command (ORG-008-4a)
      description: >
        Registering a unit with its head is five dialogs today, and forgetting one of them is
        invisible until an approval fails. A command does the whole thing or none of it. The model is
        unchanged: a node, a position, an incumbency and each authority binding are still stored and
        audited as separate records, and each gets its own audit event plus one
        organization.command.applied summary event in the same transaction.


        Permission (ORG-008-8, decision O-1): organization.manage, for every command. Composing inside
        an unpublished change set takes effect nowhere; publishing it needs approvals.policy.manage.
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/DraftRevisionIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCommand' }
      responses:
        '201':
          description: The command was applied whole
          content:
            application/json:
              schema:
                type: object
                required: [commandType, seq, primitives]
                properties:
                  commandType: { type: string }
                  seq: { type: integer, description: Position in the change journal }
                  primitives: { type: integer, description: How many records the command wrote }
                  summary: { type: object }
        '400':
          description: >
            The command cannot be meant: an unknown shape, an acting appointment with no reason or a
            period that ends before it starts, a reporting exception with no reason, or a position
            that would report to itself.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Change set not found }
        '409':
          description: >
            ORGANIZATION_MEMBERSHIP_CONFLICT when an employee is already a primary member of another
            unit and the move has not been confirmed; the body names them. Also the draft-not-editable
            and ORGANIZATION_DRAFT_CHANGED refusals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object }

  /admin/organization/designer/drafts/from-legacy:
    post:
      tags: [Organization]
      operationId: seedOrganizationDraftFromLegacy
      summary: Build a first change set from the data HCIS already records (ORG-008-7, decision O-3)
      description: >
        Reads organizational_units, employees.organizational_unit_id, the ORG-002 unit leave
        approver, and employees.direct_manager_employee_id. Nothing is inferred from a job title
        (invariant I-7): the only titles it creates are derived from the unit's own name and are
        marked as proposals. A unit where everyone shares one manager gets that manager as its
        leader; anything else stays a per-employee exception pointing at the person, exactly as
        ORG-002 records it. The result is a change set to review; nothing is published and rollout
        is not touched.


        Offered only when no structure is effective on that date and no other change is open.
        Merging a proposal into an existing structure would mean inventing rules about what to keep.


        Needs organization.manage (ORG-008-8, decision O-1): it only composes a change set, and
        publishing that change set still needs approvals.policy.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, effectiveOn]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                effectiveOn: { type: string, format: date }
      responses:
        '201':
          description: The change set, with counts of what was proposed
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/OrganizationDraft' }
                  - type: object
                    properties:
                      proposal: { type: boolean }
                      summary:
                        type: object
                        properties:
                          units: { type: integer }
                          placements: { type: integer }
                          unitApprovers: { type: integer }
                          unitLeaders: { type: integer }
                          reportingExceptions: { type: integer }
                          employeesWithoutUnit: { type: integer }
                          employeesWithoutManager: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            ORGANIZATION_DRAFT_ALREADY_OPEN when another change is open (decision O-7), or
            ORGANIZATION_STRUCTURE_EXISTS when a structure is already effective on that date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraftConflict' }

  /admin/organization/designer/drafts/{draftId}/rebase:
    post:
      tags: [Organization]
      operationId: rebaseOrganizationDraft
      summary: Rebuild a change set on the newest published structure (ORG-008-4c)
      description: >
        Replays the change journal onto the structure effective on the change set's own date, which
        is what the stale-base guard asks for before publishing (gap D-2). It previews by default:
        only apply=true writes. A line that no longer fits the newer structure is reported in
        `skipped` and dropped from the journal, never resolved on the operator's behalf, so they can
        see what was lost and redo it. A line replay cannot reproduce at all (a MANUAL_EDIT made
        through a single-record endpoint, or SEED_FROM_LEGACY) is listed in `blocked`, and apply is
        refused with 409 ORGANIZATION_DRAFT_NOT_REPLAYABLE while any remains, so a rebuild never
        drops such an edit silently.
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/DraftRevisionIfMatch' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply: { type: boolean, default: false }
      responses:
        '200':
          description: The result of the replay, applied or previewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationReplayReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Change set not found }
        '409': { description: ORGANIZATION_DRAFT_NOT_EDITABLE, or on apply ORGANIZATION_DRAFT_CHANGED or ORGANIZATION_DRAFT_NOT_REPLAYABLE (details.blocked) }

  /admin/organization/designer/drafts/{draftId}/journal/{seq}/undo:
    post:
      tags: [Organization]
      operationId: undoOrganizationJournalEntry
      summary: Undo one line of the change list (ORG-008-4c)
      description: >
        Rebuilds the change set from its base with that line left out. Lines that depended on it are
        reported in `skipped` rather than silently dropped. Previews by default, like rebase. Other
        lines replay cannot reproduce are listed in `blocked` and refuse apply with
        409 ORGANIZATION_DRAFT_NOT_REPLAYABLE; undoing a MANUAL_EDIT line itself is allowed.
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/DraftRevisionIfMatch' }
        - { name: seq, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply: { type: boolean, default: false }
      responses:
        '200':
          description: The result of the replay, applied or previewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationReplayReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Change set or journal line not found }
        '409': { description: ORGANIZATION_DRAFT_NOT_EDITABLE, or on apply ORGANIZATION_DRAFT_CHANGED or ORGANIZATION_DRAFT_NOT_REPLAYABLE (details.blocked) }

  /admin/organization/designer/drafts/{draftId}/journal:
    get:
      tags: [Organization]
      operationId: listOrganizationChangeJournal
      summary: What was changed in this change set, in the operator's order (ORG-008-4a)
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: >
            Applied commands, oldest first. Besides the command types, a line may be SEED_FROM_LEGACY
            or MANUAL_EDIT: an edit made through a single-record endpoint, whose summary.action names
            it (node.created, node.updated, node.deleted, position.created, position.updated,
            position.deleted, memberships.replaced, incumbencies.replaced, authority_binding.created,
            authority_binding.deleted, authority_binding.ended, reporting_override.created).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        seq: { type: integer }
                        commandType: { type: string }
                        summary: { type: object }
                        actorAccountId: { type: string, format: uuid }
                        createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Change set not found }

  /admin/organization/designer/drafts/{draftId}/validate:
    post:
      tags: [Organization]
      operationId: validateOrganizationDraft
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Structural, authority, effective-date, and incumbent validation report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationValidationReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/impact:
    get:
      tags: [Organization]
      operationId: previewOrganizationImpact
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Authority-routing and visual-only impact preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationImpactPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/resolution-preview:
    post:
      tags: [Organization]
      operationId: previewOrganizationResolution
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, workflowKey, effectiveDate]
              properties:
                employeeId: { type: string, format: uuid }
                workflowKey: { type: string }
                effectiveDate: { type: string, format: date }
      responses:
        '200': { description: Concrete structural authority preview }
        '409': { description: Fail-closed structural configuration error }

  /admin/organization/designer/drafts/{draftId}/publish:
    post:
      tags: [Organization]
      operationId: publishOrganizationDraft
      description: >
        Needs approvals.policy.manage, held by the Kepala HC role (ORG-008-8, decision O-1). Composing
        a change set needs only organization.manage; publishing is the separate second pair of eyes,
        because hierarchy decides approval routing once it takes effect.
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Validated snapshot published; a future snapshot does not activate early
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            ORGANIZATION_DRAFT_NOT_VALIDATED when the draft has not passed validation, or
            ORGANIZATION_DRAFT_BASE_STALE (ORG-008-3a) when another change set was published after
            this draft cloned its base and takes effect on or before this draft's effective date.
            Publishing is refused because the draft's snapshot does not contain that publication and
            would replace it. Published snapshots are not modified by the refusal.
            ORGANIZATION_PUBLISH_REQUIRES_SECOND_PERSON (ORG-008-10, DRAFT default) when the caller
            created the change set or appears in its organization audit trail other than for checking,
            reopening or publishing; Super Admin is exempt as the audited break-glass account.
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [ORGANIZATION_DRAFT_NOT_VALIDATED, ORGANIZATION_DRAFT_BASE_STALE] }
                  message: { type: string }
                  details: { $ref: '#/components/schemas/OrganizationStaleBase' }

  /admin/organization/rollout:
    get:
      description: >
        ORG-008-2 adds asOf, configuredRowCount and settings: the rows effective today per
        workflow and unit. The newest row alone cannot say which mode applies, because the
        resolver picks per workflow and unit. configuredRowCount = 0 is the one case a screen
        may state LEGACY as a fact. The existing top-level fields are unchanged.
      tags: [Organization]
      operationId: getOrganizationRollout
      responses:
        '200': { description: Latest rollout configuration; LEGACY when none exists }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Organization]
      operationId: updateOrganizationRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [LEGACY, SHADOW, STRUCTURE] }
                workflowKey: { type: string, default: LEAVE }
                organizationalNodeKey: { type: [string, 'null'], format: uuid }
                effectiveFrom: { type: string, format: date }
                effectiveTo: { type: [string, 'null'], format: date }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Additive effective rollout configuration created and audited }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

