openapi: 3.1.0
info:
  title: HCIS Payslip API
  version: 0.0.1
  description: PAYSLIP-001 through PAYSLIP-004 import, resolution, publish, print metadata, and employee self-read contracts.
tags:
  - name: Payslips

paths:
  /admin/payslip-imports:
    get:
      tags: [Payslips]
      operationId: listPayslipImports
      summary: List payslip import batches
      responses:
        '200':
          description: Authorized import batch history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PayslipImportBatch' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payslip-imports/preview:
    post:
      tags: [Payslips]
      operationId: previewPayslipImport
      summary: Preview canonical or legacy-compatible payslip CSV
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema: { type: string }
        - name: X-Payslip-Period
          in: header
          required: false
          description: Optional fallback YYYY-MM for legacy-compatible rows without TANGGAL.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Persisted preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayslipImportPreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payslip-imports/{batchId}:
    get:
      tags: [Payslips]
      operationId: getPayslipImport
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch and row review detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayslipImportDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payslip-imports/{batchId}/rows:
    patch:
      tags: [Payslips]
      operationId: bulkCorrectPayslipImportRows
      summary: Correct up to 500 pending import rows in one transaction
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [rowNumber, employeeNumber, period]
                    properties:
                      rowNumber: { type: integer, minimum: 1 }
                      employeeNumber: { type: string, minLength: 1 }
                      period:
                        type: string
                        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Rows updated and revalidated
          content:
            application/json:
              schema:
                type: object
                required: [updatedCount, rows]
                properties:
                  updatedCount: { type: integer, minimum: 1 }
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/PayslipImportRow' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Batch or one of the selected rows is not editable

  /admin/payslip-imports/{batchId}/rows/exclude:
    post:
      tags: [Payslips]
      operationId: bulkExcludePayslipImportRows
      summary: Soft-exclude up to 500 pending rows in one transaction
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rowNumbers]
              properties:
                rowNumbers:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Selected pending rows explicitly excluded
          content:
            application/json:
              schema:
                type: object
                required: [excludedCount]
                properties:
                  excludedCount: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Batch or one of the selected rows is not excludable

  /admin/payslip-imports/{batchId}/rows/{rowNumber}:
    patch:
      tags: [Payslips]
      operationId: correctPayslipImportRow
      summary: Correct employee reference and period for a pending import row
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/RowNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeNumber, period]
              properties:
                employeeNumber: { type: string, minLength: 1 }
                period:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Row corrected and revalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayslipImportRow' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Row or batch state is not editable
    delete:
      tags: [Payslips]
      operationId: excludePayslipImportRow
      summary: Soft-exclude a pending row from this batch
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/RowNumber'
      responses:
        '200':
          description: Row explicitly excluded and audit trail retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayslipImportRow' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Row or batch state is not excludable

  /admin/payslip-imports/{batchId}/commit:
    post:
      tags: [Payslips]
      operationId: commitPayslipImport
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Pending-valid rows are committed as employee-invisible drafts; invalid rows remain pending
          content:
            application/json:
              schema:
                type: object
                required: [batchId, status, draftedNow, draftedCount, pendingValidCount, unresolvedCount, excludedCount]
                properties:
                  batchId: { type: string, format: uuid }
                  status: { type: string, const: committed }
                  draftedNow: { type: integer, minimum: 1 }
                  draftedCount: { type: integer, minimum: 1 }
                  pendingValidCount: { type: integer, minimum: 0 }
                  unresolvedCount: { type: integer, minimum: 0 }
                  excludedCount: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Batch state or no valid pending row is ready for draft

  /admin/payslip-imports/{batchId}/publish:
    post:
      tags: [Payslips]
      operationId: publishPayslipImport
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch published and employee notifications created
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Batch is not committed, still has pending rows, or has no draft payslips

  /payslips:
    get:
      tags: [Payslips]
      operationId: listMyPayslips
      responses:
        '200':
          description: Published payslips owned by current active employee
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PayslipSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payslips/{id}:
    get:
      tags: [Payslips]
      operationId: getMyPayslip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Published payslip owned by current employee, including resolved print signer metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayslipDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RowNumber:
      name: rowNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthenticated:
      description: Authentication required
    Forbidden:
      description: Actor lacks the required effective organization permission
    NotFound:
      description: Resource not found or intentionally concealed
    ValidationError:
      description: Import shape or row correction is invalid

  schemas:
    PayslipSourceFormat:
      type: string
      enum: [generic, tetap, honorer]

    PayslipLine:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value:
          type: string
          description: Opaque imported display value. HCIS does not parse or calculate it.
        section:
          type: string
          enum: [identity, income, deduction, summary, other]

    PayslipImportBatch:
      type: object
      required:
        - id
        - sourceFilename
        - sourceFormat
        - status
        - rowCount
        - validCount
        - errorCount
        - draftedCount
        - pendingValidCount
        - unresolvedCount
        - excludedCount
        - createdAt
      properties:
        id: { type: string, format: uuid }
        sourceFilename: { type: string }
        sourceFormat: { $ref: '#/components/schemas/PayslipSourceFormat' }
        status: { type: string, enum: [previewed, committed, published] }
        rowCount: { type: integer, minimum: 0 }
        validCount: { type: integer, minimum: 0 }
        errorCount: { type: integer, minimum: 0 }
        draftedCount: { type: integer, minimum: 0 }
        pendingValidCount: { type: integer, minimum: 0 }
        unresolvedCount: { type: integer, minimum: 0 }
        excludedCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        committedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }

    PayslipImportRow:
      type: object
      required: [rowNumber, employeeNumber, errors, resolutionStatus]
      properties:
        rowNumber: { type: integer, minimum: 1 }
        employeeNumber: { type: string }
        period:
          type: [string, 'null']
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        lines:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/PayslipLine' }
            - type: 'null'
        errors:
          type: array
          items: { type: string }
        resolutionStatus:
          type: string
          enum: [pending, drafted, excluded]
        draftPayslipId:
          type: [string, 'null']
          format: uuid
        excludedAt:
          type: [string, 'null']
          format: date-time

    PayslipImportPreview:
      allOf:
        - $ref: '#/components/schemas/PayslipImportBatch'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/PayslipImportRow' }

    PayslipImportDetail:
      allOf:
        - $ref: '#/components/schemas/PayslipImportBatch'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/PayslipImportRow' }

    PayslipSummary:
      type: object
      required: [id, period, sourceFormat, publishedAt]
      properties:
        id: { type: string, format: uuid }
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        sourceFormat: { $ref: '#/components/schemas/PayslipSourceFormat' }
        publishedAt: { type: string, format: date-time }

    PayslipDetail:
      allOf:
        - $ref: '#/components/schemas/PayslipSummary'
        - type: object
          required: [lines, signer]
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/PayslipLine' }
            signer:
              type: object
              required: [title, name]
              properties:
                title:
                  type: string
                  enum:
                    - Kepala Human Capital Management
                    - Direktur
                name:
                  type: [string, 'null']
