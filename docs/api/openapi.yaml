                        status: { type: string }
                        requestedRangeStart: { type: string, format: date-time }
                        requestedRangeEnd: { type: string, format: date-time }
                        deliveredAt: { type: [string, 'null'], format: date-time }
                        completedAt: { type: [string, 'null'], format: date-time }
                        createdAt: { type: string, format: date-time }
                        currentPersistedCount: { type: integer, minimum: 0 }
                        persistedSinceDeliveryCount: { type: integer, minimum: 0 }
                        firstOccurredAt: { type: [string, 'null'], format: date-time }
                        lastOccurredAt: { type: [string, 'null'], format: date-time }
                        attlogRequestCount: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

