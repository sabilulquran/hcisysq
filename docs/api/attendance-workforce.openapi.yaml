openapi: 3.1.0
info:
  title: HCIS Attendance Workforce API Fragment
  version: 0.0.1
paths:
  /attendance/me/workforce:
    get:
      tags: [Attendance]
      operationId: getMyAttendanceWorkforce
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Own resolved schedule, current result, clarifications, and mobile evidence summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceWorkforceSnapshot' }
        '401': { description: Authentication required }
        '403': { description: Active employee required }

  /attendance/me/schedule:
    get:
      tags: [Attendance]
      operationId: getMyAttendanceSchedule
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Own schedule and current results for up to 31 days }

  /attendance/mobile/clock:
    post:
      tags: [Attendance]
      operationId: createMobileAttendanceEvidence
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, latitude, longitude, accuracyMeters, photoBase64]
              properties:
                action: { type: string, enum: [check_in, check_out] }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracyMeters: { type: number, minimum: 0, maximum: 100000 }
                photoBase64:
                  type: string
                  description: Base64-encoded JPEG captured by the shipped camera UI; server validates JPEG signature and size.
      responses:
        '201':
          description: Mobile evidence persisted; outside/uncertain geofence evidence is retained with needs_review.
        '200':
          description: Existing evidence returned for duplicate idempotency key.
        '409':
          description: Mobile attendance disabled or restricted-media keyring not ready.

  /attendance/mobile/evidence/{evidenceId}/photo:
    get:
      tags: [Attendance]
      operationId: getOwnMobileAttendancePhoto
      parameters:
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Decrypted own attendance JPEG; no-store and audited
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
        '404': { description: Evidence not found or not owned by current employee }

  /attendance/clarifications:
    post:
      tags: [Attendance]
      operationId: submitAttendanceClarification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceClarificationInput' }
      description: >-
        For mode `correction`, proposed times must belong to `workDate` (same rule as
        POST /admin/attendance/manual-corrections); checked before any write.
      responses:
        '201': { description: Clarification submitted }
        '400': { description: INVALID_CLARIFICATION }
        '422': { description: CHECK_IN_OUTSIDE_WORK_DATE, CHECK_OUT_OUTSIDE_WORK_DATE, or CHECK_OUT_BEFORE_CHECK_IN }

  /attendance/clarifications/me:
    get:
      tags: [Attendance]
      operationId: listMyAttendanceClarifications
      responses:
        '200': { description: Own attendance clarification history }

  /attendance/clarifications/{clarificationId}/cancel:
    post:
      tags: [Attendance]
      operationId: cancelMyAttendanceClarification
      parameters:
        - { name: clarificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Submitted clarification cancelled }
        '409': { description: Clarification is no longer cancellable }

  /admin/attendance/clarifications:
    get:
      tags: [Attendance]
      operationId: listAttendanceClarificationsForHc
      x-required-permission: attendance.clarification.manage
      description: >-
        ATT-011-3R Perbaikan Absen. Employee requests and HC corrections in one paginated list, newest
        work date first. Readable with attendance.clarification.manage **or** attendance.records.manage;
        deciding and entering corrections keep their own permission. `origin` is `employee` or `hc`
        (an HC correction's submitted event carries administrativeCorrection). `submittedCount` counts
        all open requests regardless of the filter.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [all, submitted, approved, rejected, cancelled], default: submitted } }
        - { name: origin, in: query, required: false, schema: { type: string, enum: [all, employee, hc], default: all } }
        - { name: mode, in: query, required: false, schema: { type: string, enum: [all, correction, justification], default: all } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 10, maximum: 200, default: 50 } }
      responses:
        '200': { description: '`{ page, pageSize, total, totalPages, submittedCount, items }`; each item adds `origin` and `decidedByEmail`.' }
        '400': { description: INVALID_CLARIFICATION_FILTER }
        '403': { description: Neither attendance.clarification.manage nor attendance.records.manage }

  /admin/attendance/clarifications/{clarificationId}/decision:
    post:
      tags: [Attendance]
      operationId: decideAttendanceClarification
      x-required-permission: attendance.clarification.manage
      parameters:
        - { name: clarificationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: [string, 'null'], maxLength: 2000 }
      description: >-
        Approving a correction whose proposed times do not belong to its work date (submitted before
        the work-date check existed) is refused with 422; such a request can only be rejected.
      responses:
        '200': { description: Decision stored and result recomputed }
        '409': { description: CLARIFICATION_ALREADY_DECIDED }
        '422': { description: CHECK_IN_OUTSIDE_WORK_DATE, CHECK_OUT_OUTSIDE_WORK_DATE, or CHECK_OUT_BEFORE_CHECK_IN }

  /admin/attendance/work-locations:
    get:
      tags: [Attendance]
      operationId: listAttendanceWorkLocations
      x-required-permission: attendance.schedule.manage
      responses:
        '200': { description: Work locations and geofence radius }
    post:
      tags: [Attendance]
      operationId: createAttendanceWorkLocation
      x-required-permission: attendance.schedule.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceWorkLocationInput' }
      responses:
        '201': { description: Work location created }

  /admin/attendance/schedules:
    get:
      tags: [Attendance]
      operationId: listAttendanceSchedules
      x-required-permission: attendance.schedule.manage
      responses:
        '200': { description: Schedule templates }
    post:
      tags: [Attendance]
      operationId: createAttendanceSchedule
      x-required-permission: attendance.schedule.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceScheduleInput' }
      responses:
        '201': { description: Schedule template created }
        '422': { description: SCHEDULE_EFFECTIVE_FROM_IN_FUTURE }

  /admin/attendance/schedules/{scheduleId}/backdate:
    post:
      tags: [Attendance]
      operationId: backdateAttendanceSchedule
      x-required-permission: attendance.schedule.manage
      description: >-
        ATT-014 §20.10 "Mundurkan awal berlaku". Moves the start of the shift's first version to an
        earlier date (00:00 WIB), so schedule patterns on earlier dates resolve to this shift. Only
        earlier, never in the future; audited as `attendance.schedule.backdated` with the previous start
        and the reason. Results already calculated change only when Kalkulasi runs again.
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveFrom, reason]
              properties:
                effectiveFrom: { type: string, format: date }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: '`{ id, versionId, effectiveFrom }`' }
        '400': { description: INVALID_SCHEDULE_BACKDATE }
        '403': { description: Missing attendance.schedule.manage }
        '404': { description: SCHEDULE_NOT_FOUND }
        '409': { description: SCHEDULE_BACKDATE_NOT_EARLIER }

  /admin/attendance/schedule-assignments:
    get:
      tags: [Attendance]
      operationId: listAttendanceScheduleAssignments
      x-required-permission: attendance.schedule.manage
      responses:
        '200': { description: Effective-dated schedule assignments with employee and schedule labels }
    post:
      tags: [Attendance]
      operationId: createAttendanceScheduleAssignment
      x-required-permission: attendance.schedule.manage
      responses:
        '201': { description: Effective-dated employee schedule assignment created }

  /admin/attendance/rosters:
    get:
      tags: [Attendance]
      operationId: getAttendanceRosterWeek
      x-required-permission: attendance.schedule.manage
      parameters:
        - { name: weekStart, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Roster versions, entries, active employees, and schedule templates for the week }
    post:
      tags: [Attendance]
      operationId: createAttendanceRosterDraft
      x-required-permission: attendance.schedule.manage
      responses:
        '201': { description: Weekly DRAFT roster created }

  /admin/attendance/rosters/{rosterId}/entries:
    put:
      tags: [Attendance]
      operationId: replaceAttendanceRosterEntries
      x-required-permission: attendance.schedule.manage
      parameters:
        - { name: rosterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Draft roster entries upserted }
        '409': { description: Roster is not DRAFT }

  /admin/attendance/rosters/{rosterId}/publish:
    post:
      tags: [Attendance]
      operationId: publishAttendanceRoster
      x-required-permission: attendance.schedule.manage
      parameters:
        - { name: rosterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Immutable published roster version activated for resolution }

  /admin/attendance/finalize/{date}:
    post:
      tags: [Attendance]
      operationId: finalizeAttendanceDate
      x-required-permission: attendance.calculation.run
      deprecated: true
      description: >-
        ATT-014-2 alias kept for one release. Queues a Kalkulasi of every employee for one date and
        answers like POST /admin/attendance/calculations. Same range rules (no future date).
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '202': { description: Calculation run queued (same body as POST /admin/attendance/calculations) }
        '400': { description: Invalid date (INVALID_DATE) }
        '403': { description: Missing attendance.calculation.run }
        '422': { description: CALCULATION_DATE_IN_FUTURE }

  /admin/attendance/calculations:
    post:
      tags: [Attendance]
      operationId: requestAttendanceCalculation
      x-required-permission: attendance.calculation.run
      description: >-
        ATT-014-2 Kalkulasi (D-14-1 … D-14-4). Queues a calculation for an optional unit or employee
        and a date range of at most 93 days ending no later than today (Asia/Jakarta). One run is
        processed at a time across the server, in the API process; other runs wait as `queued`.
        Only employee-days covered by a machine PIN mapping, a mobile/manual event, or an approved
        clarification are calculated; the rest are counted as `uncoveredPairs` and never written.
        Today is calculated as a provisional result. Audited as `attendance.calculation.requested`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to]
              properties:
                unitId: { type: string, format: uuid }
                employeeId: { type: string, format: uuid }
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        '202':
          description: Run queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceCalculationRun' }
        '400': { description: Invalid body or reversed range (INVALID_CALCULATION_RANGE) }
        '403': { description: Missing attendance.calculation.run }
        '422': { description: CALCULATION_RANGE_TOO_LARGE (over 93 days) or CALCULATION_DATE_IN_FUTURE }

  /admin/attendance/calculations/{id}:
    get:
      tags: [Attendance]
      operationId: getAttendanceCalculation
      x-required-permission: attendance.reports.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Run status and progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceCalculationRun' }
        '403': { description: Missing attendance.reports.read }
        '404': { description: CALCULATION_NOT_FOUND }

  /admin/attendance/calculations/{id}/cancel:
    post:
      tags: [Attendance]
      operationId: cancelAttendanceCalculation
      x-required-permission: attendance.calculation.run
      description: >-
        Allowed for the requester, or for another account that also holds attendance.policy.manage.
        A queued run is cancelled at once; a running run stops at its next progress checkpoint
        (every 25 employee-days). Results already calculated stay valid.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Run after the cancel request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceCalculationRun' }
        '403': { description: Not the requester and missing attendance.policy.manage }
        '404': { description: CALCULATION_NOT_FOUND }
        '409': { description: CALCULATION_ALREADY_FINISHED }

  /admin/attendance/reports/{model}:
    get:
      tags: [Attendance]
      operationId: getAttendanceReportModel
      x-required-permission: attendance.reports.read
      description: >-
        ATT-014 §7/§19.2 report models built from stored results only (D-14-11): `daily_grid`
        (Laporan Harian grid, symbols §6.6, landscape), `employee_summary` (Rekapitulasi Pegawai with
        unit subtotals, Presensi % = Riil ÷ Normal), `daily_detail` (Detail Harian). `format=json`
        feeds the preview and, with `purpose=print`, the print document; `csv` (UTF-8 BOM) and `xlsx`
        are downloads. Every print and export is audited as `attendance.report.exported` with model,
        format, purpose, scope, range and row count only. At most 93 days and 50 000 employee-days.
      parameters:
        - { name: model, in: path, required: true, schema: { type: string, enum: [daily_grid, employee_summary, daily_detail] } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: employeeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv, xlsx], default: json } }
        - { name: purpose, in: query, required: false, schema: { type: string, enum: [view, print], default: view } }
      responses:
        '200':
          description: >-
            json: `{ model, title, orientation, columns, groups[{ unitName, rows, subtotal }], total,
            legend, header{ scope, period, printedBy, printedAt }, warnings{ notCalculated, changed,
            provisional }, from, to }`; csv/xlsx: file attachment.
        '400': { description: INVALID_REPORT_QUERY or INVALID_CALCULATION_RANGE }
        '403': { description: Missing attendance.reports.read }
        '404': { description: REPORT_MODEL_NOT_FOUND }
        '422': { description: CALCULATION_RANGE_TOO_LARGE, CALCULATION_DATE_IN_FUTURE, or EXPORT_TOO_LARGE }

  /admin/attendance/unscheduled:
    get:
      tags: [Attendance]
      operationId: getAttendanceUnscheduled
      x-required-permission: attendance.reports.read
      description: >-
        ATT-014 §20.3 Tanpa Jadwal (R2a). `employees`: employees in scope with captured punches (raw
        machine scans through the PIN mapping valid at scan time, plus mobile/manual events) on dates no
        schedule pattern or published roster covers, with position, number of days, first/last date,
        range of the last scan time per day (information only), and the earliest pattern start.
        `pins`: machine scans that cannot be attributed (PIN unmapped, before the holder's mapping, or
        outside it), per device and PIN; `null` unless the caller holds attendance.devices.read.
        Read-only, paginated, at most 93 days.
      parameters:
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: employeeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pinPage, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 10, maximum: 200, default: 50 } }
      responses:
        '200': { description: '`{ from, to, employees: { page, pageSize, total, totalPages, items }, pins: { … } | null }`' }
        '400': { description: INVALID_UNSCHEDULED_QUERY or INVALID_CALCULATION_RANGE }
        '403': { description: Missing attendance.reports.read }
        '422': { description: CALCULATION_RANGE_TOO_LARGE or CALCULATION_DATE_IN_FUTURE }

  /admin/attendance/exceptions:
    get:
      tags: [Attendance]
      operationId: getAttendanceExceptions
      x-required-permission: attendance.reports.read
      description: >-
        ATT-014 §20.2 tab Pengecualian (R2b). Approved leave requests overlapping the range (one row per
        request, `typeName` from the leave policy catalog) and attendance clarifications or HC corrections
        with a work date in the range (every status, `origin` employee or hc). Read-only, ENG-LIST-001
        paged (pageSize default 25, max 100), at most 93 days.
      parameters:
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: employeeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: '`{ page, pageSize, total, pageCount, items: [{ kind: leave|clarification, id, employeeId, employeeNumber, employeeName, unitName, startOn, endOn, type, typeName, mode, origin, status, reason }] }`' }
        '400': { description: INVALID_EXCEPTIONS_QUERY or INVALID_CALCULATION_RANGE }
        '403': { description: Missing attendance.reports.read }
        '422': { description: CALCULATION_RANGE_TOO_LARGE or CALCULATION_DATE_IN_FUTURE }

  /admin/attendance/transactions:
    get:
      tags: [Attendance]
      operationId: getAttendanceTransactions
      x-required-permission: attendance.reports.read
      description: >-
        ATT-014 §19.1 Data Transaksi. One row per punch in scope, newest first, read-only: machine
        scans read raw through the PIN mapping valid at scan time (including scans not yet
        normalised), mobile/manual events, and approved correction times (one row per boundary,
        `correctionBy` hc or employee). `usedInResult` tells whether the latest result version uses
        the punch. Paginated; at most 93 days, no future dates.
      parameters:
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: employeeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: source, in: query, required: false, schema: { type: string, enum: [adms, mobile, manual, correction] } }
        - { name: reviewState, in: query, required: false, schema: { type: string, enum: [needs_review] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 10, maximum: 200, default: 50 } }
      responses:
        '200':
          description: >-
            `{ from, to, page, pageSize, total, totalPages, needsReviewTotal, items }`; each item has `id`,
            employee and unit, `occurredAt`, `workDate`, `source`, `correctionBy`, `boundary`, `deviceName`,
            `usedInResult`, `reviewState` and `geofenceStatus` (mobile punches). ATT-011-3R: `evidence`
            (evidenceId, coordinates, accuracy, distance, work location) is included only for callers with
            attendance.clarification.manage; the photo is fetched one at a time from the mobile-evidence
            photo endpoint, which audits every opening.
        '400': { description: INVALID_TRANSACTIONS_QUERY or INVALID_CALCULATION_RANGE }
        '403': { description: Missing attendance.reports.read }
        '422': { description: CALCULATION_RANGE_TOO_LARGE or CALCULATION_DATE_IN_FUTURE }

  /admin/attendance/calculation-rows:
    get:
      tags: [Attendance]
      operationId: getAttendanceCalculationRows
      x-required-permission: attendance.reports.read
      description: >-
        ATT-014-2 Detail Harian rows for Laporan & Kalkulasi. Reads stored result versions only and
        never calculates. One row per employed employee-day in scope: `not_captured` outside the
        coverage rule ("Tidak tercatat"), `not_calculated` when covered but not calculated yet,
        otherwise the latest result status. Today's rows are `provisional`; a scheduled day without a
        check-in is re-evaluated by the clock on read. `changedSinceCalculated` is set when machine
        scans, attendance events, schedule assignments, or published roster entries arrive after the
        pair was last calculated. Paginated; `summary` and `changedCount` cover all pages.
      parameters:
        - { name: tab, in: query, required: false, schema: { type: string, enum: [detail], default: detail } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: employeeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, pending, present, late, incomplete, leave, absent, off, configuration_error, unscheduled, not_captured, not_calculated]
        - { name: changedOnly, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 10, maximum: 200, default: 50 } }
      responses:
        '200':
          description: >-
            `{ from, to, today, generatedAt, lastCalculatedAt, changedCount, summary, page, pageSize,
            total, totalPages, items }`. Each item carries employee and unit, `workDate`, `status`,
            `provisional`, `changedSinceCalculated`, `resultVersion`, `calculatedAt`, scheduled and
            scanned times, `workedMinutes`, `lateMinutes`, `earlyLeaveMinutes`, `overtimeMinutes`,
            `incompleteSession`, `normal`, and `actual`.
        '400': { description: INVALID_CALCULATION_ROWS_QUERY or INVALID_CALCULATION_RANGE }
        '403': { description: Missing attendance.reports.read }
        '422': { description: CALCULATION_RANGE_TOO_LARGE or CALCULATION_DATE_IN_FUTURE }

  /admin/attendance/report:
    get:
      tags: [Attendance]
      operationId: getAttendanceReport
      x-required-permission: attendance.reports.read
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [detail, period, unit, sessions, scans, schedule, overtime], default: detail }
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - name: employeeId
          in: query
          required: false
          description: Applies to every report family except unit aggregation semantics still aggregate the filtered employee only.
          schema: { type: string, format: uuid }
        - name: unitId
          in: query
          required: false
          description: Applies to all report families, including sessions, scans, and overtime.
          schema: { type: string, format: uuid }
        - name: scheduleId
          in: query
          required: false
          description: Applies to detail, period, unit, sessions, and schedule reports.
          schema: { type: string, format: uuid }
        - name: locationId
          in: query
          required: false
          description: Applies to detail, period, unit, sessions, and schedule reports.
          schema: { type: string, format: uuid }
        - name: deviceId
          in: query
          required: false
          description: Applies to detail, period, unit, sessions, and scans where device-backed evidence exists.
          schema: { type: string, format: uuid }
        - name: source
          in: query
          required: false
          description: Applies to detail, period, unit, sessions, and scans.
          schema: { type: string, enum: [adms, mobile, manual] }
        - name: status
          in: query
          required: false
          description: Applies to detail report only.
          schema:
            type: string
            enum: [scheduled, pending, present, late, incomplete, leave, absent, off, configuration_error]
      responses:
        '200':
          description: Canonical detail, period, unit, session, scan, schedule, or overtime report; unsupported filter/type combinations are not exposed by the GUI.


  /admin/attendance/work-locations/{locationId}:
    patch:
      tags: [Attendance]
      operationId: updateAttendanceWorkLocation
      x-required-permission: attendance.schedule.manage
      parameters:
        - { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Work location updated without deleting historical references }

  /admin/attendance/schedules/{scheduleId}:
    patch:
      tags: [Attendance]
      operationId: updateAttendanceSchedule
      x-required-permission: attendance.schedule.manage
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Schedule template updated }

  /admin/attendance/schedule-assignments/{assignmentId}:
    patch:
      tags: [Attendance]
      operationId: updateAttendanceScheduleAssignment
      x-required-permission: attendance.schedule.manage
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Effective-to boundary updated }

  /admin/attendance/rosters/{rosterId}/entries/{employeeId}/{workDate}:
    delete:
      tags: [Attendance]
      operationId: removeAttendanceRosterOverride
      x-required-permission: attendance.schedule.manage
      parameters:
        - { name: rosterId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: workDate, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '204': { description: Draft override removed so the employee returns to default schedule }

  /admin/attendance/rosters/{rosterId}/copy-previous:
    post:
      tags: [Attendance]
      operationId: copyPreviousAttendanceRoster
      x-required-permission: attendance.schedule.manage
      parameters:
        - { name: rosterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Latest published roster from previous week copied into draft }

  /admin/attendance/mobile-evidence:
    get:
      tags: [Attendance]
      operationId: listAttendanceMobileEvidence
      x-required-permission: attendance.clarification.manage
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - name: reviewState
          in: query
          required: false
          schema: { type: string, enum: [all, accepted, needs_review] }
      responses:
        '200': { description: Mobile GPS/photo metadata list without photo plaintext }

  /admin/attendance/mobile-evidence/{evidenceId}/photo:
    get:
      tags: [Attendance]
      operationId: getAttendanceMobileEvidencePhotoForHc
      x-required-permission: attendance.clarification.manage
      parameters:
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Decrypted attendance JPEG for authorized HC review; no-store and audited
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }


  /attendance/overtime/me:
    get:
      tags: [Attendance]
      operationId: listMyAttendanceOvertime
      responses:
        '200': { description: Own overtime request history }

  /attendance/overtime:
    post:
      tags: [Attendance]
      operationId: submitAttendanceOvertime
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceOvertimeInput' }
      responses:
        '201': { description: Overtime request submitted }

  /attendance/overtime/{overtimeId}/cancel:
    post:
      tags: [Attendance]
      operationId: cancelMyAttendanceOvertime
      parameters:
        - { name: overtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Submitted overtime request cancelled }

  /admin/attendance/overtime:
    get:
      tags: [Attendance]
      operationId: listAttendanceOvertimeForHc
      x-required-permission: attendance.overtime.manage
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [all, submitted, approved, rejected, cancelled], default: submitted }
      responses:
        '200': { description: Overtime queue/history }
    post:
      tags: [Attendance]
      operationId: createAttendanceOvertimeForEmployee
      x-required-permission: attendance.overtime.manage
      responses:
        '201': { description: HC-created overtime request }

  /admin/attendance/overtime/{overtimeId}/decision:
    post:
      tags: [Attendance]
      operationId: decideAttendanceOvertime
      x-required-permission: attendance.overtime.manage
      parameters:
        - { name: overtimeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Overtime approved/rejected and attendance result recomputed }

  /admin/attendance/manual-corrections:
    post:
      tags: [Attendance]
      operationId: createCanonicalManualAttendanceCorrection
      x-required-permission: attendance.records.manage
      description: >-
        Koreksi HC. `checkInAt` must fall on `workDate` (Asia/Jakarta); `checkOutAt` on `workDate`
        or the next day (shift ending after midnight); when both are given, check-out is after
        check-in and at most 24 hours later. Checked before any write.
      responses:
        '201': { description: Audited append-only canonical correction created and result recomputed }
        '400': { description: INVALID_MANUAL_CORRECTION }
        '403': { description: Missing attendance.records.manage }
        '404': { description: EMPLOYEE_NOT_FOUND }
        '422': { description: CHECK_IN_OUTSIDE_WORK_DATE, CHECK_OUT_OUTSIDE_WORK_DATE, or CHECK_OUT_BEFORE_CHECK_IN }

  /admin/attendance/daily:
    get:
      tags: [Attendance]
      operationId: getAttendanceDailyOperationalReadModel
      x-required-permission: attendance.reports.read
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: employeeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: All active employees for the work date, including transient scheduled/pending/absent states without materializing evidence }

  /admin/attendance/today:
    get:
      tags: [Attendance]
      operationId: getAttendanceTodayMonitor
      x-required-permission: attendance.reports.read
      description: >-
        ATT-014-1 Pantauan Hari Ini. Today's (Asia/Jakarta) scan facts per active employee: schedule,
        first/last scan, scan count, sources, and the neutral difference between the first scan and the
        scheduled start. Reads raw machine scans through the employee PIN mapping plus mobile/manual
        events. Never writes a result version and never returns an attendance verdict
        (absent/late/incomplete); verdicts come from Kalkulasi (ATT-014 §6).
      parameters:
        - { name: employeeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: >-
            `{ date, generatedAt, summary, items }`. `summary` counts items per `card`
            (scanned, not_scanned, not_connected, off, leave, unscheduled, unscheduled_with_scans,
            configuration_error). Each item carries `dayKind`, `scheduleName`, `scheduledStartAt`,
            `scheduledEndAt`, `firstScanAt`, `lastScanAt`, `scanCount`, `sources`, `deviceIds`,
            `startDeltaMinutes`, `connected`, `fact`, and `card`.
        '400': { description: Invalid filter (INVALID_ATTENDANCE_TODAY_QUERY) }
        '403': { description: Missing attendance.reports.read }


  /attendance/shift-swaps/candidates:
    get:
      tags: [Attendance]
      operationId: getShiftSwapCandidates
      parameters:
        - { name: workDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Same-unit eligible counterpart candidates with resolved schedule snapshots }
        '409': { description: Requester schedule, cutoff, or active-conflict prevents a new swap }

  /attendance/shift-swaps/me:
    get:
      tags: [Attendance]
      operationId: listMyShiftSwaps
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, awaiting_counterpart, awaiting_hc, approved, rejected_by_counterpart, rejected_by_hc, cancelled]
      responses:
        '200': { description: Shift swaps where current employee is requester or counterpart }

  /attendance/shift-swaps:
    post:
      tags: [Attendance]
      operationId: createShiftSwap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counterpartEmployeeId, workDate]
              properties:
                counterpartEmployeeId: { type: string, format: uuid }
                workDate: { type: string, format: date }
                note: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201': { description: Immutable requester/counterpart schedule snapshot created; waiting for counterpart }
        '409': { description: Eligibility, cutoff, same-unit, schedule, or active-conflict failure }

  /attendance/shift-swaps/{shiftSwapId}/counterpart-decision:
    post:
      tags: [Attendance]
      operationId: decideShiftSwapAsCounterpart
      parameters:
        - { name: shiftSwapId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, reject] }
                note: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200': { description: Counterpart decision stored append-only }
        '404': { description: Request is not owned by the current employee as counterpart }
        '409': { description: State or cutoff changed }

  /attendance/shift-swaps/{shiftSwapId}/cancel:
    post:
      tags: [Attendance]
      operationId: cancelShiftSwap
      parameters:
        - { name: shiftSwapId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Active requester-owned shift swap cancelled }
        '409': { description: Request is no longer cancellable }

  /admin/attendance/shift-swaps:
    get:
      tags: [Attendance]
      operationId: listShiftSwapsForHc
      x-required-permission: attendance.shift_swap.manage
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, awaiting_counterpart, awaiting_hc, approved, rejected_by_counterpart, rejected_by_hc, cancelled]
      responses:
        '200': { description: Shift exchange operational queue and history }

  /admin/attendance/shift-swaps/{shiftSwapId}/decision:
    post:
      tags: [Attendance]
      operationId: decideShiftSwapAsHc
      x-required-permission: attendance.shift_swap.manage
      parameters:
        - { name: shiftSwapId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200': { description: HC decision stored; approval atomically publishes a new roster version }
        '409': { description: Stale schedule, draft roster, cutoff, state, or other conflict }

components:
  schemas:
    AttendanceCalculationRun:
      type: object
      required: [id, status, position, from, to, totalPairs, processedPairs, failedPairs, uncoveredPairs, cancelRequested, errorCode, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        position: { type: integer, nullable: true, description: Queue position while queued }
        unitId: { type: string, format: uuid, nullable: true }
        employeeId: { type: string, format: uuid, nullable: true }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalPairs: { type: integer, description: Covered employee-days to calculate }
        processedPairs: { type: integer }
        failedPairs: { type: integer }
        uncoveredPairs: { type: integer, description: Employee-days outside the coverage rule (never written) }
        cancelRequested: { type: boolean }
        errorCode: { type: string, nullable: true, description: INTERRUPTED or CALCULATION_FAILED }
        requestedByAccountId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    AttendanceResult:
      type: [object, 'null']
      properties:
        id: { type: string, format: uuid }
        workDate: { type: string, format: date }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [scheduled, pending, present, late, incomplete, leave, absent, off, configuration_error]
        scheduledStartAt: { type: [string, 'null'], format: date-time }
        scheduledEndAt: { type: [string, 'null'], format: date-time }
        firstCheckInAt: { type: [string, 'null'], format: date-time }
        lastCheckOutAt: { type: [string, 'null'], format: date-time }
        workedMinutes: { type: integer, minimum: 0 }
        breakMinutes: { type: integer, minimum: 0 }
        lateMinutes: { type: integer, minimum: 0 }
        earlyLeaveMinutes: { type: integer, minimum: 0 }
        incompleteSession: { type: boolean }
        justified: { type: boolean }
        lateJustified: { type: boolean }
        earlyLeaveJustified: { type: boolean }
        outsideGeofenceJustified: { type: boolean }
        overtimeMinutes: { type: integer, minimum: 0 }
        sessions:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer, minimum: 1 }
              checkInAt: { type: string, format: date-time }
              checkOutAt: { type: [string, 'null'], format: date-time }
              workedMinutes: { type: [integer, 'null'], minimum: 0 }
              complete: { type: boolean }
              sourceSummary: { type: string }

    AttendanceWorkforceSnapshot:
      type: object
      required: [employee, workDate, mobileEnabled, mobileReadiness, schedule, result, clarifications, mobileEvidence]
      properties:
        employee: { type: object }
        workDate: { type: string, format: date }
        mobileEnabled: { type: boolean }
        mobileReadiness:
          type: object
          required: [captureReady, captureReason, scheduleState, scheduleReason, hasWorkLocation, workLocationId]
          properties:
            captureReady: { type: boolean }
            captureReason: { type: string, enum: [runtime_disabled, restricted_media_not_ready, ready] }
            scheduleState: { type: string, enum: [scheduled, off, configuration_error] }
            scheduleReason: { type: [string, 'null'] }
            hasWorkLocation: { type: boolean }
            workLocationId: { type: [string, 'null'], format: uuid }
        schedule:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [scheduled, off, configuration_error] }
            scheduleTemplateId: { type: [string, 'null'], format: uuid }
            scheduleVersionId: { type: [string, 'null'], format: uuid }
            scheduledStartAt: { type: [string, 'null'], format: date-time }
            scheduledEndAt: { type: [string, 'null'], format: date-time }
            workLocation: { type: [object, 'null'] }
        result: { $ref: '#/components/schemas/AttendanceResult' }
        clarifications: { type: array, items: { type: object } }
        mobileEvidence: { type: array, items: { type: object } }
        overtimeRequests: { type: array, items: { type: object } }

    AttendanceClarificationInput:
      type: object
      required: [workDate, kind, mode, reason]
      properties:
        workDate: { type: string, format: date }
        kind:
          type: string
          enum: [missing_check_in, missing_check_out, machine_issue, lateness, early_leave, outside_geofence, other]
        mode: { type: string, enum: [correction, justification] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        proposedCheckInAt: { type: [string, 'null'], format: date-time }
        proposedCheckOutAt: { type: [string, 'null'], format: date-time }

    AttendanceWorkLocationInput:
      type: object
      required: [name, latitude, longitude, radiusMeters]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusMeters: { type: integer, minimum: 10, maximum: 5000 }

    AttendanceScheduleInput:
      type: object
      required: [name, startTime, endTime]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        startTime: { type: string }
        endTime: { type: string }
        endDayOffset: { type: integer, enum: [0, 1] }
        lateGraceMinutes: { type: integer, minimum: 0, maximum: 240 }
        earlyLeaveToleranceMinutes: { type: integer, minimum: 0, maximum: 240 }
        workLocationId: { type: [string, 'null'], format: uuid }
        effectiveFrom:
          type: string
          format: date
          description: Date (00:00 WIB) the first version applies from; default is the moment of creation. Not in the future.

    AttendanceOvertimeInput:
      type: object
      required: [workDate, requestedMinutes]
      properties:
        workDate: { type: string, format: date }
        requestedMinutes: { type: integer, minimum: 1, maximum: 1440 }
        note: { type: [string, 'null'], maxLength: 2000 }
