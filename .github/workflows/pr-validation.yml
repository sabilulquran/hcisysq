name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - agent/uat-fixes

permissions:
  contents: read

env:
  CI_PG_USER: hcis
  CI_PG_PASSWORD: hcis_ci_password
  CI_AUTH_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"

jobs:
  validate:
    name: Typecheck, lint, test, build, migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hcis
          POSTGRES_PASSWORD: hcis_ci_password
          POSTGRES_DB: hcis_pr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcis -d hcis_pr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3001
      DATABASE_URL: postgres://hcis:hcis_ci_password@127.0.0.1:5432/hcis_pr
      AUTH_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      AUTH_SESSION_TTL_HOURS: 8

    steps:
      - name: Checkout PR tree
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check operational shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/uat-account-hygiene.sh

      - name: Reject legacy user-facing identity brand
        shell: bash
        run: |
          legacy="$(git grep -n -I -F 'SQ Identity' -- apps/web/src apps/api/src || true)"
          test -z "$legacy" || { printf '%s\n' "$legacy"; echo 'Use "Akun SQ" for the shared sign-in, not "SQ Identity".' >&2; exit 1; }

      - name: Create synthetic API environment
        run: |
          cat > apps/api/.env.local <<'EOF'
          NODE_ENV=test
          HOST=127.0.0.1
          PORT=3001
          DATABASE_URL=postgres://hcis:hcis_ci_password@127.0.0.1:5432/hcis_pr
          AUTH_ENCRYPTION_KEY=1111111111111111111111111111111111111111111111111111111111111111
          AUTH_SESSION_TTL_HOURS=8
          EOF

      - name: Check migration source of truth
        run: npm run migrations:check

      - name: Run clean migration
        run: npm run migrate:api

      - name: Rehearse recovered production migration history
        run: npm run migrations:rehearse-recovery

      - name: Rehearse pre-ORG-004 to ORG-004 migration
        run: node apps/api/scripts/rehearse-org004-upgrade.mjs

      - name: Rehearse Wave 1 to Wave 2 migration
        run: node apps/api/scripts/rehearse-wave2-upgrade.mjs

      - name: Rehearse Wave 2 USERINFO migration
        run: node apps/api/scripts/rehearse-wave2-userinfo-upgrade.mjs

      - name: Rehearse Wave 2 user correction migration
        run: node apps/api/scripts/rehearse-wave2-user-correction-upgrade.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # AUTH-011 / SEC-03: the persona matrix needs its own empty loopback database
      # (the test refuses any other name or host) and creates disposable schemas in it.
      - name: Create empty AUTH-011 permissions database
        env:
          PGPASSWORD: hcis_ci_password
        run: |
          psql -h 127.0.0.1 -U "$CI_PG_USER" -d hcis_pr -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE hcis_auth011_permissions_test;'

      - name: Test
        env:
          HCIS_AUTH011_TEST_DATABASE_URL: postgres://hcis:hcis_ci_password@127.0.0.1:5432/hcis_auth011_permissions_test
        run: npm run test

      - name: Require AUTH-011 PostgreSQL suite to have run
        env:
          HCIS_AUTH011_TEST_DATABASE_URL: postgres://hcis:hcis_ci_password@127.0.0.1:5432/hcis_auth011_permissions_test
        working-directory: apps/api
        run: |
          set -o pipefail
          npx vitest run test/auth011-postgres.integration.test.ts test/auth011-route-coverage.test.ts \
            --reporter=verbose --reporter=json --outputFile=/tmp/auth011.json | tee /tmp/auth011.log
          node -e '
            const r = require("/tmp/auth011.json");
            const skipped = r.numPendingTests + r.numTodoTests;
            console.log(`AUTH-011: ${r.numPassedTests} passed, ${skipped} skipped, ${r.numFailedTests} failed`);
            if (!r.success || skipped > 0 || r.numPassedTests < 20) process.exit(1);
          '

      - name: Build
        run: npm run build

      - name: Validate retired staging entry point
        run: |
          grep -Fq "services: {}" infra/docker-compose.staging.yml
          grep -Fq "DO NOT DEPLOY" infra/docker-compose.staging.yml
