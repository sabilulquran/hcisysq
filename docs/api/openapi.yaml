openapi: 3.1.0
info:
  title: HCIS YSQ API
  version: 0.0.1
  description: |
    Kontrak awal untuk vertical slice identity, employee profile, leave, organization, dan attendance operations.
    Status dokumen DRAFT kecuali kontrak AUTH-011 /auth/me yang mengikuti implementasi.
    AUTH-011 admin route permissions: docs/domain/AUTH-011-admin-route-permissions.json.
    Every administrative operation requires the declared effective organization permission;
    deprecated legacy HCIS SUPER_ADMIN compatibility grants no platform or workflow approval authority.
servers:
  - url: https://api.example.invalid
    description: Placeholder only

tags:
  - name: System
  - name: Session
  - name: Employees
  - name: Leave
  - name: Approvals
  - name: Organization
  - name: Organization Directory
  - name: Attendance
  - name: Payslips

paths:
  /internal/v1/organization-directory/snapshot:
    get:
      tags: [Organization Directory]
      operationId: getOrganizationDirectorySnapshot
      summary: Pull the accepted HCIS organization-directory full snapshot
      security:
        - OrganizationDirectoryBearer: []
      parameters:
        - name: asOf
          in: query
          required: true
          description: Asia/Jakarta business date for effective snapshot selection.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Validated, privacy-minimized full snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDirectorySnapshot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Export is disabled or no effective accepted published snapshot is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /health:
    get:
      tags: [System]
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /auth/me:
    get:
      tags: [Session]
      operationId: getCurrentSession
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /employees/me:
    get:
      tags: [Employees]
      operationId: getMyEmployeeProfile
      responses:
        '200':
          description: Employee profile visible to the current actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /leave/preview:
    post:
      tags: [Leave]
      operationId: previewLeaveRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestInput'
      responses:
        '200':
          description: Non-persistent leave calculation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeavePreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /leave/requests:
    get:
      tags: [Leave]
      operationId: listMyLeaveRequests
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current employee leave requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaveRequest'
                  nextCursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Leave]
      operationId: submitLeaveRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestInput'
      responses:
        '201':
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Domain conflict such as overlapping request or stale state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leave/requests/{requestId}:
    get:
      tags: [Leave]
      operationId: getLeaveRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Authorized request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /approvals/tasks:
    get:
      tags: [Approvals]
      operationId: listMyApprovalTasks
      responses:
        '200':
          description: Active approval tasks for current actor
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /approvals/tasks/{taskId}/decision:
    post:
      tags: [Approvals]
      operationId: decideApprovalTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, version]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                note:
                  type: [string, 'null']
                  maxLength: 2000
                version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Decision committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalTask'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Task already decided or version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/attendance/adms/management/summary:
    get:
      tags: [Attendance]
      operationId: getAdmsManagementSummary
      summary: Read fleet-level ADMS operational summary
      responses:
        '200': { description: Fleet, unmapped PIN, review, and command counters }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/management/user-sync:
    get:
      tags: [Attendance]
      operationId: listAdmsUserSynchronization
      summary: List desired-versus-observed ADMS user state across devices
      parameters:
        - { name: deviceId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [synced, unmapped, missing_on_device, name_drift, review_required] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        '200': { description: Safe fleet-level user synchronization rows; no biometric payload }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/management/jobs:
    get:
      tags: [Attendance]
      operationId: listAdmsManagementJobs
      summary: List human-readable ADMS command lifecycle across devices
      parameters:
        - { name: deviceId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, acknowledged, succeeded, failed, expired, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        '200': { description: Command/job summaries without wire commands }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/management/health:
    get:
      tags: [Attendance]
      operationId: listAdmsManagementHealth
      summary: List evidence-based ADMS device health and alerts
      responses:
        '200': { description: Connectivity, reconciliation, failed-job, unmapped-PIN, and source-IP evidence }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/management/audit:
    get:
      tags: [Attendance]
      operationId: listAdmsManagementAudit
      summary: List safe append-only ADMS administration audit summaries
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        '200': { description: Audit summaries without raw request or biometric payloads }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/devices:
    get:
      tags: [Attendance]
      operationId: listAdmsDevices
      summary: List registered ADMS fingerprint devices
      responses:
        '200':
          description: Device registry with current mapping and unmapped-PIN counts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdmsDevice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Attendance]
      operationId: registerAdmsDevice
      summary: Explicitly register an ADMS device serial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serialNumber]
              properties:
                serialNumber: { type: string, minLength: 1, maxLength: 128 }
                displayName: { type: [string, 'null'], maxLength: 160 }
                timezone: { type: string, default: Asia/Jakarta, maxLength: 100 }
      responses:
        '201':
          description: Registered active device
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/AdmsDevice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Serial already registered }

  /admin/attendance/adms/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Attendance]
      operationId: getAdmsDevice
      summary: Read ADMS device observability and mapping detail
      responses:
        '200':
          description: Device, mapping history, observed PINs, recent raw events, and quarantine outcomes; raw request body is excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmsDeviceDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Attendance]
      operationId: updateAdmsDevice
      summary: Update lifecycle or operational device metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: [string, 'null'], maxLength: 160 }
                lifecycle: { type: string, enum: [active, disabled, quarantined, retired] }
                timezone: { type: string, maxLength: 100 }
                model: { type: [string, 'null'], maxLength: 160 }
                firmwareVersion: { type: [string, 'null'], maxLength: 160 }
      responses:
        '200':
          description: Updated audited device
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/AdmsDevice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/retire:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Attendance]
      operationId: retireAdmsDevice
      summary: Retire an ADMS device while preserving historical evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 5, maxLength: 500 }
                replacementDeviceId: { type: [string, 'null'], format: uuid }
      responses:
        '200': { description: Retired device with optional replacement reference }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Device already retired or replacement invalid }

  /admin/attendance/adms/detected-devices:
    get:
      tags: [Attendance]
      operationId: listDetectedAdmsDevices
      summary: List detected ADMS serials that have not been automatically trusted
      responses:
        '200':
          description: Detection queue ordered with unclaimed devices first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, serialNumber, status, firstSeenAt, lastSeenAt, observedCount]
                      properties:
                        id: { type: string, format: uuid }
                        serialNumber: { type: string }
                        status: { type: string, enum: [detected, claimed, ignored] }
                        firstSeenAt: { type: string, format: date-time }
                        lastSeenAt: { type: string, format: date-time }
                        lastIp: { type: [string, 'null'] }
                        observedCount: { type: integer, minimum: 1 }
                        safeMetadata: { type: object, additionalProperties: true }
                        claimedDeviceId: { type: [string, 'null'], format: uuid }
                        claimedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/detected-devices/{detectedId}/claim:
    post:
      tags: [Attendance]
      operationId: claimDetectedAdmsDevice
      summary: Explicitly trust a detected serial by creating a disabled registry device
      parameters:
        - name: detectedId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: [string, 'null'], maxLength: 160 }
                timezone: { type: string, default: Asia/Jakarta, maxLength: 100 }
      responses:
        '201':
          description: Trusted registry row created in disabled lifecycle; activation remains separate
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Detection already processed or serial already registered }

  /admin/attendance/adms/devices/{deviceId}/health:
    get:
      tags: [Attendance]
      operationId: getAdmsDeviceHealth
      summary: Read server-derived connectivity independently from device lifecycle
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Connectivity and cadence evidence
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    type: object
                    required: [deviceId, lifecycle, connectivityStatus]
                    properties:
                      deviceId: { type: string, format: uuid }
                      lifecycle: { type: string, enum: [active, disabled, quarantined, retired] }
                      connectivityStatus: { type: string, enum: [online, offline, unknown] }
                      lastSeenAt: { type: [string, 'null'], format: date-time }
                      lastSuccessfulRequestAt: { type: [string, 'null'], format: date-time }
                      lastIp: { type: [string, 'null'] }
                      observedMedianRequestIntervalSeconds: { type: [number, 'null'] }
                      connectivityTimeoutOverrideSeconds: { type: [integer, 'null'], minimum: 30, maximum: 3600 }
                      effectiveConnectivityTimeoutSeconds: { type: [integer, 'null'] }
                      offlineAt: { type: [string, 'null'], format: date-time }
                      lastCommandActivityAt: { type: [string, 'null'], format: date-time }
                      lastTransactionActivityAt: { type: [string, 'null'], format: date-time }
                      lastSuccessfulSyncAt: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/connectivity-policy:
    patch:
      tags: [Attendance]
      operationId: updateAdmsConnectivityPolicy
      summary: Set a per-device connectivity timeout override or return to adaptive mode
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeoutSeconds]
              properties:
                timeoutSeconds: { type: [integer, 'null'], minimum: 30, maximum: 3600 }
      responses:
        '200': { description: Audited connectivity policy update }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/reconciliation-policy:
    patch:
      tags: [Attendance]
      operationId: updateAdmsReconciliationPolicy
      summary: Configure periodic bounded reconciliation; disabled by default
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, intervalMinutes, lookbackHours]
              properties:
                enabled: { type: boolean }
                intervalMinutes: { type: integer, minimum: 60, maximum: 10080 }
                lookbackHours: { type: integer, minimum: 1, maximum: 744 }
      responses:
        '200': { description: Audited reconciliation policy update }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/telemetry:
    get:
      tags: [Attendance]
      operationId: getAdmsDeviceTelemetry
      summary: Read safe registry, transport, and INFO telemetry without raw request bodies
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Safe device telemetry, INFO evidence, and reconciliation policy
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    type: object
                    required: [deviceId, reconciliationEnabled, reconciliationIntervalMinutes, reconciliationLookbackHours]
                    properties:
                      deviceId: { type: string, format: uuid }
                      model: { type: [string, 'null'] }
                      firmwareVersion: { type: [string, 'null'] }
                      transportObserved: { type: [object, 'null'], additionalProperties: true }
                      infoObserved: { type: [object, 'null'], additionalProperties: true, description: Allowlisted INFO result options only. }
                      firstSeenAt: { type: [string, 'null'], format: date-time }
                      lastSeenAt: { type: [string, 'null'], format: date-time }
                      lastSuccessfulRequestAt: { type: [string, 'null'], format: date-time }
                      lastIp: { type: [string, 'null'] }
                      reconciliationEnabled: { type: boolean }
                      reconciliationIntervalMinutes: { type: integer, minimum: 60, maximum: 10080 }
                      reconciliationLookbackHours: { type: integer, minimum: 1, maximum: 744 }
                      reconciliationLastRequestedAt: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/commands:
    get:
      tags: [Attendance]
      operationId: listAdmsDeviceCommands
      summary: List recent durable commands for a trusted device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Recent command state and result metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, commandNumber, commandType, wireCommand, reason, status, attemptCount, createdAt, updatedAt]
                      properties:
                        id: { type: string, format: uuid }
                        commandNumber: { type: string }
                        commandType: { type: string, enum: [sync_new, data_query, read_info] }
                        wireCommand: { type: string, description: Allowlisted LOG, INFO, or DATA QUERY ATTLOG range command only. }
                        reason: { type: string, enum: [registration_recovery, admin_sync_new, admin_range_recovery, admin_read_information, scheduled_reconciliation] }
                        status: { type: string, enum: [pending, delivered, acknowledged, succeeded, failed, expired, cancelled] }
                        attemptCount: { type: integer, minimum: 0 }
                        requestedRangeStart: { type: [string, 'null'], format: date-time }
                        requestedRangeEnd: { type: [string, 'null'], format: date-time }
                        expiresAt: { type: [string, 'null'], format: date-time }
                        deliveredAt: { type: [string, 'null'], format: date-time }
                        acknowledgedAt: { type: [string, 'null'], format: date-time }
                        completedAt: { type: [string, 'null'], format: date-time }
                        returnCode: { type: [integer, 'null'] }
                        resultCommand: { type: [string, 'null'] }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/adms/devices/{deviceId}/commands/read-information:
    post:
      tags: [Attendance]
      operationId: requestAdmsReadInformation
      summary: Queue the documented read-only INFO command for an active device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Durable INFO command queued with TTL }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Device is not active or another command is active }

  /admin/attendance/adms/devices/{deviceId}/transfers/sync-new:
    post:
      tags: [Attendance]
      operationId: requestAdmsSyncNew
      summary: Queue the documented non-destructive LOG command for new transactions
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Durable transfer command queued with TTL }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
