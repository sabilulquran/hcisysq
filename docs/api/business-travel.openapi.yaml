openapi: 3.1.0
info:
  title: HCIS Business Travel (TRIP-001 Package 1)
  version: 1.0.0
  description: |
    Employee business-travel requests, the APR-001 approver inbox and the Human Capital
    register with the assignment letter (surat tugas), as implemented in
    apps/api/src/modules/trips/routes.ts. Spec: docs/domain/business-travel.md.
    All routes use the session cookie and answer with Cache-Control: no-store.
    Errors use { code, message }. No field holds money: advances, costs and reimbursement
    are out of scope (REIMB-001).
paths:
  /trips/me:
    get:
      tags: [Business Travel]
      operationId: listMyTrips
      summary: The signed-in employee's trips, newest departure first
      description: EMPLOYEE principal only; ENG-LIST-001 paged.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: One page of trips
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TripSummary' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Business Travel]
      operationId: submitTrip
      summary: Submit a trip; the APR-001 chain is resolved and snapshotted in the same transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripSubmitInput' }
      responses:
        '200':
          description: Idempotent replay of an earlier submission with the same key
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/TripStatus' }
                  idempotentReplay: { type: boolean, const: true }
        '201':
          description: Submitted; the first approval step is pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: IN_REVIEW }
                  days: { type: integer, minimum: 1, maximum: 30 }
                  approvalChain:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        employeeId: { type: string, format: uuid }
                        name: { type: string }
                  idempotentReplay: { type: boolean, const: false }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trips/me/preview:
    post:
      tags: [Business Travel]
      operationId: previewTrip
      summary: Validate dates and resolve the approval chain without storing anything
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripDates' }
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  approvalChain:
                    type: array
                    items:
                      type: object
                      properties:
                        employeeId: { type: string, format: uuid }
                        name: { type: string }
                        sources: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trips/me/{id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Business Travel]
      operationId: getMyTrip
      summary: One own trip with approval steps, history and assignment letter
      responses:
        '200':
          description: Trip detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }

  /trips/me/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Business Travel]
      operationId: cancelMyTrip
      summary: Cancel an own trip while IN_REVIEW or APPROVED (D-08)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/StatusChanged' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trips/me/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Business Travel]
      operationId: completeMyTrip
      summary: Mark an ISSUED trip completed on or after its return date (D-10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report]
              properties:
                report: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/StatusChanged' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trips/approvals:
    get:
      tags: [Business Travel, Approvals]
      operationId: listTripApprovals
      summary: Pending trip approval steps owned by the signed-in employee
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of pending steps
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        stepId: { type: string, format: uuid }
                        requestId: { type: string, format: uuid }
                        sources: { type: array, items: { type: string } }
                        requesterName: { type: string }
                        requesterNumber: { type: string }
                        unitName: { type: [string, 'null'] }
                        destination: { type: string }
                        purpose: { type: string }
                        startOn: { type: string, format: date }
                        endOn: { type: string, format: date }
                        submittedAt: { type: string, format: date-time }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /trips/approvals/{stepId}/decision:
    post:
      tags: [Business Travel, Approvals]
      operationId: decideTripApproval
      summary: Approve or reject the pending step the caller owns in the snapshot
      parameters:
        - name: stepId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [decision]
                  properties:
                    decision: { type: string, const: approve }
                    note: { type: [string, 'null'], maxLength: 1000 }
                - type: object
                  required: [decision, note]
                  properties:
                    decision: { type: string, const: reject }
                    note: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200':
          description: Decision stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string, format: uuid }
                  requestStatus: { $ref: '#/components/schemas/TripStatus' }
                  stepStatus: { type: string, enum: [approved, rejected] }
                  nextPendingStepId: { type: [string, 'null'], format: uuid }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/trips:
    get:
      tags: [Business Travel]
      operationId: listTripsAdmin
      summary: Business travel register for Human Capital
      description: Requires organization permission trips.read. Filters run before the page is cut.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Status'
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One page of the register
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/TripSummary'
                        - type: object
                          properties:
                            employeeId: { type: string, format: uuid }
                            employeeName: { type: string }
                            employeeNumber: { type: string }
                            unitName: { type: [string, 'null'] }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trips/{id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Business Travel]
      operationId: getTripAdmin
      summary: One trip with steps, history and assignment letter
      description: Requires organization permission trips.read.
      responses:
        '200':
          description: Trip detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/trips/{id}/issue:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Business Travel]
      operationId: issueTripAssignmentLetter
      summary: Issue the numbered surat tugas for an APPROVED trip
      description: |
        Requires organization permission trips.manage. The number is allocated from the DOC-001
        register (code ST) only when issuing succeeds; without an eligible signer the answer is
        409 DOCUMENT_SIGNER_UNAVAILABLE and the trip stays APPROVED.
      responses:
        '200':
          description: Letter issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: ISSUED }
                  documentId: { type: string, format: uuid }
                  documentNumber: { type: string, examples: ['001/ST/YSQ/XI/2026'] }
                  signer:
                    type: object
                    properties:
                      title: { type: string }
                      name: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/trips/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Business Travel]
      operationId: cancelTripAdmin
      summary: Cancel a trip in review, approved or issued; an issued letter is revoked and keeps its number
      description: Requires organization permission trips.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/StatusChanged' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  parameters:
    TripId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Status:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/TripStatus' }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Pagination:
      type: object
      required: [page, pageSize, total, pageCount]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        pageCount: { type: integer }
    TripStatus:
      type: string
      enum: [IN_REVIEW, APPROVED, REJECTED, CANCELLED, ISSUED, COMPLETED]
    TripDates:
      type: object
      required: [startOn, endOn]
      properties:
        startOn: { type: string, format: date }
        endOn: { type: string, format: date }
    TripSubmitInput:
      allOf:
        - $ref: '#/components/schemas/TripDates'
        - type: object
          required: [destination, purpose, idempotencyKey]
          properties:
            destination: { type: string, minLength: 3, maxLength: 200 }
            purpose: { type: string, minLength: 10, maxLength: 1000 }
            idempotencyKey: { type: string, format: uuid }
    TripSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        destination: { type: string }
        purpose: { type: string }
        status: { $ref: '#/components/schemas/TripStatus' }
        startOn: { type: string, format: date }
        endOn: { type: string, format: date }
        submittedAt: { type: string, format: date-time }
        finalDecidedAt: { type: [string, 'null'], format: date-time }
        documentNumber: { type: [string, 'null'] }
        currentApproverName: { type: [string, 'null'] }
    TripDetail:
      allOf:
        - $ref: '#/components/schemas/TripSummary'
        - type: object
          properties:
            employeeId: { type: string, format: uuid }
            employeeName: { type: string }
            employeeNumber: { type: string }
            unitName: { type: [string, 'null'] }
            cancelReason: { type: [string, 'null'] }
            completionReport: { type: [string, 'null'] }
            completedAt: { type: [string, 'null'], format: date-time }
            assignmentLetter:
              oneOf:
                - type: 'null'
                - type: object
                  properties:
                    id: { type: string, format: uuid }
                    documentNumber: { type: string }
                    status: { type: string, enum: [ISSUED, REVOKED] }
                    issuedAt: { type: string, format: date-time }
                    signer: { type: object }
                    content: { type: object, description: Frozen snapshot; identity, placement and the trip only }
            steps:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  order: { type: integer }
                  status: { type: string, enum: [waiting, pending, approved, rejected, cancelled] }
                  sources: { type: array, items: { type: string } }
                  approverName: { type: string }
                  actedAt: { type: [string, 'null'], format: date-time }
                  decisionNote: { type: [string, 'null'] }
            events:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  eventType:
                    type: string
                    enum:
                      - trip.request.submitted
                      - trip.approval.approved_step
                      - trip.request.approved
                      - trip.request.rejected
                      - trip.request.cancelled
                      - trip.assignment.issued
                      - trip.assignment.revoked
                      - trip.request.completed
                  occurredAt: { type: string, format: date-time }
                  note: { type: [string, 'null'] }
                  metadata: { type: object }
                  actorName: { type: [string, 'null'] }
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Wrong principal type, missing permission, or a step the caller does not own
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        Business rule refused the transition, e.g. TRIP_START_IN_PAST, TRIP_TOO_LONG, TRIP_OVERLAP,
        TRIP_LEAVE_OVERLAP, APPROVER_ACCOUNT_NOT_READY, STEP_NOT_PENDING, TRIP_NOT_ISSUABLE,
        TRIP_NOT_CANCELLABLE, TRIP_NOT_COMPLETABLE, DOCUMENT_SIGNER_UNAVAILABLE.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    StatusChanged:
      description: Transition stored
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/TripStatus' }
