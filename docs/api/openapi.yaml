components:
  securitySchemes:
    StaffIdentityBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dedicated client credentials with audience hcis-staff-identity and scope staff-identity.verify.
    OrganizationDirectoryBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Dedicated Keycloak client-credentials token. HCIS verifies issuer, audience,
        allowlisted client_id/azp, and organization-directory.read scope.
    GovernanceSummaryBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ORG-010. User access token obtained by SQ Hub through Keycloak token exchange.
        HCIS verifies signature (RS256, staff realm JWKS, 3-second deadline), issuer (OIDC_ISSUER),
        exp/iat/nbf with 30 seconds of skew, typ Bearer, sub, audience containing
        GOVERNANCE_SUMMARY_AUDIENCE (the HCIS client ID), and azp in GOVERNANCE_SUMMARY_ALLOWED_CLIENTS
        (SQ Hub), then maps iss + sub like OIDC login. Accepted only on /governance/summary.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: ENG-LIST-001 §3.1. 1-based page number; a page past the last returns an empty items array.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      description: ENG-LIST-001 §3.1. Rows per page; values outside 1–100 are refused with 400, never clamped.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: ENG-LIST-001 §3.2. Opaque keyset cursor from the previous page's nextCursor, bound to the same filters.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }

    DraftRevisionIfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        ORG-008-3b. The change set revision the client last read. When it no longer matches, the
        mutation is refused with 409 ORGANIZATION_DRAFT_CHANGED instead of overwriting another
        operator's work. Omitting it keeps the previous behaviour for clients not yet updated.
      schema: { type: integer }

  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Actor is not authorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or intentionally concealed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'

  schemas:
    Pagination:
      description: ENG-LIST-001 §3.1. Position of one page in the filtered list.
      type: object
      additionalProperties: false
      required: [page, pageSize, total, pageCount]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0, description: Rows matching the filters across all pages }
        pageCount: { type: integer, minimum: 1, description: 'ceil(total / pageSize), at least 1' }
    OrganizationDirectorySnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, source, asOf, version, generatedAt, counts, units, positions, people]
      properties:
        schemaVersion:
          type: string
          const: hcis-organization-directory.v1
        source:
          type: object
          additionalProperties: false
          required: [system, snapshotId, effectiveOn, publishedAt, createdAt]
          properties:
            system: { type: string, const: hcis }
            snapshotId: { type: string, format: uuid }
            effectiveOn: { type: string, format: date }
            publishedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
        asOf: { type: string, format: date }
        version:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        generatedAt: { type: string, format: date-time }
        counts:
          type: object
          additionalProperties: false
          required: [units, positions, people]
          properties:
            units: { type: integer, minimum: 0 }
            positions: { type: integer, minimum: 0 }
            people: { type: integer, minimum: 0 }
        units:
          type: array
          items: { $ref: '#/components/schemas/OrganizationDirectoryUnit' }
        positions:
          type: array
          items: { $ref: '#/components/schemas/OrganizationDirectoryPosition' }
        people:
          type: array
          items: { $ref: '#/components/schemas/OrganizationDirectoryPerson' }

    OrganizationDirectoryUnit:
      type: object
      additionalProperties: false
      required: [id, name, nodeType, parentUnitId, active, effectiveFrom, effectiveTo]
      properties:
        id: { type: string, pattern: '^hcis:org-node:[0-9a-f-]{36}$' }
        name: { type: string, minLength: 1 }
        nodeType: { type: string, minLength: 1 }
        parentUnitId: { type: [string, 'null'] }
        active: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }

    OrganizationDirectoryPosition:
      type: object
      additionalProperties: false
      required: [id, unitId, title, parentPositionId, active, effectiveFrom, effectiveTo]
      properties:
        id: { type: string, pattern: '^hcis:org-position:[0-9a-f-]{36}$' }
        unitId: { type: string, pattern: '^hcis:org-node:[0-9a-f-]{36}$' }
        title: { type: string, minLength: 1 }
        parentPositionId: { type: [string, 'null'] }
        active: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }

    OrganizationDirectoryPerson:
      type: object
      additionalProperties: false
      required:
        [id, employeeNumber, displayName, active, employmentStatus, startedOn, endedOn,
         currentPrimaryUnitId, structuralPositionIds, primaryStructuralPositionId, identityRefs]
      properties:
        id: { type: string, pattern: '^hcis:employee:[0-9a-f-]{36}$' }
        employeeNumber: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        active: { type: boolean }
        employmentStatus: { type: [string, 'null'] }
        startedOn: { type: [string, 'null'], format: date }
        endedOn: { type: [string, 'null'], format: date }
        currentPrimaryUnitId: { type: [string, 'null'] }
        structuralPositionIds:
          type: array
          uniqueItems: true
          items: { type: string }
        primaryStructuralPositionId: { type: [string, 'null'] }
        identityRefs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [issuer, subject]
            properties:
              issuer: { type: string, format: uri }
              subject: { type: string, minLength: 1 }

    AdmsDevice:
      type: object
      required: [id, serialNumber, lifecycle, timezone, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        serialNumber: { type: string }
        displayName: { type: [string, 'null'] }
        lifecycle: { type: string, enum: [active, disabled, quarantined, retired] }
        timezone: { type: string }
        model: { type: [string, 'null'] }
        firmwareVersion: { type: [string, 'null'] }
        firstSeenAt: { type: [string, 'null'], format: date-time }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        lastSuccessfulRequestAt: { type: [string, 'null'], format: date-time }
        lastIp: { type: [string, 'null'] }
        activeMappingCount: { type: integer, minimum: 0 }
        unmappedPinCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdmsDeviceDetail:
      type: object
      required: [item, mappings, observedPins, recentEvents, recentQuarantines]
      properties:
        item: { $ref: '#/components/schemas/AdmsDevice' }
        mappings:
          type: array
          items:
            type: object
            required: [id, pin, employeeId, effectiveFrom, createdAt]
            properties:
              id: { type: string, format: uuid }
              pin: { type: string }
              employeeId: { type: string, format: uuid }
              employeeNumber: { type: string }
              employeeName: { type: string }
              effectiveFrom: { type: string, format: date-time }
              effectiveTo: { type: [string, 'null'], format: date-time }
              createdAt: { type: string, format: date-time }
        observedPins:
          type: array
          items:
            type: object
            required: [pin, eventCount, firstEventAt, lastEventAt]
            properties:
              pin: { type: string, description: Leading zeroes are significant. }
              eventCount: { type: integer, minimum: 1 }
              firstEventAt: { type: string, format: date-time }
              lastEventAt: { type: string, format: date-time }
              mappingId: { type: [string, 'null'], format: uuid }
              employeeId: { type: [string, 'null'], format: uuid }
              employeeNumber: { type: [string, 'null'] }
              employeeName: { type: [string, 'null'] }
        recentEvents:
          type: array
          items:
            type: object
            required: [id, pin, occurredAt, receivedAt, sourceRequestId]
            properties:
              id: { type: string, format: uuid }
              pin: { type: string }
              occurredAt: { type: string, format: date-time }
              receivedAt: { type: string, format: date-time }
              sourceRequestId: { type: string, format: uuid }
        recentQuarantines:
          type: array
          items:
            type: object
            required: [id, reason, details, createdAt, requestId]
            properties:
              id: { type: string, format: uuid }
              reason: { type: string }
              details: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }
              requestId: { type: string, format: uuid }

    OrganizationDraft:
      type: object
      required: [id, name, effectiveOn, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        effectiveOn: { type: string, format: date }
        status: { type: string, enum: [DRAFT, VALIDATED, PUBLISHED, DISCARDED] }
        validationReport: { oneOf: [{ $ref: '#/components/schemas/OrganizationValidationReport' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        validatedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        revision:
          description: >
            ORG-008-3b. Increments on every mutation of the change set. Send it back as If-Match on a
            mutation so a concurrent edit is refused with 409 instead of overwriting the other person.
          type: integer

    OrganizationNodeInput:
      type: object
      required: [name, nodeType]
      properties:
        legacyUnitId:
          description: >
            ORG-008-6 (O-9). The imported unit this structural unit stands for, so HC notification
            can resolve "the employee's unit or the unit above it". Null leaves it unlinked, and an
            unlinked branch falls back to the organisation-wide recipients.
          type: [string, 'null']
          format: uuid
        workLocationId:
          description: >
            ORG-005-1 (DRAFT). The work location this unit works at; units below inherit it unless
            they name their own. Must exist and be active, else 400 INVALID_WORK_LOCATION. Null clears it.
          type: [string, 'null']
          format: uuid
        name: { type: string, minLength: 1, maxLength: 160 }
        nodeType: { type: string, minLength: 1, maxLength: 80 }
        parentNodeKey: { type: [string, 'null'], format: uuid }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10, default: 0 }
        integrationCode: { type: [string, 'null'] }

    OrganizationNodePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        nodeType: { type: string, minLength: 1, maxLength: 80 }
        parentNodeKey: { type: [string, 'null'], format: uuid }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10 }
        integrationCode: { type: [string, 'null'] }
        active: { type: boolean }

    OrganizationPositionInput:
      type: object
      required: [nodeKey, title]
      properties:
        nodeKey: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        parentPositionKey: { type: [string, 'null'], format: uuid }
        singleIncumbent: { type: boolean, default: true }
        vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10, default: 0 }

    OrganizationPositionPatch:
      type: object
      minProperties: 1
      properties:
        nodeKey: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        parentPositionKey: { type: [string, 'null'], format: uuid }
        singleIncumbent: { type: boolean }
        vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10 }
        active: { type: boolean }

    OrganizationAuthorityBindingInput:
      type: object
      required: [sourceType, sourceKey, authorityType, targetPositionKey, vacancyPolicy, effectiveFrom]
      properties:
        sourceType: { type: string, enum: [NODE, POSITION] }
        sourceKey: { type: string, format: uuid }
        authorityType: { type: string, enum: [SUPERVISORY_PARENT, LEADER, UNIT_APPROVER, GOVERNANCE_APPROVER, OVERSIGHT_PARENT] }
        targetPositionKey: { type: string, format: uuid }
        vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }

    OrganizationValidationReport:
      type: object
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              severity: { type: string, enum: [ERROR, WARNING] }
              itemKey: { type: [string, 'null'] }

    OrganizationImpactPreview:
      type: object
      required: [directManagerChanges, unitApproverChanges, authorityPathsAffected, vacantAuthorities, unresolvedEmployees, visualOnlyChanges, noApprovalRoutingImpact]
      properties:
        directManagerChanges: { type: array, items: { type: object } }
        unitApproverChanges: { type: array, items: { type: object } }
        authorityPathsAffected: { type: array, items: { type: object } }
        vacantAuthorities: { type: array, items: { type: object } }
        unresolvedEmployees: { type: array, items: { type: object } }
        visualOnlyChanges: { type: array, items: { type: object } }
        noApprovalRoutingImpact: { type: boolean }

    OrganizationPerson:
      type: object
      description: >
        ORG-008-2. One active employee. Carries the staff number, name, unit, position and resolved
        authorities only; no identity number, address, salary or document content.
      required: [employeeId, employeeNumber, fullName, issues]
      properties:
        employeeId: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }
        unit:
          oneOf:
            - type: object
              properties:
                nodeKey: { type: string, format: uuid }
                name: { type: string }
                path: { type: array, items: { type: string } }
            - type: 'null'
        position:
          oneOf:
            - type: object
              properties:
                stableKey: { type: string, format: uuid }
                title: { type: string }
            - type: 'null'
        directManager:
          oneOf: [{ $ref: '#/components/schemas/OrganizationResolvedPerson' }, { type: 'null' }]
        source:
          description: Why that manager, derived from the resolver's own path; never from a job title
          oneOf:
            - type: string
              enum: [OVERRIDE, ACTING, VACANCY_CLIMB, POSITION_PARENT, MEMBERSHIP_LEADER, INHERITED_LEADER]
            - type: 'null'
        sourceDetails:
          type: array
          items: { type: string }
        workLocation:
          description: >
            ORG-005-1 (DRAFT). The unit's work location, or the nearest ancestor unit's
            (inheritedFromNodeKey names that unit); null when none up the branch names one.
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                inheritedFromNodeKey: { type: [string, 'null'], format: uuid }
            - type: 'null'
        unitApprover:
          oneOf: [{ $ref: '#/components/schemas/OrganizationResolvedPerson' }, { type: 'null' }]
        issues:
          type: array
          items:
            type: object
            properties:
              scope: { type: string, enum: [DIRECT_MANAGER, UNIT_APPROVER, MEMBERSHIP] }
              code: { type: string }
        legacy:
          description: Present only when withLegacy=true; read-only comparison, never a rollout change
          oneOf:
            - type: object
              properties:
                directManagerEmployeeId: { type: [string, 'null'], format: uuid }
                directManagerName: { type: [string, 'null'] }
                unitApproverEmployeeId: { type: [string, 'null'], format: uuid }
                unitApproverName: { type: [string, 'null'] }
                unitName: { type: [string, 'null'] }
                comparison: { type: string, enum: [SAME, DIFFERENT, UNRESOLVED, NO_LEGACY] }
            - type: 'null'

    OrganizationResolvedPerson:
      type: object
      properties:
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        positionKey: { type: [string, 'null'], format: uuid }
        positionTitle: { type: [string, 'null'] }
        incumbentKind: { type: string }

    OrganizationResolutionPreview:
      type: object
      required: [employee, effectiveDate, steps]
      properties:
        employee: { type: object }
        effectiveDate: { type: string, format: date }
        workflow: { type: string }
        workflowKey: { type: string }
        changeSetId: { type: string, format: uuid }
        preview:
          description: True while the workflow's approver capability is not decided yet (overtime)
          type: boolean
        governanceApplied: { type: boolean }
        steps:
          type: array
          items: { type: object }
        oversight:
          description: Who is told after the final approval; acted on only under STRUCTURE
          oneOf:
            - type: object
              properties:
                employeeId: { type: string, format: uuid }
                employeeName: { type: string }
                positionTitle: { type: [string, 'null'] }
                appliesInMode: { type: string, enum: [STRUCTURE] }
            - type: 'null'
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }

    RoleSeatCheck:
      type: object
      description: >
        ORG-008-9. status is SEAT_NOT_SET, NO_PUBLISHED_STRUCTURE, SEAT_NOT_IN_STRUCTURE or SEAT_VACANT when
        nothing (or nobody) could be compared, otherwise CHECKED. mismatches lists role holders who do not
        hold the seat (HOLDER_NOT_SEATED) and seat holders without the role (SEATED_WITHOUT_ROLE, reason
        NO_ACCOUNT, ACCOUNT_NOT_ACTIVE or NO_ROLE). An acting holder counts like the primary holder.
      required: [roleKey, asOf, seat, status, holders, incumbents, mismatches]
      properties:
        roleKey: { type: string }
        asOf: { type: string, format: date }
        seat:
          type: [object, 'null']
          properties:
            positionKey: { type: string, format: uuid }
            title: { type: [string, 'null'] }
            unitName: { type: [string, 'null'] }
            reason: { type: string }
            setAt: { type: string, format: date-time }
        status: { type: string, enum: [SEAT_NOT_SET, NO_PUBLISHED_STRUCTURE, SEAT_NOT_IN_STRUCTURE, SEAT_VACANT, CHECKED] }
        holders:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string, format: uuid }
              employeeId: { type: [string, 'null'], format: uuid }
              name: { type: string }
        incumbents:
          type: array
          items:
            type: object
            properties:
              employeeId: { type: string, format: uuid }
              name: { type: string }
              kind: { type: string, enum: [PRIMARY, ACTING] }
              accountId: { type: [string, 'null'], format: uuid }
              hasRole: { type: boolean }
        mismatches:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [HOLDER_NOT_SEATED, SEATED_WITHOUT_ROLE] }
              accountId: { type: string, format: uuid }
              employeeId: { type: [string, 'null'], format: uuid }
              name: { type: string }
              incumbentKind: { type: string, enum: [PRIMARY, ACTING] }
              reason: { type: string, enum: [NO_ACCOUNT, ACCOUNT_NOT_ACTIVE, NO_ROLE] }

    OrganizationReplayReport:
      type: object
      description: ORG-008-4c. What a rebuild kept and what no longer fits.
      required: [applied, kept, skipped]
      properties:
        applied:
          description: False for a preview; true when the change set was actually rebuilt
          type: boolean
        baseChangeSetId: { type: [string, 'null'], format: uuid }
        kept:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              commandType: { type: string }
              summary: { type: object }
        skipped:
          description: Lines that could not be replayed; nothing was guessed on their behalf
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              commandType: { type: string }
              code: { type: string }
              message: { type: string }
        blocked:
          description: >
            Lines kept in the change set that replay cannot reproduce (MANUAL_EDIT, SEED_FROM_LEGACY).
            While any is listed, apply is refused with 409 ORGANIZATION_DRAFT_NOT_REPLAYABLE.
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              commandType: { type: string }
              summary: { type: object }

    OrganizationItemInUse:
      type: object
      description: >
        ORG-008-4b. Why an item cannot be removed or switched off yet. details.uses lists the records
        that still point at it, by identifier and, where the change set has one, a name.
      required: [code, message]
      properties:
        code: { type: string, enum: [ORGANIZATION_ITEM_IN_USE, ORGANIZATION_ITEM_PUBLISHED] }
        message: { type: string }
        details:
          type: object
          properties:
            itemKind: { type: string }
            deactivateInstead: { type: boolean }
            endInstead: { type: boolean }
            uses:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum: [MEMBERSHIP, POSITION, CHILD_UNIT, INCUMBENT, ACTING_INCUMBENT, AUTHORITY_BINDING, CHILD_POSITION, REPORTING_OVERRIDE]
                  id: { type: string }
                  name: { type: [string, 'null'] }

    OrganizationCommand:
      description: >
        ORG-008-4a. One operator action. Nothing is inferred from a job title (invariant I-7): every
        authority a command creates comes from an explicit choice in the command itself.
      oneOf:
        - type: object
          required: [type, name, nodeType]
          properties:
            type: { type: string, enum: [ADD_UNIT] }
            name: { type: string, minLength: 1, maxLength: 160 }
            nodeType: { type: string, minLength: 1, maxLength: 80 }
            parentNodeKey: { type: [string, 'null'], format: uuid }
            leader:
              description: >
                Optional. Creates the unit's leadership seat, its incumbent, the LEADER binding and,
                unless alsoUnitApprover is false, the UNIT_APPROVER binding. A new leadership seat
                climbs to the next authority when empty (decision O-6).
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 160 }
                employeeId: { type: [string, 'null'], format: uuid }
                vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
                alsoUnitApprover: { type: boolean, default: true }
        - type: object
          required: [type, nodeKey, employeeIds]
          properties:
            type: { type: string, enum: [PLACE_EMPLOYEES] }
            nodeKey: { type: string, format: uuid }
            employeeIds: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
            move:
              description: Confirms moving employees who are already a primary member elsewhere
              type: boolean
        - type: object
          required: [type, positionKey, employeeId, effectiveFrom, effectiveTo, reason]
          properties:
            type: { type: string, enum: [APPOINT_ACTING] }
            positionKey: { type: string, format: uuid }
            employeeId: { type: string, format: uuid }
            effectiveFrom: { type: string, format: date }
            effectiveTo: { type: string, format: date }
            reason:
              description: >
                Required (decision O-5) and stored on the incumbency. The server no longer writes a
                fixed "Explicit acting mandate" in its place.
              type: string
              minLength: 1
              maxLength: 500
            mandateNumber: { type: [string, 'null'], maxLength: 120 }
        - type: object
          required: [type, positionKey, parentPositionKey]
          properties:
            type: { type: string, enum: [SET_REPORTS_TO] }
            positionKey: { type: string, format: uuid }
            parentPositionKey:
              description: >
                One answer. A conflicting SUPERVISORY_PARENT binding on the same position is ended,
                so the field and the binding can no longer disagree.
              type: [string, 'null']
              format: uuid
        - type: object
          required: [type, nodeKey, positionKey]
          properties:
            type: { type: string, enum: [SET_UNIT_LEADER, SET_UNIT_APPROVER] }
            nodeKey: { type: string, format: uuid }
            positionKey:
              description: The previous binding of that kind is ended, never duplicated
              type: string
              format: uuid
        - type: object
          required: [type, employeeId, managerPositionKey, reason]
          properties:
            type: { type: string, enum: [SET_OVERRIDE] }
            employeeId: { type: string, format: uuid }
            managerPositionKey: { type: string, format: uuid }
            reason: { type: string, minLength: 1, maxLength: 500 }
            effectiveFrom: { type: string, format: date }
            effectiveTo: { type: [string, 'null'], format: date }

    OrganizationDraftConflict:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          properties:
            changeSetId: { type: string, format: uuid }
            name: { type: string }
            effectiveOn: { type: string, format: date }
            status: { type: string }
            revision: { type: integer }

    OrganizationStaleBase:
      type: object
      description: >
        ORG-008-3a. The published change set that the opened change set cannot contain, because it was
        published after that change set cloned its base and takes effect on or before it. Identifiers
        and names only; no employee data.
      required: [changeSetId, name, effectiveOn, publishedAt]
      properties:
        changeSetId: { type: string, format: uuid }
        name: { type: string }
        effectiveOn: { type: string, format: date }
        publishedAt: { type: string, format: date-time }

    OrganizationDesignerView:
      type: object
      required: [viewDate, mode, nodes, positions, memberships, assignments, bindings, reportingOverrides]
      properties:
        viewDate: { type: string, format: date }
        staleBase:
          description: >
            Present only when the view was opened by draftId. Null while that change set's base is
            still the newest publication.
          oneOf: [{ $ref: '#/components/schemas/OrganizationStaleBase' }, { type: 'null' }]
        publishBlockedForSelf:
          description: >
            ORG-008-10. True when the view was opened by draftId and this session composed that change
            set, so publish would answer 409 ORGANIZATION_PUBLISH_REQUIRES_SECOND_PERSON.
          type: boolean
        mode: { type: string, enum: [HISTORICAL, CURRENT, FUTURE, DRAFT] }
        draft: { oneOf: [{ $ref: '#/components/schemas/OrganizationDraft' }, { type: 'null' }] }
        nodes: { type: array, items: { type: object } }
        positions: { type: array, items: { type: object } }
        memberships: { type: array, items: { type: object } }
        assignments: { type: array, items: { type: object } }
        bindings: { type: array, items: { type: object } }
        reportingOverrides: { type: array, items: { type: object } }

    AppLauncher:
      oneOf:
        - type: object
          additionalProperties: false
          required: [applications]
          properties:
            applications:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, name, canonicalUrl]
                properties:
                  key: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
                  name: { type: string }
                  canonicalUrl: { type: string, format: uri }
        - type: object
          additionalProperties: false
          required: [applications, unavailable]
          properties:
            applications: { type: 'null' }
            unavailable: { type: boolean, enum: [true] }
    Session:
      type: object
      required: [principal, expiresAt, authorization]
      properties:
        principal:
          type: object
          required: [id, email, principalType]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            principalType: { type: string, enum: [EMPLOYEE, FOUNDATION_BOARD, SUPER_ADMIN] }
        expiresAt: { type: string, format: date-time }
        authorization:
          type: object
          description: AUTH-011 effective HCIS-local organization permissions; never platform authority.
          required: [organizationPermissions]
          properties:
            organizationPermissions:
              type: array
              uniqueItems: true
              items: { type: string }

    Actor:
      type: object
      required: [id, kind, displayName]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [employee, candidate, system]
        displayName:
          type: string
        employeeId:
          type: [string, 'null']
          format: uuid

    Reference:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
