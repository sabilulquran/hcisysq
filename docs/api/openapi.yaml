      summary: Read safe operational request, command, quarantine, and Admin audit summaries
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Operational logs with raw ADMS request bodies explicitly excluded
          content:
            application/json:
              schema:
                type: object
                required: [rawRequestBodiesExposed, requests, commandEvents, quarantines, adminAudit]
                properties:
                  rawRequestBodiesExposed: { type: boolean, const: false }
                  requests:
                    type: array
                    items:
                      type: object
                      required: [id, method, path, classification, responseStatus, bodyByteLength, bodyCaptured, receivedAt]
                      properties:
                        id: { type: string, format: uuid }
                        method: { type: string }
                        path: { type: string }
                        classification: { type: string }
                        responseStatus: { type: integer }
                        bodyByteLength: { type: integer, minimum: 0 }
                        bodyCaptured: { type: boolean }
                        safeMetadata: { type: object, additionalProperties: true }
                        receivedAt: { type: string, format: date-time }
                  commandEvents:
                    type: array
                    items:
                      type: object
                      required: [id, commandId, commandNumber, commandType, eventType, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        commandId: { type: string, format: uuid }
                        commandNumber: { type: string }
                        commandType: { type: string, enum: [sync_new, data_query, read_info] }
                        eventType: { type: string, enum: [queued, delivered, acknowledged, succeeded, failed, expired, cancelled] }
                        actorAccountId: { type: [string, 'null'], format: uuid }
                        requestId: { type: [string, 'null'], format: uuid }
                        metadata: { type: object, additionalProperties: true }
                        createdAt: { type: string, format: date-time }
                  quarantines:
                    type: array
                    items:
                      type: object
                      required: [id, requestId, reason, details, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        requestId: { type: string, format: uuid }
                        reason: { type: string }
                        details: { type: object, additionalProperties: true }
                        createdAt: { type: string, format: date-time }
                  adminAudit:
                    type: array
                    items:
                      type: object
                      required: [id, actorAccountId, action, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        actorAccountId: { type: string, format: uuid }
                        action: { type: string }
                        beforeState: { type: [object, 'null'], additionalProperties: true }
                        afterState: { type: [object, 'null'], additionalProperties: true }
                        createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

