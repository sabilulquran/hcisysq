    risk: critical
    planning_note: Packages 1-3 established the HCIS device plane, recovery, Admin operations, encrypted biometric control plane, safe catalogs, and typed physical parity implementation. The supplied 2026-09-15 VPS audit reports three capability rows in state verified, but does not identify enough row-level evidence here to close any specific ledger row. ATT-005 therefore remains implementing. Physical functions require one-capability-at-a-time evidence; BIOMETRIC_COLLECTION_ENABLED remains OFF, active USERINFO reads stay retired, and no arbitrary command escape hatch is permitted.
    docs:
