# RETIRED 2026-10-15 (OPS-MI8-REL-001).
# This workflow deployed Docker/GHCR images to the old paid VPS, which is terminated.
# HCIS production runs on Mi8VPS and is released with scripts/mi8/release-mi8.sh from an
# operator workstation; see docs/development/mi8vps-hcis-release.md.
# The job always fails so a run can never be mistaken for a production deployment.
name: Deploy HCIS Production (RETIRED - old VPS)

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Retired - does not deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse
        shell: bash
        run: |
          echo "::error::deploy-production.yml is retired. The old VPS is terminated; nothing was deployed."
          echo "HCIS production runs on Mi8VPS. Build the bundle with 'Build HCIS Mi8VPS Release Bundle'"
          echo "and release with scripts/mi8/release-mi8.sh (docs/development/mi8vps-hcis-release.md)."
          exit 1
