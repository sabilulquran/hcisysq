openapi: 3.1.0
info:
  title: HCIS Reimbursements (REIMB-001 Package 1)
  version: 1.0.0
  description: |
    Employee reimbursement drafts with encrypted receipts, the APR-001 approver inbox, and the
    Finance register with verification, payment outside payroll, summary and CSV export, as
    implemented in apps/api/src/modules/reimbursements/routes.ts. Spec: docs/domain/reimbursement.md.
    All JSON routes use the session cookie and answer with Cache-Control: no-store.
    Errors use { code, message }.

    Money: every amount is whole rupiah carried as a JSON integer. A fractional number or a
    string is refused with 400, never rounded. The database caps every amount at
    1,000,000,000, far below 2^53. Payroll is not touched: method PAYROLL is refused with
    409 REIMBURSEMENT_PAYROLL_HANDOFF_DISABLED while REIMBURSEMENT_PAYROLL_HANDOFF_ENABLED=0
    (the default and the production setting, spec D-11).

    Visibility: an employee sees only their own claims (another employee's claim is 404);
    drafts never appear in the register; an approver opens a claim only through a step of
    theirs that is pending or decided; reimbursements.read opens the register, receipts,
    summary and export; reimbursements.manage verifies, rejects and pays.
paths:
  /reimbursements/me:
    get:
      tags: [Reimbursements]
      operationId: listMyReimbursements
      summary: The signed-in employee's claims, newest first, with the category catalog and limits
      description: EMPLOYEE principal only; ENG-LIST-001 paged. Discarded drafts are left out.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClaimStatus' }
      responses:
        '200':
          description: One page of claims
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination, categories, policy]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClaimSummary' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
                  policy:
                    type: object
                    properties:
                      minItemAmount: { type: integer }
                      maxClaimTotal: { type: integer }
                      maxItems: { type: integer }
                      maxReceipts: { type: integer }
                      maxExpenseAgeDays: { type: integer }
                      maxOpenDrafts: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Reimbursements]
      operationId: createReimbursementDraft
      summary: Create a draft claim (D-07); receipts are uploaded to it one by one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DraftInput'
                - type: object
                  required: [idempotencyKey]
                  properties:
                    idempotencyKey: { type: string, format: uuid }
      responses:
        '200':
          description: Idempotent replay of an earlier create with the same key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedDraft' }
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedDraft' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reimbursements/me/trips:
    get:
      tags: [Reimbursements]
      operationId: listLinkableTrips
      summary: The employee's own business trips that a claim may be linked to (APPROVED, ISSUED, COMPLETED)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of trips
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        destination: { type: string }
                        startOn: { type: string, format: date }
                        endOn: { type: string, format: date }
                        status: { type: string, enum: [APPROVED, ISSUED, COMPLETED] }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reimbursements/me/approvers:
    get:
      tags: [Reimbursements]
      operationId: previewReimbursementApprovers
      summary: Resolve the APR-001 chain (direct manager, unit approver) without storing anything
      responses:
        '200':
          description: The approvers a submission would snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalChain:
                    type: array
                    items:
                      type: object
                      properties:
                        employeeId: { type: string, format: uuid }
                        name: { type: string }
                        sources: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reimbursements/me/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reimbursements]
      operationId: getMyReimbursement
      summary: One of the employee's claims with items, receipts, steps, payment and history
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Reimbursements]
      operationId: updateReimbursementDraft
      summary: Replace the title, trip link and all items of a draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftInput' }
      responses:
        '200': { $ref: '#/components/responses/StatusChanged' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reimbursements/me/{id}/receipts:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Reimbursements]
      operationId: uploadReimbursementReceipt
      summary: Add one receipt to a draft (PDF, JPG or PNG, at most 4 MB, at most 10 per claim)
      description: The file is checked by signature and for active PDF content (EMP-011 D-02/D-07), encrypted, and stored without its original name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, contentBase64]
              properties:
                contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                contentBase64: { type: string, maxLength: 5592408 }
      responses:
        '201':
          description: Receipt stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  contentType: { type: string }
                  byteSize: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/Problem' }
  /reimbursements/me/{id}/receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/ReceiptId'
    get:
      tags: [Reimbursements]
      operationId: downloadMyReimbursementReceipt
      summary: Download one of the employee's own receipts (attachment, never inline)
      responses:
        '200': { $ref: '#/components/responses/ReceiptFile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Reimbursements]
      operationId: removeReimbursementReceipt
      summary: Remove a receipt from a draft; its content is erased for good
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  removed: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reimbursements/me/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Reimbursements]
      operationId: submitReimbursement
      summary: Submit a draft; rules are re-checked and the APR-001 chain is snapshotted in one transaction
      responses:
        '200':
          description: Submitted; the first approval step is pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: IN_REVIEW }
                  approvalChain:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        employeeId: { type: string, format: uuid }
                        name: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reimbursements/me/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Reimbursements]
      operationId: cancelMyReimbursement
      summary: Discard a draft (receipts erased) or withdraw a claim before Finance verifies it
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 500, description: Required (5–500) unless the claim is a draft }
      responses:
        '200': { $ref: '#/components/responses/StatusChanged' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reimbursements/approvals:
    get:
      tags: [Reimbursements]
      operationId: listReimbursementApprovals
      summary: Steps pending for the signed-in approver
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of pending steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        stepId: { type: string, format: uuid }
                        claimId: { type: string, format: uuid }
                        sources: { type: array, items: { type: string } }
                        requesterName: { type: string }
                        requesterNumber: { type: string }
                        unitName: { type: [string, 'null'] }
                        title: { type: string }
                        claimedTotal: { type: integer }
                        itemCount: { type: integer }
                        receiptCount: { type: integer }
                        tripDestination: { type: [string, 'null'] }
                        submittedAt: { type: string, format: date-time }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reimbursements/approvals/{stepId}:
    parameters:
      - $ref: '#/components/parameters/StepId'
    get:
      tags: [Reimbursements]
      operationId: getReimbursementForApprover
      summary: The claim behind a step the caller holds (pending or decided), without verification, payment or history
      responses:
        '200':
          description: The claim as the approver sees it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
  /reimbursements/approvals/{stepId}/receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/StepId'
      - $ref: '#/components/parameters/ReceiptId'
    get:
      tags: [Reimbursements]
      operationId: downloadReimbursementReceiptForApprover
      summary: Download a receipt of a claim behind the caller's step; the read is recorded first
      responses:
        '200': { $ref: '#/components/responses/ReceiptFile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /reimbursements/approvals/{stepId}/decision:
    parameters:
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Reimbursements]
      operationId: decideReimbursementApproval
      summary: Approve or reject the caller's pending step (rejecting needs a 5–1000 character note)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Decision stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimId: { type: string, format: uuid }
                  claimStatus: { $ref: '#/components/schemas/ClaimStatus' }
                  stepStatus: { type: string }
                  nextPendingStepId: { type: [string, 'null'], format: uuid }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/reimbursements:
    get:
      tags: [Reimbursements]
      operationId: listReimbursementRegister
      summary: Submitted claims (never drafts); reimbursements.read
      description: ENG-LIST-001 paged; every filter runs before LIMIT. Dates are the submission day in WIB.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { type: string, enum: [IN_REVIEW, APPROVED, VERIFIED, PAID, REJECTED, CANCELLED] }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/CategoryKey' }
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: One page of claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClaimSummary' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/reimbursements/claimants:
    get:
      tags: [Reimbursements]
      operationId: searchReimbursementClaimants
      summary: Typeahead over employees who submitted a claim (never the wider register)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of claimants
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        fullName: { type: string }
                        employeeNumber: { type: string }
                        unitName: { type: [string, 'null'] }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/reimbursements/summary:
    get:
      tags: [Reimbursements]
      operationId: summarizeReimbursements
      summary: Totals per status and per category for a submission-date window of at most 366 days
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: status
          in: query
          schema: { type: string, enum: [IN_REVIEW, APPROVED, VERIFIED, PAID, REJECTED, CANCELLED] }
      responses:
        '200':
          description: Aggregates
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  byStatus:
                    type: array
                    items:
                      type: object
                      properties:
                        status: { $ref: '#/components/schemas/ClaimStatus' }
                        claims: { type: integer }
                        claimedTotal: { type: integer }
                        verifiedTotal: { type: integer }
                  byCategory:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { $ref: '#/components/schemas/CategoryKey' }
                        label: { type: string }
                        items: { type: integer }
                        claimedTotal: { type: integer }
                        verifiedTotal: { type: integer }
                        paidTotal: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/reimbursements/export.csv:
    get:
      tags: [Reimbursements]
      operationId: exportReimbursements
      summary: CSV of submitted claims in a window of at most 366 days; recorded as an audit event
      description: More than 20,000 rows is refused with 422 REIMBURSEMENT_EXPORT_TOO_LARGE, never cut.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: status
          in: query
          schema: { type: string, enum: [IN_REVIEW, APPROVED, VERIFIED, PAID, REJECTED, CANCELLED] }
      responses:
        '200':
          description: UTF-8 CSV with a byte-order mark
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
  /admin/reimbursements/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reimbursements]
      operationId: getReimbursementInRegister
      summary: One submitted claim; receipts carry the duplicate signal (D-16)
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/reimbursements/{id}/receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/ReceiptId'
    get:
      tags: [Reimbursements]
      operationId: downloadReimbursementReceiptInRegister
      summary: Download a receipt of a submitted claim; the read is recorded first
      responses:
        '200': { $ref: '#/components/responses/ReceiptFile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /admin/reimbursements/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Reimbursements]
      operationId: verifyReimbursement
      summary: Finance sets the approved amount of every item (0..claimed); a cut needs a 10–500 character note
      description: reimbursements.manage; not the claimant (REIMBURSEMENT_SELF_ACTION_FORBIDDEN) and not an approver of the claim (REIMBURSEMENT_APPROVER_CANNOT_PROCESS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [itemId, approvedAmount]
                    properties:
                      itemId: { type: string, format: uuid }
                      approvedAmount: { type: integer, minimum: 0 }
                note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: VERIFIED }
                  verifiedTotal: { type: integer }
                  reducedItems: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/reimbursements/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Reimbursements]
      operationId: rejectReimbursementAsFinance
      summary: Finance refuses an APPROVED or VERIFIED claim with a 10–500 character reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/StatusChanged' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/reimbursements/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Reimbursements]
      operationId: payReimbursement
      summary: Record the one payment of a VERIFIED claim; the amount is always the verified total
      description: |
        Idempotent. The same key with the same date and method replays (200); the same key with
        other values is 409 IDEMPOTENCY_KEY_REUSED; another key on a paid claim is 409
        REIMBURSEMENT_ALREADY_PAID. PAYROLL is refused while the D-11 switch is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paidOn, method, idempotencyKey]
              properties:
                paidOn: { type: string, format: date }
                method: { type: string, enum: [CASH, TRANSFER, PAYROLL] }
                payrollMonth: { type: [string, 'null'], pattern: '^\d{4}-\d{2}$' }
                reference: { type: [string, 'null'], maxLength: 200 }
                note: { type: [string, 'null'], maxLength: 500 }
                idempotencyKey: { type: string, format: uuid }
      responses:
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        '201':
          description: Payment recorded; the claim is PAID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StepId:
      name: stepId
      in: path
      required: true
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Pagination:
      type: object
      required: [page, pageSize, total, pageCount]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        pageCount: { type: integer }
    ClaimStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, APPROVED, VERIFIED, PAID, REJECTED, CANCELLED]
    CategoryKey:
      type: string
      enum: [TRANSPORT, ACCOMMODATION, MEALS, OPERATIONAL, OTHER]
    Category:
      type: object
      properties:
        key: { $ref: '#/components/schemas/CategoryKey' }
        label: { type: string }
        maxPerItem: { type: integer, description: D-02 DRAFT per-item cap in whole rupiah }
    ItemInput:
      type: object
      required: [category, expenseDate, description, amount]
      properties:
        category: { $ref: '#/components/schemas/CategoryKey' }
        expenseDate: { type: string, format: date }
        description: { type: string, minLength: 3, maxLength: 300 }
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
    DraftInput:
      type: object
      required: [title, items]
      properties:
        title: { type: string, minLength: 5, maxLength: 200 }
        businessTripId: { type: [string, 'null'], format: uuid }
        items: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/ItemInput' } }
    CreatedDraft:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        idempotentReplay: { type: boolean }
    ClaimSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        title: { type: string }
        claimedTotal: { type: integer }
        verifiedTotal: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        businessTripId: { type: [string, 'null'], format: uuid }
        tripDestination: { type: [string, 'null'] }
        itemCount: { type: integer }
        currentApproverName: { type: [string, 'null'] }
        employeeId: { type: string, format: uuid, description: Register only }
        employeeName: { type: string, description: Register only }
        employeeNumber: { type: string, description: Register only }
        unitName: { type: [string, 'null'], description: Register only }
    ClaimDetail:
      allOf:
        - $ref: '#/components/schemas/ClaimSummary'
        - type: object
          properties:
            employeeId: { type: string, format: uuid }
            employeeName: { type: string }
            employeeNumber: { type: string }
            unitName: { type: [string, 'null'] }
            tripStartOn: { type: [string, 'null'], format: date }
            tripEndOn: { type: [string, 'null'], format: date }
            tripStatus: { type: [string, 'null'] }
            verifiedAt: { type: [string, 'null'], format: date-time }
            verificationNote: { type: [string, 'null'] }
            rejectedBy: { type: [string, 'null'], enum: [APPROVER, FINANCE, null] }
            rejectReason: { type: [string, 'null'] }
            cancelReason: { type: [string, 'null'] }
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  lineNo: { type: integer }
                  category: { $ref: '#/components/schemas/CategoryKey' }
                  categoryLabel: { type: string }
                  expenseDate: { type: string, format: date }
                  description: { type: string }
                  amount: { type: integer }
                  approvedAmount: { type: [integer, 'null'], description: Not sent to approvers }
            receipts:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  contentType: { type: string }
                  byteSize: { type: integer }
                  createdAt: { type: string, format: date-time }
                  purged: { type: boolean }
                  duplicateClaims: { type: integer, description: Register only (D-16) }
            steps:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  order: { type: integer }
                  status: { type: string, enum: [waiting, pending, approved, rejected, cancelled] }
                  sources: { type: array, items: { type: string } }
                  approverName: { type: string }
                  actedAt: { type: [string, 'null'], format: date-time }
                  decisionNote: { type: [string, 'null'] }
            payment:
              description: Not sent to approvers
              oneOf:
                - type: 'null'
                - type: object
                  properties:
                    id: { type: string, format: uuid }
                    amount: { type: integer }
                    paidOn: { type: string, format: date }
                    method: { type: string, enum: [CASH, TRANSFER, PAYROLL] }
                    payrollMonth: { type: [string, 'null'] }
                    reference: { type: [string, 'null'] }
                    note: { type: [string, 'null'] }
                    recordedAt: { type: string, format: date-time }
                    recordedByName: { type: [string, 'null'] }
            events:
              description: Not sent to approvers
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  eventType:
                    type: string
                    enum:
                      - reimbursement.draft.created
                      - reimbursement.draft.updated
                      - reimbursement.receipt.added
                      - reimbursement.receipt.removed
                      - reimbursement.receipt.read
                      - reimbursement.request.submitted
                      - reimbursement.approval.approved_step
                      - reimbursement.request.approved
                      - reimbursement.request.rejected
                      - reimbursement.request.cancelled
                      - reimbursement.verified
                      - reimbursement.finance.rejected
                      - reimbursement.paid
                  occurredAt: { type: string, format: date-time }
                  note: { type: [string, 'null'] }
                  metadata: { type: object, description: Ids, categories, dates, methods and counts only — never an amount }
                  actorName: { type: [string, 'null'] }
    PaymentResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        status: { type: string, const: PAID }
        amount: { type: integer }
        idempotentReplay: { type: boolean }
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Wrong principal type, missing permission, a step the caller does not hold, the actor's own claim, or an approver of the claim
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        Business rule refused the transition, e.g. REIMBURSEMENT_ITEM_ABOVE_LIMIT,
        REIMBURSEMENT_TOTAL_ABOVE_LIMIT, REIMBURSEMENT_EXPENSE_IN_FUTURE, REIMBURSEMENT_EXPENSE_TOO_OLD,
        REIMBURSEMENT_RECEIPT_REQUIRED, REIMBURSEMENT_TOO_MANY_RECEIPTS, REIMBURSEMENT_TOO_MANY_DRAFTS,
        REIMBURSEMENT_TRIP_NOT_ELIGIBLE, REIMBURSEMENT_NOT_EDITABLE, REIMBURSEMENT_NOT_SUBMITTABLE,
        APPROVER_ACCOUNT_NOT_READY, STEP_NOT_PENDING, REIMBURSEMENT_NOT_VERIFIABLE,
        REIMBURSEMENT_APPROVED_EXCEEDS_CLAIM, REIMBURSEMENT_REDUCTION_NOTE_REQUIRED,
        REIMBURSEMENT_NOTHING_APPROVED, REIMBURSEMENT_NOT_PAYABLE, REIMBURSEMENT_PAYMENT_DATE,
        REIMBURSEMENT_PAYROLL_HANDOFF_DISABLED, REIMBURSEMENT_ALREADY_PAID, IDEMPOTENCY_KEY_REUSED,
        REIMBURSEMENT_NOT_REJECTABLE, REIMBURSEMENT_NOT_CANCELLABLE, REIMBURSEMENT_STATE_CONFLICT.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    StatusChanged:
      description: Transition stored
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/ClaimStatus' }
    ReceiptFile:
      description: The receipt as an attachment named after the upload date; never the original name
      headers:
        Content-Disposition: { schema: { type: string } }
        Content-Security-Policy: { schema: { type: string } }
      content:
        application/pdf: { schema: { type: string, format: binary } }
        image/jpeg: { schema: { type: string, format: binary } }
        image/png: { schema: { type: string, format: binary } }
