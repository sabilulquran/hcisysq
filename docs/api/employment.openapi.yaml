        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/skill-records/{recordId}/void:
    post:
      tags: [EmployeeProfile]
      operationId: voidSkillRecord
      summary: Void a skill record, with a reason
      description: Requires employees.manage. Same rule as the education record.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidInput' }
