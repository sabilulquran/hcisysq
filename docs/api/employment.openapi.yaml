        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/education-records/{recordId}/void:
    post:
      tags: [EmployeeProfile]
      operationId: voidEducationRecord
      summary: Void an education record, with a reason
      description: |
        Requires employees.manage. Nothing is deleted: the record keeps its row and
        its reason and drops out of the list (spec 3.6).
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidInput' }
