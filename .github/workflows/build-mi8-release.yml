# OPS-MI8-REL-001: build the HCIS Mi8VPS release bundle (linux/arm64).
# Build only. GitHub-hosted runners cannot reach Mi8VPS; a green run means "bundle built",
# never "deployed". Release with scripts/mi8/release-mi8.sh (docs/development/mi8vps-hcis-release.md).
name: Build HCIS Mi8VPS Release Bundle

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character main SHA to build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hcis-mi8-build-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build arm64 bundle for exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate requested SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Require current origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$TARGET_SHA" != "$main_sha" ]]; then
            echo "Refusing build: target SHA is not current origin/main ($main_sha)" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build bundle
        shell: bash
        run: bash scripts/mi8/build-release.sh "$TARGET_SHA" "$RUNNER_TEMP/mi8-out"

      - name: Record bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(ls "$RUNNER_TEMP"/mi8-out/hcis-*.tar.gz)"
          echo "artifact=hcis-mi8-${TARGET_SHA:0:8}" >>"$GITHUB_OUTPUT"
          {
            echo "### HCIS Mi8VPS bundle (not deployed)"
            echo
            echo "- release: \`$(basename "$tarball" .tar.gz)\`"
            echo "- sha256: \`$(cut -d' ' -f1 "$tarball.sha256")\`"
            echo "- download: \`gh run download ${{ github.run_id }} -n hcis-mi8-${TARGET_SHA:0:8}\`"
            echo "- release: \`scripts/mi8/release-mi8.sh preflight --bundle <file> --sha $TARGET_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: |
            ${{ runner.temp }}/mi8-out/*.tar.gz
            ${{ runner.temp }}/mi8-out/*.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
