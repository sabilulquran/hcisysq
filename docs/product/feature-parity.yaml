  - id: EMP-011
    module: employee
    name: Employee document file archive (KTP, KK, ijazah, sertifikat) with expiry
    legacy_evidence: >-
      Legacy Laravel hcis-ysq: EmployeeDocument model (document_type, document_number,
      file_path, mime_type, issued_at, expires_at), EmployeeDocumentController and
      routes profile/documents (employee upload) and documents/* (HC, unit-scoped);
      rule NoExecutableFile guards uploads.
    target_status: implemented
    priority: later
    risk: high
    planning_note: >-
      Found by the 2026-11-02 legacy parity audit. Package 1 implemented 2026-11-11
      (docs/domain/employee-documents.md). It owns the employee-document storage boundary
      (D-01): AES-256-GCM encrypted files in the HCIS database behind the EmployeeFileStore
      port, shared with the EMP-010 PK/SK attachments. HC uploads (verified at once), the
      employee proposes uploads from Data Saya that one HC officer verifies or rejects, and HC
      replaces, edits or erases files. PDF/JPEG/PNG up to 4 MB checked by content, PDFs with
      visible active content refused, downloads always sandboxed attachments without the
      original file name; numbers stored encrypted and shown masked. Readers: the owner and
      employee_documents.read (HC Admin only), never managers or legacy Super Admin. Every file
      read, HC archive and worklist read, and write is audited without numbers, names or file
      content. HC worklist Dokumen Pegawai: expiring (30/60/90/180 days, past included) and
      pending. DRAFT: 4 MB limit, type catalog, 5 open proposals, 5-year retention after the
      employment ends, rejected/withdrawn content erased at once; automatic reminders and
      retention purge TBD.
    docs:
      - docs/domain/employee-documents.md
      - docs/api/employee-documents.openapi.yaml
      - docs/product/legacy-parity-audit-2026-11-02.md

