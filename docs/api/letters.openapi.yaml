openapi: 3.1.0
info:
  title: HCIS Outgoing Letter Register (DOC-003 Package 1)
  version: 1.0.0
  description: |
    Buku nomor surat keluar yayasan, as implemented in apps/api/src/modules/documents/letter-routes.ts.
    Spec: docs/domain/outgoing-letter-register.md. All routes use the session cookie and answer with
    Cache-Control: no-store. Errors use { code, message }.
    /letters/me/* needs an EMPLOYEE session linked to an active employee; taking a number needs an
    active letter_number_grants row for the issuer (D-07), not a permission.
    /admin/letters/* needs documents.read (reads, export) or documents.manage (settings, grants,
    counters, editing or voiding anyone's number), checked before input validation (D-11).
    Numbers are never deleted or reused; a voided number stays in the register (D-08).
paths:
  /letters/me/options:
    get:
      tags: [Letters]
      operationId: myLetterOptions
      summary: Issuers this employee holds a grant for, and the active letter types
      responses:
        '200':
          description: Options; issuers is empty without a grant
          content:
            application/json:
              schema:
                type: object
                required: [today, issuers, types]
                properties:
                  today: { type: string, format: date }
                  issuers:
                    type: array
                    items:
                      type: object
                      required: [id, code, name, kind, available]
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                        kind: { $ref: '#/components/schemas/IssuerKind' }
                        available: { type: boolean, description: Issuer active and, for a committee issuer, committee ACTIVE (D-14) }
                  types: { type: array, items: { $ref: '#/components/schemas/LetterTypeOption' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /letters/me/numbers:
    get:
      tags: [Letters]
      operationId: myLetterNumbers
      summary: The books of the issuers this employee holds a grant for, plus every number they took (D-13); ENG-LIST-001 paged
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: issuerId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [ALLOCATED, VOIDED] } }
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/LetterNumber'
                        - type: object
                          properties:
                            mine: { type: boolean }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Letters]
      operationId: takeLetterNumber
      summary: Take the next number for an issuer and type (grant required); gap-free under concurrency (D-05)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuerId, typeCode, subject, recipient]
              properties:
                issuerId: { type: string, format: uuid }
                typeCode: { type: string, pattern: '^[A-Z][A-Z0-9-]{0,9}$' }
                subject: { type: string, minLength: 3, maxLength: 300 }
                recipient: { type: string, minLength: 2, maxLength: 300 }
                notes: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Number taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocatedLetter' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'LETTER_GRANT_REQUIRED or EMPLOYEE_LINK_REQUIRED', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'LETTER_ISSUER_INACTIVE, LETTER_TYPE_INACTIVE or LETTER_NUMBER_CONFLICT (the next number repeats an older one; HC raises the starting number); no number is used', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /letters/me/numbers/{id}:
    patch:
      tags: [Letters]
      operationId: editMyLetterNumber
      summary: Change subject, recipient or notes of one's own ALLOCATED number
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Edit' }
      responses:
        '200': { $ref: '#/components/responses/Number' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'LETTER_NOT_EDITABLE or LETTER_VERSION_CONFLICT', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /letters/me/numbers/{id}/void:
    post:
      tags: [Letters]
      operationId: voidMyLetterNumber
      summary: Void one's own number; it stays in the register (D-08, D-09)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Void' }
      responses:
        '200': { $ref: '#/components/responses/Number' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: LETTER_NOT_VOIDABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/letters/register:
    get:
      tags: [Letters]
      operationId: letterRegister
      summary: The book and the letters HCIS issued itself (documents.read); ENG-LIST-001 paged
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/IssuerCode'
        - $ref: '#/components/parameters/TypeCode'
        - $ref: '#/components/parameters/RegisterStatus'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page, newest date first, then number
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RegisterRow' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/letters/register/export:
    get:
      tags: [Letters]
      operationId: exportLetterRegister
      summary: Complete CSV of the filtered register (documents.read); audited
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/IssuerCode'
        - $ref: '#/components/parameters/TypeCode'
        - $ref: '#/components/parameters/RegisterStatus'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: UTF-8 CSV with BOM; text cells starting with = + - @ are prefixed with '
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: LETTER_EXPORT_TOO_LARGE (over 20000 rows; narrow the filter), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/letters/numbers/{id}:
    patch:
      tags: [Letters]
      operationId: editLetterNumber
      summary: Change subject, recipient or notes of any ALLOCATED number (documents.manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Edit' }
      responses:
        '200': { $ref: '#/components/responses/Number' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/letters/numbers/{id}/void:
    post:
      tags: [Letters]
      operationId: voidLetterNumber
      summary: Void any number (documents.manage); it stays in the register
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Void' }
      responses:
        '200': { $ref: '#/components/responses/Number' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/letters/types:
    get:
      tags: [Letters]
      operationId: listLetterTypes
      summary: The letter type catalog (documents.read); bounded, HC-managed
      responses:
        '200':
          description: All types, active and inactive
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/LetterTypeOption'
                        - type: object
                          properties:
                            active: { type: boolean }
                            sortOrder: { type: integer }
                            used: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Letters]
      operationId: createLetterType
      summary: Add a letter type (documents.manage); the code never changes (D-15)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, label]
              properties:
                code: { type: string, pattern: '^[A-Z][A-Z0-9-]{0,9}$' }
                label: { type: string, minLength: 2, maxLength: 120 }
                resetPeriod: { $ref: '#/components/schemas/ResetPeriod' }
                sortOrder: { type: integer, minimum: 0, maximum: 9999 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: LETTER_TYPE_CODE_TAKEN, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/letters/types/{code}:
    patch:
      tags: [Letters]
      operationId: updateLetterType
      summary: Change label, order or active flag, or the reset period while the type has no number (documents.manage)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, minLength: 2, maxLength: 120 }
                resetPeriod: { $ref: '#/components/schemas/ResetPeriod' }
                active: { type: boolean }
                sortOrder: { type: integer, minimum: 0, maximum: 9999 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: LETTER_TYPE_IN_USE (reset period of a type that already has numbers), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/letters/issuers:
    get:
      tags: [Letters]
      operationId: listLetterIssuers
      summary: Issuers (documents.read); ENG-LIST-001 paged
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - { name: code, in: query, description: Exact issuer code, schema: { type: string } }
        - { name: active, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: One page by code
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Issuer' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Letters]
      operationId: createLetterIssuer
      summary: Add an issuer (documents.manage); UNIT needs organizationalUnitId, COMMITTEE needs committeeId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, kind]
              properties:
                code: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{0,15}$' }
                name: { type: string, minLength: 2, maxLength: 200 }
                kind: { $ref: '#/components/schemas/IssuerKind' }
                organizationalUnitId: { type: string, format: uuid }
                committeeId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: LETTER_TARGET_NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: LETTER_ISSUER_CODE_TAKEN, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/letters/issuer-targets:
    get:
      tags: [Letters]
      operationId: searchLetterIssuerTargets
      summary: Typeahead of units or open committees for a new issuer (documents.manage); at most 20
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [UNIT, COMMITTEE] } }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        status: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/letters/issuers/{id}:
    patch:
      tags: [Letters]
      operationId: updateLetterIssuer
      summary: Rename or (de)activate an issuer (documents.manage); the code never changes
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 200 }
                active: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/letters/grants:
    get:
      tags: [Letters]
      operationId: listLetterGrants
      summary: Grants to take numbers (documents.read); ENG-LIST-001 paged
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IssuerCode'
        - { name: active, in: query, schema: { type: string, enum: ['true', 'false'], default: 'true' } }
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page by issuer and employee
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Grant' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Letters]
      operationId: createLetterGrant
      summary: Let an active employee take numbers for an issuer (documents.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, issuerId, reason]
              properties:
                employeeId: { type: string, format: uuid }
                issuerId: { type: string, format: uuid }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'LETTER_GRANT_EXISTS, LETTER_EMPLOYEE_INACTIVE or LETTER_ISSUER_INACTIVE', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/letters/employee-options:
    get:
      tags: [Letters]
      operationId: searchLetterGrantEmployees
      summary: Typeahead of active employees (documents.manage); at most 20
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        fullName: { type: string }
                        employeeNumber: { type: string }
                        unitName: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/letters/grants/{id}/revoke:
    post:
      tags: [Letters]
      operationId: revokeLetterGrant
      summary: Revoke a grant (documents.manage); numbers already taken stay with their taker
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: LETTER_GRANT_NOT_REVOCABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/letters/counters:
    get:
      tags: [Letters]
      operationId: readLetterCounter
      summary: The last sequence used for an issuer, type and period (documents.read)
      parameters:
        - { name: issuerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: typeCode, in: query, required: true, schema: { type: string } }
        - { name: periodKey, in: query, required: true, schema: { type: string, pattern: '^\d{4}(-\d{2})?$' } }
      responses:
        '200': { $ref: '#/components/responses/Counter' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Letters]
      operationId: raiseLetterCounter
      summary: Continue a manual book (documents.manage); only ever raises the counter (D-17)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuerId, typeCode, periodKey, lastSequence]
              properties:
                issuerId: { type: string, format: uuid }
                typeCode: { type: string }
                periodKey: { type: string, description: 'YYYY for a yearly type, YYYY-MM for a monthly one' }
                lastSequence: { type: integer, minimum: 1, maximum: 99999, description: Last number already used in the manual book }
      responses:
        '200': { $ref: '#/components/responses/Counter' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: LETTER_COUNTER_NOT_RAISED, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Search:
      name: q
      in: query
      description: 2–100 characters, matched case-insensitively and literally against number, subject and recipient
      schema: { type: string, minLength: 2, maxLength: 100 }
    Source:
      name: source
      in: query
      description: BOOK = numbers taken in this register; HCIS = letters HCIS issued itself (D-10)
      schema: { type: string, enum: [ALL, BOOK, HCIS], default: ALL }
    IssuerCode:
      name: issuerCode
      in: query
      description: A book issuer code; hides HCIS rows
      schema: { type: string }
    TypeCode:
      name: typeCode
      in: query
      description: A book letter type code; hides HCIS rows
      schema: { type: string }
    RegisterStatus:
      name: status
      in: query
      description: ACTIVE = in use (ALLOCATED or ISSUED); VOIDED = voided or revoked
      schema: { type: string, enum: [ACTIVE, VOIDED] }
    Year:
      name: year
      in: query
      schema: { type: integer, minimum: 2000, maximum: 2100 }
  requestBodies:
    Edit:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [version]
            properties:
              subject: { type: string, minLength: 3, maxLength: 300 }
              recipient: { type: string, minLength: 2, maxLength: 300 }
              notes: { type: [string, 'null'], maxLength: 1000 }
              version: { type: integer, minimum: 1 }
    Void:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 10, maxLength: 500 }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Pagination:
      type: object
      required: [page, pageSize, total, pageCount]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        pageCount: { type: integer }
    ResetPeriod:
      type: string
      enum: [YEARLY, MONTHLY]
    IssuerKind:
      type: string
      enum: [ORGANIZATION, UNIT, COMMITTEE, OTHER]
    LetterTypeOption:
      type: object
      required: [code, label, resetPeriod]
      properties:
        code: { type: string }
        label: { type: string }
        resetPeriod: { $ref: '#/components/schemas/ResetPeriod' }
    AllocatedLetter:
      type: object
      required: [id, letterNumber, letterDate, sequence, periodKey, issuerId, issuerCode, typeCode, subject, recipient, status, version]
      properties:
        id: { type: string, format: uuid }
        letterNumber: { type: string, examples: ['UND.007/SDIT/XI/2026'] }
        letterDate: { type: string, format: date }
        sequence: { type: integer }
        periodKey: { type: string }
        issuerId: { type: string, format: uuid }
        issuerCode: { type: string }
        typeCode: { type: string }
        subject: { type: string }
        recipient: { type: string }
        notes: { type: [string, 'null'] }
        status: { type: string, enum: [ALLOCATED] }
        version: { type: integer }
    LetterNumber:
      type: object
      required: [id, letterNumber, letterDate, issuerId, issuerCode, issuerName, typeCode, typeLabel, subject, recipient, status, version]
      properties:
        id: { type: string, format: uuid }
        letterNumber: { type: string }
        letterDate: { type: string, format: date }
        issuerId: { type: string, format: uuid }
        issuerCode: { type: string }
        issuerName: { type: string }
        typeCode: { type: string }
        typeLabel: { type: string }
        subject: { type: string }
        recipient: { type: string }
        notes: { type: [string, 'null'] }
        status: { type: string, enum: [ALLOCATED, VOIDED] }
        voidedAt: { type: [string, 'null'], format: date-time }
        voidReason: { type: [string, 'null'] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        requestedByName: { type: string }
    RegisterRow:
      type: object
      required: [source, id, letterNumber, letterDate, issuerName, typeLabel, subject, status]
      properties:
        source: { type: string, enum: [BOOK, HCIS] }
        id: { type: string, format: uuid }
        letterNumber: { type: string }
        letterDate: { type: string, format: date }
        issuerCode: { type: [string, 'null'] }
        issuerName: { type: string }
        typeCode: { type: string }
        typeLabel: { type: string }
        subject: { type: string }
        recipient: { type: [string, 'null'], description: Always null on HCIS rows }
        status: { type: string, enum: [ACTIVE, VOIDED] }
        voidedAt: { type: [string, 'null'], format: date-time }
        voidReason: { type: [string, 'null'] }
        requestedByName: { type: [string, 'null'], description: Always null on HCIS rows (D-12) }
        version: { type: [integer, 'null'] }
    Issuer:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/IssuerKind' }
        active: { type: boolean }
        organizationalUnitId: { type: [string, 'null'], format: uuid }
        unitName: { type: [string, 'null'] }
        committeeId: { type: [string, 'null'], format: uuid }
        committeeName: { type: [string, 'null'] }
        committeeStatus: { type: [string, 'null'] }
        activeGrants: { type: integer }
    Grant:
      type: object
      properties:
        id: { type: string, format: uuid }
        issuerId: { type: string, format: uuid }
        issuerCode: { type: string }
        issuerName: { type: string }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        employeeNumber: { type: string }
        employeeStatus: { type: string }
        reason: { type: string }
        grantedAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokeReason: { type: [string, 'null'] }
  responses:
    Number:
      description: The number after the change
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LetterNumber' }
    Created:
      description: Saved
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
    Counter:
      description: Counter state
      content:
        application/json:
          schema:
            type: object
            properties:
              issuerId: { type: string, format: uuid }
              typeCode: { type: string }
              periodKey: { type: string }
              lastSequence: { type: integer }
              previous: { type: integer }
    Problem:
      description: Invalid request or refused transition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: DOCUMENT_FORBIDDEN, FORBIDDEN or EMPLOYEE_LINK_REQUIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
