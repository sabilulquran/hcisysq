  - id: ORG-012
    module: organization
    name: Committees (kepanitiaan) with proposal, approval, members, and lifecycle
    legacy_evidence: >-
      Legacy Laravel hcis-ysq: Committee and CommitteeMember models, CommitteeController,
      CommitteeService (routes committees/propose, approve, reject, complete, cancel,
      members). States proposed -> approved -> active -> completed / cancelled / rejected;
      member roles chair, secretary, treasurer, member with joined/left dates; activation
      creates a virtual unit of type committee with its own letter code, deactivated on
      completion or cancellation; committees can issue numbered letters.
    target_status: implemented
    priority: later
    risk: medium
    planning_note: >-
      Found by the 2026-11-02 legacy parity audit; not recorded before. Schools run many
      time-boxed committees (PPDB, ujian, wisuda, Ramadhan, events). Must stay outside the
      ORG-004 authority structure unless an ADR decides otherwise; legacy modelled it as a
      virtual unit, which should not be copied without review. Related to DOC-003 and
      CAL-001 (meeting participants).
    notes: >-
      Package 1 implemented 2026-11-03 (docs/domain/committees.md): HC records committees and
      their line-up (chair, vice chair, secretary, treasurer, section coordinator, member) from
      active employees, decrees them with an SK numbered in the DOC-001 register (code SKP) or
      records an SK signed outside HCIS, completes or cancels them (an HCIS SK is revoked with
      the committee), and reads a yearly participation recap; employees see Kepanitiaan Saya and
      can invite a whole committee to a CAL-001 meeting. Committees stay outside ORG-004: no
      virtual unit, no approval authority. Proposal/approval flow and fees are not included.
    docs:
      - docs/domain/committees.md
      - docs/api/committees.openapi.yaml
      - docs/product/legacy-parity-audit-2026-11-02.md

