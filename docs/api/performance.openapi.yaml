openapi: 3.1.0
info:
  title: HCIS Performance Review (PERF-001 Package 1)
  version: 1.0.0
  description: |
    Performance review cycles, the employee's self-assessment, the rating by the structural line
    manager, and the Human Capital register with validation, recap and per-employee history, as
    implemented in apps/api/src/modules/performance/routes.ts. Spec: docs/domain/performance-review.md.
    All routes use the session cookie and answer with Cache-Control: no-store. Errors use
    { code, message }. No field holds a percentage or money: the tunjangan kinerja link to PAY-003
    is a later package (spec §11). Every list is ENG-LIST-001 paged.
paths:
  /performance/me:
    get:
      tags: [Performance]
      operationId: listMyPerformanceReviews
      summary: The signed-in employee's reviews in open and closed cycles, newest period first
      description: EMPLOYEE principal only. The result columns are null until the review is FINALIZED (D-09).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /performance/me/{id}:
    get:
      tags: [Performance]
      operationId: getMyPerformanceReview
      summary: One of the employee's own reviews; another employee's review is 404
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ReviewDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /performance/me/{id}/self-assessment:
    post:
      tags: [Performance]
      operationId: submitSelfAssessment
      summary: Submit the self-assessment; the review moves to MANAGER_REVIEW
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores]
              properties:
                scores: { $ref: '#/components/schemas/Scores' }
                note: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/Transition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /performance/me/{id}/acknowledge:
    post:
      tags: [Performance]
      operationId: acknowledgePerformanceReview
      summary: Mark a FINALIZED result as read, with an optional comment that changes nothing
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Transition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /performance/team:
    get:
      tags: [Performance]
      operationId: listRaterQueue
      summary: Reviews the signed-in employee is the snapshotted rater of, open cycles first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ReviewStatusFilter'
      responses:
        '200': { $ref: '#/components/responses/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /performance/team/{id}:
    get:
      tags: [Performance]
      operationId: getRaterReview
      summary: One review assigned to the signed-in rater, with the self-assessment; anything else is 404
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ReviewDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /performance/team/{id}/rating:
    post:
      tags: [Performance]
      operationId: submitRating
      summary: The rater scores the review; the server computes the final score and predicate
      description: Allowed after the self-assessment, or after its deadline without one (D-08).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores]
              properties:
                scores: { $ref: '#/components/schemas/Scores' }
                strengths: { type: [string, 'null'], maxLength: 2000 }
                improvements: { type: [string, 'null'], maxLength: 2000 }
                note: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200':
          description: Rated; the review waits for HC validation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: HC_VALIDATION }
                  finalScore: { type: number, minimum: 1, maximum: 4 }
                  predicateCode: { type: string }
                  predicateLabel: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/cycles:
    get:
      tags: [Performance]
      operationId: listPerformanceCycles
      summary: Cycles, newest period first (performance.read)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CycleStatus' }
      responses:
        '200':
          description: One page of cycles
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/CycleSummary'
                        - type: object
                          properties:
                            participantCount: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Performance]
      operationId: createPerformanceCycle
      summary: Create a DRAFT cycle; without a rubric the default rubric (D-05, D-06) is used
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CycleInput'
                - type: object
                  required: [name, kind, periodStart, periodEnd, selfDueOn, reviewDueOn]
      responses:
        '201': { $ref: '#/components/responses/Transition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/cycles/{id}:
    get:
      tags: [Performance]
      operationId: getPerformanceCycle
      summary: One cycle with its rubric, the recap by status and predicate, and cycle-level history
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The cycle
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CycleSummary'
                  - type: object
                    properties:
                      rubric: { $ref: '#/components/schemas/Rubric' }
                      recap:
                        type: object
                        properties:
                          participants: { type: integer }
                          byStatus: { type: object, additionalProperties: { type: integer } }
                          byPredicate:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/Predicate'
                                - type: object
                                  properties:
                                    count: { type: integer }
                          raterMissing: { type: integer }
                          raterAccountNotReady: { type: integer }
                      events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Performance]
      operationId: updatePerformanceCycle
      summary: Change name, period, deadlines or rubric while the cycle is DRAFT
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CycleInput' }
      responses:
        '200': { $ref: '#/components/responses/Transition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/cycles/{id}/participants:
    post:
      tags: [Performance]
      operationId: addPerformanceParticipants
      summary: Add chosen active employees, or every active employee, while the cycle is DRAFT or OPEN
      description: The rater is resolved from the structure and snapshotted per employee (D-01).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [employeeIds]
                  additionalProperties: false
                  properties:
                    employeeIds: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
                - type: object
                  required: [allActive]
                  additionalProperties: false
                  properties:
                    allActive: { type: boolean, const: true }
      responses:
        '200':
          description: What was added
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
                  readded: { type: integer }
                  alreadyIn: { type: integer }
                  withoutRater: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/cycles/{id}/open:
    post:
      tags: [Performance]
      operationId: openPerformanceCycle
      summary: Open a DRAFT cycle with at least one participant; the rubric is frozen
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Transition' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/cycles/{id}/close:
    post:
      tags: [Performance]
      operationId: closePerformanceCycle
      summary: Close an OPEN cycle on or after its last day; unfinished reviews become UNRATED
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: CLOSED }
                  finalized: { type: integer }
                  unrated: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/cycles/{id}/cancel:
    post:
      tags: [Performance]
      operationId: cancelPerformanceCycle
      summary: Cancel a DRAFT cycle; its participants become REMOVED
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Transition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/cycles/{id}/reviews:
    get:
      tags: [Performance]
      operationId: listCycleReviews
      summary: The recap table of one cycle; every filter runs before LIMIT
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ReviewStatusFilter'
        - name: predicate
          in: query
          description: Predicate code; matches FINALIZED reviews only
          schema: { type: string, maxLength: 40 }
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: raterMissing
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: q
          in: query
          description: Server-side search on name or NIP (typeahead)
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/performance/reviews/{id}:
    get:
      tags: [Performance]
      operationId: getPerformanceReviewAsHc
      summary: One review with scores, result, notes and the full history (performance.read)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ReviewDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/performance/reviews/{id}/finalize:
    post:
      tags: [Performance]
      operationId: finalizePerformanceReview
      summary: Validate a rated review; never by the reviewed employee or the rater (D-07)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Transition' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/reviews/{id}/return:
    post:
      tags: [Performance]
      operationId: returnPerformanceReview
      summary: Return a rated review to the rater with a reason; the predicate is cleared
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Transition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/reviews/{id}/rater:
    post:
      tags: [Performance]
      operationId: assignPerformanceRater
      summary: Assign another active employee as rater before the rating is sent
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raterEmployeeId, reason]
              properties:
                raterEmployeeId: { type: string, format: uuid }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  raterEmployeeId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/reviews/{id}/remove:
    post:
      tags: [Performance]
      operationId: removePerformanceReview
      summary: Take an employee out of a DRAFT or OPEN cycle with a reason
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Transition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/performance/employees/{employeeId}/reviews:
    get:
      tags: [Performance]
      operationId: listEmployeePerformanceHistory
      summary: One employee's reviews across every non-cancelled cycle, newest period first
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ReviewStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/ReviewStatus' }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Pagination:
      type: object
      required: [page, pageSize, total, pageCount]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        pageCount: { type: integer }
    CycleKind:
      type: string
      enum: [MONTHLY, ANNUAL]
    CycleStatus:
      type: string
      enum: [DRAFT, OPEN, CLOSED, CANCELLED]
    ReviewStatus:
      type: string
      enum: [SELF_ASSESSMENT, MANAGER_REVIEW, HC_VALIDATION, FINALIZED, UNRATED, REMOVED]
    Scores:
      type: object
      description: Indicator code -> whole number 1..4; every rubric indicator exactly once
      additionalProperties: { type: integer, minimum: 1, maximum: 4 }
    Indicator:
      type: object
      required: [code, label, weight]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,39}$' }
        label: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        weight: { type: integer, minimum: 1, maximum: 100, description: All weights add up to exactly 100 }
    Predicate:
      type: object
      required: [code, label, minScore]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,39}$' }
        label: { type: string, minLength: 1, maxLength: 40 }
        minScore: { type: number, minimum: 1, maximum: 4, description: Inclusive lower bound, two decimals; one predicate starts at 1 }
    Rubric:
      type: object
      required: [indicators, predicates]
      properties:
        indicators: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/Indicator' } }
        predicates: { type: array, minItems: 2, maxItems: 6, items: { $ref: '#/components/schemas/Predicate' } }
    CycleInput:
      type: object
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        kind: { $ref: '#/components/schemas/CycleKind' }
        periodStart: { type: string, format: date, description: MONTHLY = first day of a month; ANNUAL = 1 July }
        periodEnd: { type: string, format: date, description: MONTHLY = last day of the same month; ANNUAL = 30 June }
        selfDueOn: { type: string, format: date }
        reviewDueOn: { type: string, format: date }
        rubric: { $ref: '#/components/schemas/Rubric' }
    CycleSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/CycleKind' }
        status: { $ref: '#/components/schemas/CycleStatus' }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        selfDueOn: { type: string, format: date }
        reviewDueOn: { type: string, format: date }
    ReviewSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        cycleId: { type: string, format: uuid }
        cycleName: { type: string }
        cycleKind: { $ref: '#/components/schemas/CycleKind' }
        cycleStatus: { $ref: '#/components/schemas/CycleStatus' }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        selfDueOn: { type: string, format: date }
        reviewDueOn: { type: string, format: date }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        employeeNumber: { type: string }
        unitName: { type: [string, 'null'] }
        raterEmployeeId: { type: [string, 'null'], format: uuid }
        raterName: { type: [string, 'null'] }
        raterSource: { type: [string, 'null'], enum: [DIRECT_MANAGER, GOVERNANCE_APPROVER, HC_ASSIGNED, null] }
        raterAccountReady: { type: [boolean, 'null'] }
        selfSubmittedAt: { type: [string, 'null'], format: date-time }
        ratedAt: { type: [string, 'null'], format: date-time }
        finalizedAt: { type: [string, 'null'], format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        finalScore: { type: [number, 'null'], minimum: 1, maximum: 4, description: Null for the employee until FINALIZED }
        predicateCode: { type: [string, 'null'] }
        predicateLabel: { type: [string, 'null'] }
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        note: { type: [string, 'null'], description: Hidden from the employee view }
        metadata: { type: object }
        actorName: { type: [string, 'null'] }
    ReviewDetail:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - type: object
          properties:
            rubric: { $ref: '#/components/schemas/Rubric' }
            selfAssessment:
              type: [object, 'null']
              properties:
                scores: { $ref: '#/components/schemas/Scores' }
                note: { type: [string, 'null'] }
            rating:
              type: [object, 'null']
              description: Null for the employee until FINALIZED
              properties:
                scores: { $ref: '#/components/schemas/Scores' }
                strengths: { type: [string, 'null'] }
                improvements: { type: [string, 'null'] }
                note: { type: [string, 'null'] }
            acknowledgementComment: { type: [string, 'null'] }
            removedReason: { type: [string, 'null'] }
            allowedActions:
              type: array
              description: What the caller may do now, decided by the server
              items:
                type: string
                enum: [self-assessment, acknowledge, rate, finalize, return, assign-rater, remove]
            events: { type: array, items: { $ref: '#/components/schemas/Event' } }
  responses:
    ReviewPage:
      description: One page of reviews
      content:
        application/json:
          schema:
            type: object
            required: [items, pagination]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/ReviewSummary' } }
              pagination: { $ref: '#/components/schemas/Pagination' }
    ReviewDetail:
      description: One review
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReviewDetail' }
    Transition:
      description: The new state
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, format: uuid }
              status: { type: string }
    Problem:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: No session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Not an active employee, missing permission, or self-validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or not the caller's to see
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The state does not allow this transition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
