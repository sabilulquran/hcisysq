openapi: 3.1.0
info:
  title: HCIS Employment Administration (EMP-005 / EMP-006 / EMP-010)
  version: 0.10.0
  description: |
    Package 1 steps S2, S4, S5, S5A and S6 (docs/domain/employment-administration-package1.md).
    Read API, SHADOW consistency report, rollout mode, the EMP-010 register of
    Perjanjian Kerja and Surat Keputusan, the four contract actions (HIRE,
    CONTRACT_EXTENSION, CATEGORY_CHANGE, TERMINATION) and the career actions
    (PLACEMENT, PLACEMENT_END, TRANSFER, PROMOTION, DEMOTION). Reversal arrives in S7.
    Reads and the register need a mode other than OFF; recording or previewing an
    action needs AUTHORITATIVE (spec §8.1), which S5A made available — switching
    production to it still follows the S8 runbook.
    S5A also adds the time-boxed reactivation of a former employee's account
    (spec §8.5.2) under /admin/access/accounts/{accountId}/temporary-reactivations.
    employment.* is HC-only and never granted through legacy Super Admin compatibility.
    Read endpoints return 409 EMPLOYMENT_HISTORY_DISABLED while the rollout mode is OFF.
    Package 2 step P2-2 (docs/domain/employment-administration-package2.md)
    adds the employee's education and skill records, their verification and
    voiding, and the "certificates about to expire" worklist. Those endpoints
    introduce no permission of their own: reading needs employees.read.all and
    writing employees.manage (Package 2 spec 5.1), so unlike employment.* they
    are reachable through legacy Super Admin compatibility.
    Step P2-3 adds the employee's family members, dependants and emergency
    contacts (EMP-009) and the dated addresses (EMP-003), under the same two
    permissions. A family identity number is never accepted: the request
    schema refuses the field outright and the column stays empty until column
    encryption exists (Package 2 spec 8). Recording an address of a kind that
    is already in force is a move, not an edit: the API closes the previous
    one the day before the new one starts, in the same transaction.
    Step P2-4 closes EMP-003: an employee proposes a change to their own data
    and one HC officer decides. The employee id always comes from the session,
    so someone else's proposal answers 404 exactly as a missing one does.
    Accepting writes the change in the same transaction as the decision, and
    the payload is validated again at that moment, because the rules may have
    moved while it waited.
    Step S2B marks the records HCIS does not manage (BUMY staff, Pengurus
    Yayasan). A marked record stays readable and stops being writable: every
    write path answers 409 EMPLOYEE_OUTSIDE_HCIS_READ_ONLY, and the employee
    import skips the row rather than updating it.
    All responses carry Cache-Control: no-store.
paths:
  /admin/employment/rollout:
    get:
      tags: [Employment]
      operationId: getEmploymentRollout
      summary: Current employment-history rollout mode (governance)
      description: Requires access.governance.manage. Absence of a setting means OFF.
      responses:
        '200':
          description: Current mode
          content:
            application/json:
              schema:
                type: object
                required: [mode, changedAt, availableModes]
                properties:
                  mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
                  changedAt: { type: [string, 'null'], format: date-time }
                  availableModes:
                    type: array
                    items: { $ref: '#/components/schemas/EmploymentRolloutMode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Employment]
      operationId: setEmploymentRollout
      summary: Change the rollout mode with an audited reason (governance)
      description: |
        Requires access.governance.manage. AUTHORITATIVE is refused with
        EMPLOYMENT_MODE_NOT_AVAILABLE until actions, projection, and automatic
        account deactivation (S5/S5A) are released. Audited as employment.mode.changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, reason]
              properties:
                mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: Mode changed
          content:
            application/json:
              schema:
                type: object
                required: [from, to]
                properties:
                  from: { $ref: '#/components/schemas/EmploymentRolloutMode' }
                  to: { $ref: '#/components/schemas/EmploymentRolloutMode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/employment:
    get:
      tags: [Employment]
      operationId: getEmployeeEmployment
      summary: Derived current employment plus full employment history of one employee
      description: Requires employment.read. Current state is derived from effective-dated records for `date`.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
        - name: date
          in: query
          required: false
          description: Asia/Jakarta business date; defaults to today.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Employment summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/employment/timeline:
    get:
      tags: [Employment]
      operationId: getEmployeeEmploymentTimeline
      summary: Employment actions of one employee, newest first, without reason notes
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                type: object
                required: [mode, items]
                properties:
                  mode: { $ref: '#/components/schemas/EmploymentRolloutMode' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EmploymentAction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employment/consistency:
    get:
      tags: [Employment]
      operationId: getEmploymentConsistencyReport
      summary: SHADOW review of baseline issues and master-vs-history differences
      description: Requires employment.read. Computed on read; nothing is written.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: code
          in: query
          required: false
          description: Only rows with this issue code.
          schema: { type: string, maxLength: 64 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Grouped issue counts and paginated rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentConsistencyReport' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/decision-documents:
    get:
      tags: [Employment]
      operationId: listDecisionDocuments
      summary: Register of Perjanjian Kerja or Surat Keputusan (EMP-010)
      description: Requires employment.read. One kind per request; PK and SK are separate series.
      parameters:
        - { name: kind, in: query, required: true, schema: { $ref: '#/components/schemas/DecisionDocumentKind' } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 }, description: Number, subject, employee name, or employee number. }
        - { name: year, in: query, schema: { type: integer }, description: Signing year. }
        - { name: pkType, in: query, schema: { $ref: '#/components/schemas/PkType' } }
        - { name: skType, in: query, schema: { $ref: '#/components/schemas/SkType' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/PkCategory' } }
        - { name: employeeId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: One page of the register
          content:
            application/json:
              schema:
                type: object
                required: [kind, page, pageSize, total, rows]
                properties:
                  kind: { $ref: '#/components/schemas/DecisionDocumentKind' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  rows: { type: array, items: { $ref: '#/components/schemas/DecisionDocument' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [Employment]
      operationId: createDecisionDocument
      summary: Record a Perjanjian Kerja or a Surat Keputusan (EMP-010)
      description: |
        Requires employment.manage. Package 1 stores metadata only; no file upload.
        Audited as employment.document.recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionDocumentWrite' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionDocument' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/decision-documents/{documentId}:
    get:
      tags: [Employment]
      operationId: getDecisionDocument
      summary: One document with the actions that use it and its corrections
      description: Requires employment.read.
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionDocumentDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Employment]
      operationId: updateDecisionDocument
      summary: Edit a document no action uses yet (EMP-010-B)
      description: |
        Requires employment.manage. The body replaces the document in full, so an
        omitted optional field is cleared. Rejected with DECISION_DOCUMENT_LOCKED
        once the document is linked to a recorded action; use the correction path
        instead. The kind, and the employee of a Perjanjian Kerja, cannot change.
        The lock and the kind are checked on the row read under FOR UPDATE, so an
        action linking the document meanwhile is never missed.
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionDocumentEdit' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionDocument' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/decision-documents/{documentId}/corrections:
    post:
      tags: [Employment]
      operationId: correctDecisionDocument
      summary: Audited correction that keeps the prior values (EMP-010-B, D-09)
      description: |
        Requires employment.correct. Works on a locked document; the previous values
        are stored as a correction record. Audited as employment.document.corrected.
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/DecisionDocumentEdit' }
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: Corrected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionDocument' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/employment-actions/preview:
    post:
      tags: [Employment]
      operationId: previewEmploymentAction
      summary: Validate an action and show "dari -> menjadi" without writing (EMP-005)
      description: |
        Requires employment.manage and mode AUTHORITATIVE. Returns the planned result
        and its warnings; the basis-document and warning-acknowledgement checks belong
        to recording, so a preview succeeds without a document.
      parameters: [{ $ref: '#/components/parameters/EmployeeId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmploymentActionRequest' }
      responses:
        '200':
          description: Planned result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentActionPreview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/employees/{employeeId}/employment-actions:
    post:
      tags: [Employment]
      operationId: recordEmploymentAction
      summary: Record one contract action (EMP-005)
      description: |
        Requires employment.manage, mode AUTHORITATIVE, and an Idempotency-Key header;
        a replayed key returns the original action with replayed=true and 200 instead
        of writing again, and the same key used for another employee is refused with
        IDEMPOTENCY_KEY_CONFLICT rather than silently dropping that action. The replay
        lookup runs after authentication. Rows, action, document links, the nine projected employees
        columns and the audit events are written in one transaction. An employee whose
        own account records the action is refused (EMPLOYMENT_SELF_ACTION_FORBIDDEN).
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmploymentActionRequest' }
      responses:
        '200':
          description: Replay of an already recorded action
          content:
            application/json:
              schema:
                type: object
                required: [actionId, replayed]
                properties:
                  actionId: { type: string, format: uuid }
                  replayed: { type: boolean, enum: [true] }
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [actionId, replayed]
                properties:
                  actionId: { type: string, format: uuid }
                  replayed: { type: boolean, enum: [false] }
                  projection:
                    oneOf:
                      - { $ref: '#/components/schemas/EmployeeProjection' }
                      - type: 'null'
                    description: Absent values mean the history cannot speak for the employee yet.
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /admin/access/accounts/{accountId}/temporary-reactivations:
    get:
      tags: [Employment]
      operationId: listAccountTemporaryReactivations
      summary: Grants of temporary access for a former employee (EMP-005 D-15)
      description: Requires access.accounts.temporary_reactivate (human_capital_admin only).
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '200':
          description: Every grant of this account, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccountTemporaryReactivation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Employment]
      operationId: grantAccountTemporaryReactivation
      summary: Grant time-boxed access to a former employee's account (EMP-005 D-15)
      description: |
        Requires access.accounts.temporary_reactivate. Reason and expiry are
        mandatory, the expiry is at most 30 days away, and granting to one's own
        account is refused. The grant opens only own payslips, own attendance
        history and own leave history, read-only; every other request answers
        EMPLOYMENT_ENDED_READ_ONLY. An existing live grant is revoked first, so
        extending always leaves its own audited record.
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expiresAt]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
                expiresAt: { type: string, format: date-time }
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema:
                type: object
                required: [id, accountId, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  accountId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/access/accounts/{accountId}/temporary-reactivations/{grantId}/revoke:
    post:
      tags: [Employment]
      operationId: revokeAccountTemporaryReactivation
      summary: End a temporary reactivation early (EMP-005 D-15)
      description: |
        Requires access.accounts.temporary_reactivate. The account returns to
        inactive and its sessions are revoked immediately.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [id, revoked]
                properties:
                  id: { type: string, format: uuid }
                  revoked: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/education:
    get:
      tags: [EmployeeProfile]
      operationId: listEmployeeEducation
      summary: Education records of one employee, with the derived highest level
      description: |
        Requires employees.read.all. `highestLevel` is derived from the verified,
        unvoided records only; PONDOK and LAINNYA are never ranked (spec 5.6).
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      responses:
        '200':
          description: Education records
          content:
            application/json:
              schema:
                type: object
                required: [rows, highestLevel]
                properties:
                  rows: { type: array, items: { $ref: '#/components/schemas/EducationRecord' } }
                  highestLevel:
                    oneOf:
                      - { $ref: '#/components/schemas/EducationLevel' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [EmployeeProfile]
      operationId: recordEmployeeEducation
      summary: Record one education entry
      description: Requires employees.manage. Never overwrites an earlier record.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EducationInput' }
      responses:
        '201':
          description: The recorded entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/education-records/{recordId}:
    patch:
      tags: [EmployeeProfile]
      operationId: amendEmployeeEducation
      summary: Amend one education entry
      description: |
        Requires employees.manage. The row is locked for the whole transaction,
        and a voided record is refused with EMPLOYEE_RECORD_VOIDED.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EducationInput' }
      responses:
        '200':
          description: The amended entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/employees/{employeeId}/skills:
    get:
      tags: [EmployeeProfile]
      operationId: listEmployeeSkills
      summary: Skills and certificates of one employee
      description: |
        Requires employees.read.all. `expired` is derived against the Asia/Jakarta
        business date; a lapsed certificate is flagged, never rewritten (spec 5.3).
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      responses:
        '200':
          description: Skill records
          content:
            application/json:
              schema:
                type: object
                required: [rows, date]
                properties:
                  rows: { type: array, items: { $ref: '#/components/schemas/SkillRecord' } }
                  date: { type: string, format: date }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [EmployeeProfile]
      operationId: recordEmployeeSkill
      summary: Record one skill or certificate
      description: Requires employees.manage.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInput' }
      responses:
        '201':
          description: The recorded entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/skill-records/{recordId}:
    patch:
      tags: [EmployeeProfile]
      operationId: amendEmployeeSkill
      summary: Amend one skill or certificate
      description: Requires employees.manage. A voided record is refused.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInput' }
      responses:
        '200':
          description: The amended entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/education-records/{recordId}/verification:
